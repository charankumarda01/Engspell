<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="description" content="EngSpell — Speak · Spell · Shine. The complete English mastery studio: foundations to fluency, powered by an adaptive trainer and Nova, a speaking coach you actually talk to.">
<meta name="theme-color" content="#0a0f1e">
<title>EngSpell — Speak · Spell · Shine</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DESIGN SYSTEM — EngSpell (M8 Polish)
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

:root {
  /* M8 Design Tokens */
  --bg0: #070b16;
  --bg1: #0a0f1e;
  --bg2: #101830;
  --bg3: #16203c;
  --line: rgba(148,163,216,.14);
  --txt: #e8ecf8;
  --mut: #9aa6c9;
  --acc: #7c5cff;
  --acc2: #5eead4;
  --gold: #fbbf24;
  --ok: #34d399;
  --warn: #f59e0b;
  --bad: #f87171;
  --grad: linear-gradient(135deg, #7c5cff, #ec4899);
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --sh1: 0 1px 2px rgba(0,0,0,.35);
  --sh2: 0 12px 32px rgba(3,7,20,.45);
  --sp: 4px;

  /* Backward Compatibility Aliases */
  --bg: var(--bg1);
  --border: var(--line);
  --accent: var(--acc);
  --accent2: #6d28d9;
  --accent3: #a78bfa;
  --green: var(--ok);
  --red: var(--bad);
  --text: var(--txt);
  --muted: var(--mut);
  --sidebar-w: 240px;
  --topbar-h: 56px;
  --mobbar-h: 62px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg0);
  color: var(--txt);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Accessibility: Reduced Motion (M14) ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ── Accessibility: Focus Visible Ring (M14) ── */
:focus-visible,
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
.btn:focus-visible,
.flow-chip:focus-visible,
.mob-slot:focus-visible,
.nav-item:focus-visible,
[role="button"]:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--acc2) !important;
  outline-offset: 2px !important;
}


/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg0); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; border: 1px solid var(--line); }

/* ── Layout ── */
#app { display: flex; flex-direction: column; height: 100vh; }

#topbar {
  height: var(--topbar-h);
  background: rgba(10,15,30,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  flex-shrink: 0;
}

.brand {
  font-size: 1.15rem;
  font-weight: 800;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.02em;
}

.topbar-right {
  display: flex;
  gap: 12px;
  font-size: 0.85rem;
  font-weight: 600;
}

#xp-display { color: var(--gold); }
#streak-display { color: #f97316; }

#layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  background: var(--bg0);
}

#sidebar {
  width: var(--sidebar-w);
  background: var(--bg1);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  flex-shrink: 0;
}

#nav {
  display: flex;
  flex-direction: column;
  padding: 16px 10px;
  gap: 16px;
}

.nav-section {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-section-label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mut);
  padding: 4px 10px;
  opacity: 0.75;
}

.nav-section-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px;
  border-radius: var(--r-sm);
  text-decoration: none;
  color: var(--mut);
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s ease;
  position: relative;
  border: 1px solid transparent;
}

.nav-item:hover {
  background: var(--bg3);
  color: var(--txt);
}

.nav-item.active {
  background: rgba(124,92,255,0.18);
  color: #ffffff;
  border-color: rgba(124,92,255,0.38);
  font-weight: 600;
}

.nav-icon {
  font-size: 15px;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}

.nav-label {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-badge {
  background: var(--bad);
  color: #ffffff;
  font-size: 11px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}

#view {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  max-width: 960px;
  margin: 0 auto;
  width: 100%;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 180ms ease, transform 180ms ease;
}

#view.view-entering {
  opacity: 0;
  transform: translateY(6px);
  transition: none;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  #view, #view.view-entering {
    opacity: 1 !important;
    transform: none !important;
    transition: none !important;
  }
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg3);
  border: 1px solid var(--line);
  color: var(--txt);
  padding: 10px 20px;
  border-radius: 24px;
  font-size: 0.9rem;
  font-weight: 500;
  z-index: 1000;
  transition: transform 0.3s ease;
  white-space: nowrap;
  box-shadow: var(--sh2);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--ok); color: var(--ok); }
.toast.error { border-color: var(--bad); color: var(--bad); }
.toast.info { border-color: var(--acc); color: var(--acc); }

/* ── Typography ── */
h1 { font-size: 28px; font-weight: 800; line-height: 1.25; margin-bottom: 8px; color: var(--txt); }
h2 { font-size: 20px; font-weight: 700; line-height: 1.35; margin-bottom: 8px; color: var(--txt); }
h3 { font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; color: var(--txt); }
.hero-title { font-size: 40px; font-weight: 900; line-height: 1.15; }
.sub { color: var(--mut); font-size: 14px; margin-bottom: 20px; }
.muted { color: var(--mut); }
.small { font-size: 12px; }
.section-title { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acc); margin: 24px 0 12px; }

/* ── Button System ── */
.btn, button, .btn-primary, .btn-secondary, .btn-ghost, .btn-danger, .btn-sm, .btn-mic, .btn-back, .btn-link, .btn-whatsapp, .btn-check {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  border-radius: var(--r-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  transition: all 0.15s ease;
  border: 1px solid transparent;
  padding: 9px 18px;
  outline: none;
  box-sizing: border-box;
}

.btn:focus-visible, button:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}

.btn-primary {
  background: var(--grad);
  color: #ffffff;
  border: none;
  box-shadow: 0 4px 14px rgba(124,92,255,0.35);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(124,92,255,0.45);
}
.btn-primary:active {
  transform: translateY(0);
}

.btn-secondary {
  background: var(--bg3);
  color: var(--txt);
  border-color: var(--line);
}
.btn-secondary:hover {
  background: var(--bg2);
  border-color: rgba(148,163,216,0.3);
}

.btn-ghost {
  background: transparent;
  color: var(--txt);
  border: 1px solid var(--line);
}
.btn-ghost:hover {
  background: var(--bg3);
  border-color: var(--acc);
  color: #fff;
}

.btn-danger {
  background: rgba(248,113,113,0.14);
  color: var(--bad);
  border: 1px solid rgba(248,113,113,0.3);
}
.btn-danger:hover {
  background: rgba(248,113,113,0.22);
}

.btn-sm {
  padding: 4px 10px;
  font-size: 12px;
  border-radius: 8px;
  background: var(--bg3);
  color: var(--txt);
  border: 1px solid var(--line);
}
.btn-sm:hover {
  background: rgba(124,92,255,0.2);
  border-color: var(--acc);
}

.btn-mic {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: #fff;
  border: none;
  box-shadow: 0 4px 12px rgba(239,68,68,0.35);
}
.btn-mic:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(239,68,68,0.45);
}

.btn-link {
  background: transparent;
  color: var(--acc);
  border: none;
  padding: 6px 12px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn-link:hover {
  color: #a78bfa;
}

.btn-back {
  background: var(--bg3);
  color: var(--mut);
  border: 1px solid var(--line);
  padding: 6px 14px;
}
.btn-back:hover {
  color: var(--txt);
  border-color: var(--acc);
}

.btn-whatsapp {
  background: #25d366;
  color: #ffffff;
  border: none;
  box-shadow: 0 4px 12px rgba(37,211,102,0.3);
}
.btn-check {
  background: var(--ok);
  color: #ffffff;
  border: none;
}

/* ── Unified Cards ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 16px 20px;
  box-shadow: var(--sh1);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.card:hover {
  transform: translateY(-1px);
  box-shadow: var(--sh2);
  border-color: rgba(124,92,255,0.35);
}
.card-icon { font-size: 2rem; margin-bottom: 12px; }
.card-body h3 { font-size: 1rem; }
.card-body p { color: var(--mut); font-size: 0.85rem; }
.card-arrow { font-size: 1.2rem; color: var(--acc); align-self: center; }
.card-next, .card-daily { display: flex; align-items: flex-start; gap: 16px; cursor: pointer; }

/* ── Tab bar ── */
.tab-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.tab-btn {
  background: var(--bg3);
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  border: 1px solid var(--border);
}
.tab-btn.active {
  background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(109,40,217,0.2));
  color: var(--accent3);
  border-color: rgba(124,58,237,0.4);
}
.tab-btn:hover { color: var(--text); }

/* ── Options (quiz, blanks) ── */
.opt-btn {
  background: var(--bg3);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 0.9rem;
  border: 1px solid var(--border);
  text-align: left;
  transition: all 0.15s;
}
.opt-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(124,58,237,0.15); }
.opt-btn:disabled { opacity: 0.6; cursor: default; }
.opts-row { display: flex; flex-direction: column; gap: 8px; }

/* ── Score chips ── */
.score-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.chip { padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; }
.chip.ok { background: rgba(16,185,129,0.2); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
.chip.bad { background: rgba(239,68,68,0.2); color: var(--red); border: 1px solid rgba(239,68,68,0.3); cursor: pointer; }
.chip.bad:hover { background: rgba(239,68,68,0.3); }

/* ── Verdict ── */
.verdict { padding: 8px 16px; border-radius: 8px; font-weight: 600; margin-top: 8px; }
.verdict.pass { background: rgba(16,185,129,0.15); color: var(--green); }
.verdict.almost { background: rgba(245,158,11,0.15); color: var(--gold); }
.verdict.fail { background: rgba(239,68,68,0.15); color: var(--red); }

/* ── Mastery dots ── */
.mastery-dots { display: flex; gap: 3px; margin: 4px 0; }
.dot { font-size: 0.6rem; color: var(--bg3); }
.dot.filled { color: var(--gold); }
.mastery-dots.big .dot { font-size: 1rem; }

/* ── Inputs ── */
input[type="text"], input[type="search"], input[type="number"], input[type="password"],
textarea, select {
  background: var(--bg3);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  color: var(--txt);
  font-family: inherit;
  font-size: 14px;
  padding: 10px 14px;
  width: 100%;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--acc);
  box-shadow: 0 0 0 2px rgba(124,92,255,0.3);
}
textarea { resize: vertical; min-height: 80px; }
input[type="range"] { width: 100%; accent-color: var(--acc); }

/* ── CEFR badge ── */
.cefr-badge {
  display: inline-block;
  background: var(--grad);
  color: #ffffff;
  font-size: 2rem;
  font-weight: 800;
  padding: 12px 28px;
  border-radius: var(--r-lg);
  margin: 16px 0;
  box-shadow: var(--sh2);
}
.cefr-badge.big { font-size: 3rem; padding: 16px 40px; }

/* ── Level badge ── */
.level-badge { padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
.level-badge.A1 { background: rgba(52,211,153,0.18); color: var(--ok); border: 1px solid rgba(52,211,153,0.3); }
.level-badge.A2 { background: rgba(52,211,153,0.24); color: var(--ok); border: 1px solid rgba(52,211,153,0.35); }
.level-badge.B1 { background: rgba(245,158,11,0.18); color: var(--warn); border: 1px solid rgba(245,158,11,0.3); }
.level-badge.B2 { background: rgba(245,158,11,0.24); color: var(--warn); border: 1px solid rgba(245,158,11,0.35); }
.level-badge.C1 { background: rgba(248,113,113,0.2); color: var(--bad); border: 1px solid rgba(248,113,113,0.35); }

/* ── Live Drill Chips (M9) ── */
.live-drill-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}
.live-chip {
  display: inline-flex;
  align-items: center;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 1.05rem;
  font-weight: 600;
  transition: all 0.1s ease;
}
.live-chip.chip-matched {
  background: rgba(52, 211, 153, 0.18);
  color: var(--ok);
  border: 1px solid var(--ok);
}
.live-chip.chip-current {
  background: rgba(94, 234, 212, 0.22);
  color: var(--acc2);
  border: 2px solid var(--acc2);
  box-shadow: 0 0 12px rgba(94, 234, 212, 0.4);
  animation: pulse-ring 1.2s infinite ease-in-out;
}
.live-chip.chip-upcoming {
  background: rgba(154, 166, 201, 0.08);
  color: var(--mut);
  opacity: 0.55;
  border: 1px dashed rgba(154, 166, 201, 0.25);
}
@keyframes pulse-ring {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* ── Empty State Pattern ── */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  background: var(--bg2);
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
  margin: 16px 0;
}
.empty-icon {
  font-size: 40px;
  line-height: 1;
  margin-bottom: 12px;
  display: inline-block;
}
.empty-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--txt);
  margin-bottom: 6px;
}
.empty-hint {
  font-size: 14px;
  color: var(--mut);
  max-width: 400px;
  margin-bottom: 16px;
  line-height: 1.5;
}

/* ── HOME ORIENTING SCREEN ── */
.view-home { display: flex; flex-direction: column; gap: 20px; }
.home-greeting-band {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  background: var(--bg2);
}
.home-greeting-band h1 { margin-bottom: 4px; font-size: 26px; }
.home-greeting-band .sub { margin-bottom: 0; }
.stat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.stat-pill {
  background: var(--bg3);
  border: 1px solid var(--line);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
}
.xp-pill { color: var(--gold); border-color: rgba(251,191,36,0.3); }
.streak-pill { color: #f97316; border-color: rgba(249,115,22,0.3); }
.level-pill { color: var(--acc2); border-color: rgba(94,234,212,0.3); }
.due-pill { color: var(--acc); text-decoration: none; border-color: rgba(124,92,255,0.35); }
.due-pill:hover { background: rgba(124,92,255,0.15); }

/* ── MOAT-FIRST HERO CARDS (M13) ── */
.home-heroes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin: 4px 0 8px;
}
.home-hero-card {
  background: linear-gradient(135deg, rgba(16,24,48,0.9) 0%, rgba(22,32,60,0.95) 100%);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 22px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--sh1);
}
.home-hero-card:hover {
  border-color: var(--acc);
  transform: translateY(-2px);
  box-shadow: var(--sh2);
}
.hero-card-badge {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--acc2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}
.hero-card-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--txt);
  line-height: 1.35;
  margin-bottom: 8px;
}
.hero-card-sub {
  font-size: 0.88rem;
  color: var(--mut);
  line-height: 1.5;
  margin-bottom: 14px;
  flex: 1;
}
.hero-card-action {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--acc2);
}
@media (max-width: 768px) {
  .home-heroes {
    grid-template-columns: 1fr;
  }
}

.start-here-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}
.start-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  cursor: pointer;
  text-decoration: none;
  position: relative;
}
.start-card-icon { font-size: 28px; line-height: 1; }
.start-card-body h3 { font-size: 16px; margin-bottom: 4px; color: var(--txt); }
.start-card-body p { color: var(--mut); font-size: 13px; line-height: 1.4; margin: 0; }
.start-card-action {
  font-size: 13px;
  font-weight: 700;
  color: var(--acc);
  margin-top: auto;
  display: inline-flex;
  align-items: center;
}

/* ── REVIEW (MISSION 2) ── */

.review-empty-icon { font-size: 3rem; margin-bottom: 16px; }
.review-progress { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
.review-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; margin-bottom: 24px; }
.rc-type { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent3); margin-bottom: 12px; }
.rc-text { font-size: 1.8rem; font-weight: 800; margin-bottom: 12px; cursor: pointer; }
.review-prompt { text-align: center; font-weight: 600; margin-bottom: 16px; }
.review-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ── READING CORNER (MISSION 4) ── */
.view-read { display: flex; flex-direction: column; gap: 24px; max-width: 900px; margin: 0 auto; }
.read-home-header h1 { font-size: 1.8rem; margin-bottom: 6px; }
.read-home-header .sub { color: var(--muted); font-size: 0.95rem; }
.saved-words-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
.saved-words-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.saved-words-header h3 { font-size: 1.1rem; color: var(--gold); }
.badge-count { background: rgba(245,158,11,0.15); color: var(--gold); font-size: 0.8rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.empty-saved { font-size: 0.9rem; margin: 8px 0; }
.saved-words-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.saved-word-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 0.85rem; }
.sw-word { font-weight: 700; color: var(--text); }
.sw-ipa { font-size: 0.8rem; color: var(--accent3); font-family: monospace; }
.sw-play, .sw-remove { background: none; border: none; cursor: pointer; font-size: 0.85rem; padding: 2px; color: var(--muted); border-radius: 4px; transition: color 0.15s; }
.sw-play:hover { color: var(--accent3); }
.sw-remove:hover { color: var(--red); }
.read-sections { display: flex; flex-direction: column; gap: 28px; }
.read-level-group { display: flex; flex-direction: column; gap: 14px; }
.read-level-header { display: flex; align-items: center; gap: 10px; }
.level-badge { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 800; font-size: 0.8rem; padding: 3px 10px; border-radius: 6px; }
.level-count { font-size: 0.85rem; color: var(--muted); }
.read-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.read-passage-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 18px; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; justify-content: space-between; }
.read-passage-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.rpc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.rpc-level { font-size: 0.75rem; font-weight: 700; color: var(--accent3); background: rgba(124,58,237,0.15); padding: 2px 8px; border-radius: 6px; }
.rpc-saved { font-size: 0.75rem; color: var(--gold); font-weight: 600; }
.rpc-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
.rpc-excerpt { font-size: 0.85rem; color: var(--muted); line-height: 1.5; margin-bottom: 14px; flex: 1; }
.rpc-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px; }
.rpc-btn { color: var(--accent3); font-weight: 600; }
.open-passage { display: flex; flex-direction: column; gap: 20px; }
.read-header { display: flex; flex-direction: column; gap: 10px; }
.read-title-row { display: flex; align-items: center; gap: 12px; }
.read-meta { display: flex; gap: 14px; font-size: 0.85rem; color: var(--muted); }
.saved-counter { color: var(--gold); font-weight: 600; }
.read-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.read-hint { font-size: 0.88rem; color: var(--accent3); background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.2); border-radius: 10px; padding: 10px 14px; }
.read-text-container { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; font-size: 1.15rem; line-height: 2; color: #e2e8f0; }
.read-word { cursor: pointer; border-radius: 4px; padding: 1px 3px; transition: all 0.15s; display: inline-block; }
.read-word:hover { background: rgba(124,58,237,0.25); color: #fff; text-shadow: 0 0 1px #a78bfa; }
.word-chip-container { position: sticky; bottom: 16px; z-index: 100; margin-top: 8px; }
.word-chip { background: var(--bg2); border: 1px solid var(--acc); border-radius: 16px; padding: 18px 22px; box-shadow: var(--sh2); display: flex; flex-direction: column; gap: 10px; }
.word-chip.empty { border-color: var(--line); background: var(--bg2); text-align: center; font-size: 0.85rem; color: var(--mut); padding: 14px; }
.wc-top { display: flex; justify-content: space-between; align-items: center; }
.wc-title-area { display: flex; align-items: baseline; gap: 12px; }
.wc-word { font-size: 1.4rem; font-weight: 800; color: #fff; }
.wc-ipa { font-size: 1rem; color: var(--acc); font-family: monospace; }
.wc-close { background: none; border: none; color: var(--mut); font-size: 1.1rem; cursor: pointer; }
.wc-close:hover { color: #fff; }
.wc-meaning { font-size: 0.9rem; color: var(--txt); }
.wc-eg { font-size: 0.85rem; color: var(--mut); }
.wc-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

/* ── XP pop ── */
.xp-pop { position: absolute; pointer-events: none; font-size: 0.9rem; font-weight: 700; color: var(--gold); animation: xpFloat 1.5s ease forwards; z-index: 500; }
@keyframes xpFloat {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-40px); }
}

/* ── Not found ── */
.not-found { text-align: center; padding: 60px 20px; color: var(--mut); }

/* ── Mobile 5-Slot Bottom Bar & Sheet (M8) ── */
#mobile-bar {
  display: none;
}
#nav-more-sheet {
  display: none;
}

@media (max-width: 880px) {
  #sidebar { display: none !important; }
  #view {
    padding: 16px 14px calc(var(--mobbar-h) + env(safe-area-inset-bottom, 16px) + 20px);
    max-width: 100%;
  }

  #mobile-bar {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(var(--mobbar-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: rgba(10,15,30,0.96);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    z-index: 250;
    align-items: center;
    justify-content: space-around;
  }

  .mob-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: var(--mut);
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    flex: 1;
    height: 100%;
    padding: 6px 2px;
    border: none;
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: color 0.15s;
    outline: none;
  }
  .mob-slot:hover, .mob-slot.active {
    color: var(--acc2);
  }
  .mob-slot.active .mob-label {
    font-weight: 700;
    color: #ffffff;
  }
  .mob-slot .mob-icon {
    font-size: 18px;
    line-height: 1.2;
  }
  .mob-slot.mob-fab .mob-icon {
    background: var(--grad);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(124,92,255,0.4);
    color: #ffffff;
  }
  .mob-slot .nav-badge {
    position: absolute;
    top: 6px;
    right: calc(50% - 18px);
  }

  /* Bottom Sheet Overlay */
  #nav-more-sheet {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 300;
    pointer-events: none;
    visibility: hidden;
    transition: visibility 0.2s;
  }
  #nav-more-sheet.open {
    pointer-events: auto;
    visibility: visible;
  }
  #nav-more-sheet .sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(4,7,15,0.75);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  #nav-more-sheet.open .sheet-backdrop {
    opacity: 1;
  }
  #nav-more-sheet .sheet-panel {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 80vh;
    background: var(--bg1);
    border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    transform: translateY(100%);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 20px);
    box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
  }
  #nav-more-sheet.open .sheet-panel {
    transform: translateY(0);
  }
  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  .sheet-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--txt);
  }
  .sheet-close {
    background: var(--bg3);
    border: 1px solid var(--line);
    color: var(--mut);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    padding: 0;
  }
  .sheet-close:hover {
    color: #fff;
    border-color: var(--acc);
  }
  .sheet-content {
    padding: 16px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .sheet-section {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sheet-sec-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--mut);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .sheet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
  }
  .sheet-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    color: var(--txt);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
  }
  .sheet-item:hover {
    background: var(--bg3);
    border-color: var(--acc);
  }

  .trainer-grid { grid-template-columns: 1fr; }
  .ds-layout { grid-template-columns: 1fr; }
  .resume-layout { grid-template-columns: 1fr; }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DOCUMENT STUDIO
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

.ds-upload-btn { cursor: pointer; }
.ds-layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; min-height: 520px; }
.ds-sidebar { display: flex; flex-direction: column; gap: 8px; background: var(--bg2); border-radius: 14px; padding: 16px; border: 1px solid var(--border); overflow-y: auto; max-height: 640px; }

.ds-empty { color: var(--muted); font-size: 0.85rem; line-height: 1.6; }

.ds-paste-section textarea { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 10px; font-size: 0.85rem; resize: vertical; font-family: inherit; }
.ds-paste-row { display: flex; gap: 8px; }
.ds-paste-row input { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 12px; font-size: 0.85rem; }
.ds-reader { background: var(--bg2); border-radius: 14px; border: 1px solid var(--border); padding: 24px; overflow-y: auto; max-height: 640px; }
.ds-no-doc { text-align: center; padding: 60px 20px; color: var(--muted); }

.ds-reader-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.ds-reader-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }

.ds-reader-actions { display: flex; gap: 8px; flex-shrink: 0; }
.ds-doc-tip { background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.2); border-radius: 10px; padding: 10px 14px; font-size: 0.82rem; color: var(--accent3); margin-bottom: 16px; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RESUME ANALYZER
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.view-resume { display: flex; flex-direction: column; gap: 20px; }
.resume-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.resume-input-panel { display: flex; flex-direction: column; gap: 10px; background: var(--bg2); border-radius: 14px; padding: 20px; border: 1px solid var(--border); }
.resume-input-header { display: flex; align-items: center; gap: 10px; }
.resume-input-header label.section-title { flex: 1; }
.resume-input-panel textarea { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 12px; font-size: 0.9rem; resize: vertical; font-family: inherit; line-height: 1.7; }
.resume-actions { display: flex; gap: 10px; align-items: center; }
.resume-select { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 12px; font-size: 0.85rem; flex: 1; }
.resume-report-panel { background: var(--bg2); border-radius: 14px; padding: 20px; border: 1px solid var(--border); overflow-y: auto; max-height: 640px; }
.resume-empty { text-align: center; padding: 48px 20px; color: var(--muted); }

.resume-report { display: flex; flex-direction: column; gap: 20px; }
.resume-score-header { text-align: center; padding: 16px; background: var(--bg3); border-radius: 12px; }
.resume-overall-score { font-size: 3.5rem; font-weight: 900; line-height: 1; }
.resume-score-max { font-size: 1.2rem; opacity: 0.6; }
.resume-score-label { font-size: 1rem; font-weight: 600; margin: 4px 0; }
.resume-word-count { font-size: 0.8rem; color: var(--muted); }
.resume-score-bars { display: flex; flex-direction: column; gap: 10px; }
.resume-bar-row { display: flex; align-items: center; gap: 10px; }
.resume-bar-label { width: 90px; font-size: 0.82rem; font-weight: 600; }
.resume-bar-track { flex: 1; height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }

.resume-issue-item { font-size: 0.85rem; padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

.nova-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }

.nova-doc-banner { display: flex; align-items: center; gap: 10px; background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.3); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.88rem; }
.doc-banner-icon { font-size: 1.1rem; }
.doc-banner-title { flex: 1; }
.doc-banner-clear { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; padding: 3px 10px; font-size: 0.8rem; transition: all 0.15s; }
.doc-banner-clear:hover { color: var(--red); border-color: var(--red); }
.doc-hint { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2); border-radius: 8px; padding: 10px 14px; font-size: 0.82rem; color: var(--green); margin-bottom: 10px; }
.btn-ghost { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); cursor: pointer; transition: all 0.15s; }
.btn-ghost:hover { border-color: var(--accent3); color: var(--text); }
.btn-sm { padding: 5px 12px; font-size: 0.8rem; }
.q-num { background: var(--accent); color: white; border-radius: 6px; padding: 1px 8px; font-size: 0.8rem; font-weight: 700; margin-right: 6px; }
.typing-dots span { display: inline-block; animation: dot-bounce 1.2s infinite; font-size: 1.4rem; line-height: 1; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-6px); opacity: 1; } }
.word-popup { animation: fadeInUp 0.2s ease; }
.word-popup .ipa { color: var(--accent3); font-family: monospace; font-size: 0.85rem; }
.word-popup .word-lvl { background: rgba(124,58,237,0.15); color: var(--accent3); border-radius: 4px; padding: 1px 6px; font-size: 0.75rem; font-weight: 700; }
.word-popup-actions { display: flex; gap: 8px; margin-top: 10px; }
.word-popup-say { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 0.8rem; }
.word-popup-close { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); padding: 5px 12px; cursor: pointer; font-size: 0.8rem; }
@keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   M6: TODAY'S FLOW — GLOBAL STRIP, CHIP & HOME STEPPER
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.flow-strip {
  background: var(--bg1);
  border-bottom: 1px solid var(--line);
  padding: 6px 20px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  z-index: 90;
  flex-shrink: 0;
}
.flow-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 4px 12px;
  color: var(--txt);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}
.flow-chip:hover {
  background: rgba(124,92,255,0.15);
  border-color: var(--acc);
  transform: translateY(-1px);
}
.flow-chip .chip-spark {
  color: var(--gold);
}
.flow-chip.all-done {
  border-color: rgba(52,211,153,0.4);
  background: rgba(52,211,153,0.1);
  color: var(--ok);
}
.flow-chip.all-done .chip-spark {
  color: var(--ok);
}
.flow-chip .chip-arrow {
  color: var(--mut);
  font-size: 11px;
}
@media (max-width: 880px) {
  .flow-strip {
    padding: 4px 14px;
  }
  .flow-chip .chip-next {
    display: none;
  }
}

.flow-card {
  background: var(--bg1);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 20px;
  margin-bottom: 24px;
  box-shadow: var(--sh2);
  position: relative;
  overflow: hidden;
}
.flow-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--grad);
}
.flow-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}
.flow-card-title {
  font-size: 1.1rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.flow-card-badge {
  font-size: 0.8rem;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 700;
  background: rgba(124,92,255,0.15);
  color: var(--acc);
  border: 1px solid rgba(124,92,255,0.3);
}
.flow-card-badge.complete {
  background: rgba(52,211,153,0.15);
  color: var(--ok);
  border-color: rgba(52,211,153,0.3);
}
.flow-steps {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}
@media (max-width: 900px) {
  .flow-steps {
    grid-template-columns: 1fr;
    gap: 8px;
  }
}
.flow-step {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  position: relative;
  transition: all 0.2s ease;
  min-height: 120px;
}
.flow-step.active {
  border-color: var(--acc);
  background: rgba(124,92,255,0.08);
  box-shadow: 0 0 0 1px var(--acc);
}
.flow-step.done {
  border-color: rgba(52,211,153,0.3);
  background: rgba(52,211,153,0.05);
}
.flow-step.locked {
  opacity: 0.6;
  background: rgba(10,15,30,0.6);
  cursor: not-allowed;
}
.flow-step-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.flow-step-num {
  font-size: 0.75rem;
  font-weight: 800;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg3);
  color: var(--mut);
}
.flow-step.active .flow-step-num {
  background: var(--acc);
  color: #fff;
}
.flow-step.done .flow-step-num {
  background: var(--ok);
  color: #070b16;
}
.flow-step.locked .flow-step-num {
  background: rgba(255,255,255,0.05);
  color: var(--mut);
}
.flow-step-status {
  font-size: 0.82rem;
  font-weight: 600;
}
.flow-step.done .flow-step-status {
  color: var(--ok);
}
.flow-step.active .flow-step-status {
  color: var(--acc);
}
.flow-step.locked .flow-step-status {
  color: var(--mut);
}
.flow-step-title {
  font-size: 0.88rem;
  font-weight: 700;
  margin-bottom: 4px;
  color: var(--txt);
}
.flow-step-desc {
  font-size: 0.76rem;
  color: var(--mut);
  line-height: 1.35;
  margin-bottom: 8px;
}
.flow-step-btn {
  margin-top: auto;
  font-size: 0.76rem;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 6px;
  text-align: center;
  text-decoration: none;
  border: none;
  cursor: pointer;
  display: inline-block;
  transition: all 0.15s ease;
  width: 100%;
}
.flow-step.active .flow-step-btn {
  background: var(--acc);
  color: #fff;
}
.flow-step.active .flow-step-btn:hover {
  background: #6d28d9;
}
.flow-step.done .flow-step-btn {
  background: rgba(52,211,153,0.15);
  color: var(--ok);
  border: 1px solid rgba(52,211,153,0.3);
}
.flow-step.locked .flow-step-btn {
  background: transparent;
  color: var(--mut);
  border: 1px dashed var(--line);
  cursor: not-allowed;
}

</style>
</head>

<script>
/* ── Content merge (M15) ── */
if (typeof DATA4 !== 'undefined' && DATA4 && typeof DATA4.merge === 'function') {
  DATA4.merge();
}

/* ── Topbar XP/Streak live update ── */
(function () {
  function updateTopbar() {
    var xpEl = document.getElementById('xp-display');
    var strEl = document.getElementById('streak-display');
    if (xpEl) { xpEl.textContent = '⚡ ' + U.fmtXP(STORE.get('xp') || 0) + ' XP'; }
    if (strEl) { strEl.textContent = '🔥 ' + (STORE.get('streak') || 0); }
  }
  updateTopbar();
  setInterval(updateTopbar, 5000);

  /* ── PWA: Service Worker registration (MISSION 1) ── */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        console.log('[SW] Registered:', reg.scope);
      }).catch(function (err) {
        console.warn('[SW] Registration failed:', err);
      });
    });
  }

  /* ── PWA: Install prompt ── */
  var _deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    _deferredPrompt = e;
    // Show install banner after 30s or on next visit
    setTimeout(function () {
      if (_deferredPrompt) {
        var banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e2a3a;border:1px solid rgba(124,58,237,0.4);padding:14px 20px;border-radius:16px;display:flex;gap:12px;align-items:center;z-index:300;font-size:0.85rem;';
        banner.innerHTML = '<span>📲 Install EngSpell as an app?</span><button id="pwa-install" style="background:#7c3aed;color:white;border:none;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:0.85rem;">Install</button><button id="pwa-dismiss" style="background:none;border:none;color:#64748b;cursor:pointer;">✕</button>';
        document.body.appendChild(banner);
        document.getElementById('pwa-install').addEventListener('click', function () {
          _deferredPrompt.prompt();
          _deferredPrompt.userChoice.then(function () { _deferredPrompt = null; });
          document.body.removeChild(banner);
        });
        document.getElementById('pwa-dismiss').addEventListener('click', function () {
          document.body.removeChild(banner);
        });
      }
    }, 30000);
  });

  /* ── SRS review badge on nav (Sidebar & Mobile) ── */
  function updateReviewBadge() {
    var targets = [
      document.getElementById('nav-review'),
      document.getElementById('mob-nav-review')
    ];
    var srs = STORE.get('srs') || {};
    var now = Date.now();
    var count = 0;
    for (var k in srs) {
      if (srs.hasOwnProperty(k) && srs[k].due && srs[k].due <= now) { count++; }
    }
    for (var t = 0; t < targets.length; t++) {
      var navItem = targets[t];
      if (!navItem) { continue; }
      var existing = navItem.querySelector ? navItem.querySelector('.nav-badge') : null;
      if (existing && navItem.removeChild) { navItem.removeChild(existing); }
      if (count > 0 && document.createElement) {
        var badge = document.createElement('span');
        badge.className = 'nav-badge';
        badge.textContent = count;
        if (navItem.appendChild) { navItem.appendChild(badge); }
      }
    }
  }
  setTimeout(updateReviewBadge, 500);
  setInterval(updateReviewBadge, 30000);
}());
</script>
