<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="EngSpell — Speak · Spell · Shine. The complete English mastery studio.">
<title>EngSpell — Speak · Spell · Shine</title>
<style>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DESIGN SYSTEM — EngSpell (M8 Polish)
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

:root {
  /* M8 Design Tokens */
  --bg0: #070b16;
  --bg1: #0a0f1e;
  --bg2: #101830;
  --bg3: #16203c;
  --line: rgba(148,163,216,.14);
  --txt: #e8ecf8;
  --mut: #9aa6c9;
  --acc: #7c5cff;
  --acc2: #5eead4;
  --gold: #fbbf24;
  --ok: #34d399;
  --warn: #f59e0b;
  --bad: #f87171;
  --grad: linear-gradient(135deg, #7c5cff, #ec4899);
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --sh1: 0 1px 2px rgba(0,0,0,.35);
  --sh2: 0 12px 32px rgba(3,7,20,.45);
  --sp: 4px;

  /* Backward Compatibility Aliases */
  --bg: var(--bg1);
  --border: var(--line);
  --accent: var(--acc);
  --accent2: #6d28d9;
  --accent3: #a78bfa;
  --green: var(--ok);
  --red: var(--bad);
  --text: var(--txt);
  --muted: var(--mut);
  --sidebar-w: 240px;
  --topbar-h: 56px;
  --mobbar-h: 62px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg0);
  color: var(--txt);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Accessibility: Reduced Motion (M14) ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ── Accessibility: Focus Visible Ring (M14) ── */
:focus-visible,
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
.btn:focus-visible,
.flow-chip:focus-visible,
.mob-slot:focus-visible,
.nav-item:focus-visible,
[role="button"]:focus-visible,
[tabindex]:focus-visible {
  outline: 2px solid var(--acc2) !important;
  outline-offset: 2px !important;
}


/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg0); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; border: 1px solid var(--line); }

/* ── Layout ── */
#app { display: flex; flex-direction: column; height: 100vh; }

#topbar {
  height: var(--topbar-h);
  background: rgba(10,15,30,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  flex-shrink: 0;
}

.brand {
  font-size: 1.15rem;
  font-weight: 800;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.02em;
}

.topbar-right {
  display: flex;
  gap: 12px;
  font-size: 0.85rem;
  font-weight: 600;
}

#xp-display { color: var(--gold); }
#streak-display { color: #f97316; }

#layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  background: var(--bg0);
}

#sidebar {
  width: var(--sidebar-w);
  background: var(--bg1);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  flex-shrink: 0;
}

#nav {
  display: flex;
  flex-direction: column;
  padding: 16px 10px;
  gap: 16px;
}

.nav-section {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-section-label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mut);
  padding: 4px 10px;
  opacity: 0.75;
}

.nav-section-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px;
  border-radius: var(--r-sm);
  text-decoration: none;
  color: var(--mut);
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s ease;
  position: relative;
  border: 1px solid transparent;
}

.nav-item:hover {
  background: var(--bg3);
  color: var(--txt);
}

.nav-item.active {
  background: rgba(124,92,255,0.18);
  color: #ffffff;
  border-color: rgba(124,92,255,0.38);
  font-weight: 600;
}

.nav-icon {
  font-size: 15px;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}

.nav-label {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-badge {
  background: var(--bad);
  color: #ffffff;
  font-size: 11px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}

#view {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  max-width: 960px;
  margin: 0 auto;
  width: 100%;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 180ms ease, transform 180ms ease;
}

#view.view-entering {
  opacity: 0;
  transform: translateY(6px);
  transition: none;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  #view, #view.view-entering {
    opacity: 1 !important;
    transform: none !important;
    transition: none !important;
  }
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg3);
  border: 1px solid var(--line);
  color: var(--txt);
  padding: 10px 20px;
  border-radius: 24px;
  font-size: 0.9rem;
  font-weight: 500;
  z-index: 1000;
  transition: transform 0.3s ease;
  white-space: nowrap;
  box-shadow: var(--sh2);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--ok); color: var(--ok); }
.toast.error { border-color: var(--bad); color: var(--bad); }
.toast.info { border-color: var(--acc); color: var(--acc); }

/* ── Typography ── */
h1 { font-size: 28px; font-weight: 800; line-height: 1.25; margin-bottom: 8px; color: var(--txt); }
h2 { font-size: 20px; font-weight: 700; line-height: 1.35; margin-bottom: 8px; color: var(--txt); }
h3 { font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; color: var(--txt); }
.hero-title { font-size: 40px; font-weight: 900; line-height: 1.15; }
.sub { color: var(--mut); font-size: 14px; margin-bottom: 20px; }
.muted { color: var(--mut); }
.small { font-size: 12px; }
.section-title { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acc); margin: 24px 0 12px; }

/* ── Button System ── */
.btn, button, .btn-primary, .btn-secondary, .btn-ghost, .btn-danger, .btn-sm, .btn-mic, .btn-back, .btn-link, .btn-whatsapp, .btn-check {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  border-radius: var(--r-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  transition: all 0.15s ease;
  border: 1px solid transparent;
  padding: 9px 18px;
  outline: none;
  box-sizing: border-box;
}

.btn:focus-visible, button:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}

.btn-primary {
  background: var(--grad);
  color: #ffffff;
  border: none;
  box-shadow: 0 4px 14px rgba(124,92,255,0.35);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(124,92,255,0.45);
}
.btn-primary:active {
  transform: translateY(0);
}

.btn-secondary {
  background: var(--bg3);
  color: var(--txt);
  border-color: var(--line);
}
.btn-secondary:hover {
  background: var(--bg2);
  border-color: rgba(148,163,216,0.3);
}

.btn-ghost {
  background: transparent;
  color: var(--txt);
  border: 1px solid var(--line);
}
.btn-ghost:hover {
  background: var(--bg3);
  border-color: var(--acc);
  color: #fff;
}

.btn-danger {
  background: rgba(248,113,113,0.14);
  color: var(--bad);
  border: 1px solid rgba(248,113,113,0.3);
}
.btn-danger:hover {
  background: rgba(248,113,113,0.22);
}

.btn-sm {
  padding: 4px 10px;
  font-size: 12px;
  border-radius: 8px;
  background: var(--bg3);
  color: var(--txt);
  border: 1px solid var(--line);
}
.btn-sm:hover {
  background: rgba(124,92,255,0.2);
  border-color: var(--acc);
}

.btn-mic {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: #fff;
  border: none;
  box-shadow: 0 4px 12px rgba(239,68,68,0.35);
}
.btn-mic:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(239,68,68,0.45);
}

.btn-link {
  background: transparent;
  color: var(--acc);
  border: none;
  padding: 6px 12px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn-link:hover {
  color: #a78bfa;
}

.btn-back {
  background: var(--bg3);
  color: var(--mut);
  border: 1px solid var(--line);
  padding: 6px 14px;
}
.btn-back:hover {
  color: var(--txt);
  border-color: var(--acc);
}

.btn-whatsapp {
  background: #25d366;
  color: #ffffff;
  border: none;
  box-shadow: 0 4px 12px rgba(37,211,102,0.3);
}
.btn-check {
  background: var(--ok);
  color: #ffffff;
  border: none;
}

/* ── Unified Cards ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 16px 20px;
  box-shadow: var(--sh1);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.card:hover {
  transform: translateY(-1px);
  box-shadow: var(--sh2);
  border-color: rgba(124,92,255,0.35);
}
.card-icon { font-size: 2rem; margin-bottom: 12px; }
.card-body h3 { font-size: 1rem; }
.card-body p { color: var(--mut); font-size: 0.85rem; }
.card-arrow { font-size: 1.2rem; color: var(--acc); align-self: center; }
.card-next, .card-daily { display: flex; align-items: flex-start; gap: 16px; cursor: pointer; }

/* ── Tab bar ── */
.tab-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.tab-btn {
  background: var(--bg3);
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  border: 1px solid var(--border);
}
.tab-btn.active {
  background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(109,40,217,0.2));
  color: var(--accent3);
  border-color: rgba(124,58,237,0.4);
}
.tab-btn:hover { color: var(--text); }

/* ── Options (quiz, blanks) ── */
.opt-btn {
  background: var(--bg3);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 0.9rem;
  border: 1px solid var(--border);
  text-align: left;
  transition: all 0.15s;
}
.opt-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(124,58,237,0.15); }
.opt-btn:disabled { opacity: 0.6; cursor: default; }
.opts-row { display: flex; flex-direction: column; gap: 8px; }

/* ── Score chips ── */
.score-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.chip { padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; }
.chip.ok { background: rgba(16,185,129,0.2); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
.chip.bad { background: rgba(239,68,68,0.2); color: var(--red); border: 1px solid rgba(239,68,68,0.3); cursor: pointer; }
.chip.bad:hover { background: rgba(239,68,68,0.3); }

/* ── Verdict ── */
.verdict { padding: 8px 16px; border-radius: 8px; font-weight: 600; margin-top: 8px; }
.verdict.pass { background: rgba(16,185,129,0.15); color: var(--green); }
.verdict.almost { background: rgba(245,158,11,0.15); color: var(--gold); }
.verdict.fail { background: rgba(239,68,68,0.15); color: var(--red); }

/* ── Mastery dots ── */
.mastery-dots { display: flex; gap: 3px; margin: 4px 0; }
.dot { font-size: 0.6rem; color: var(--bg3); }
.dot.filled { color: var(--gold); }
.mastery-dots.big .dot { font-size: 1rem; }

/* ── Inputs ── */
input[type="text"], input[type="search"], input[type="number"], input[type="password"],
textarea, select {
  background: var(--bg3);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  color: var(--txt);
  font-family: inherit;
  font-size: 14px;
  padding: 10px 14px;
  width: 100%;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--acc);
  box-shadow: 0 0 0 2px rgba(124,92,255,0.3);
}
textarea { resize: vertical; min-height: 80px; }
input[type="range"] { width: 100%; accent-color: var(--acc); }

/* ── CEFR badge ── */
.cefr-badge {
  display: inline-block;
  background: var(--grad);
  color: #ffffff;
  font-size: 2rem;
  font-weight: 800;
  padding: 12px 28px;
  border-radius: var(--r-lg);
  margin: 16px 0;
  box-shadow: var(--sh2);
}
.cefr-badge.big { font-size: 3rem; padding: 16px 40px; }

/* ── Level badge ── */
.level-badge { padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
.level-badge.A1 { background: rgba(52,211,153,0.18); color: var(--ok); border: 1px solid rgba(52,211,153,0.3); }
.level-badge.A2 { background: rgba(52,211,153,0.24); color: var(--ok); border: 1px solid rgba(52,211,153,0.35); }
.level-badge.B1 { background: rgba(245,158,11,0.18); color: var(--warn); border: 1px solid rgba(245,158,11,0.3); }
.level-badge.B2 { background: rgba(245,158,11,0.24); color: var(--warn); border: 1px solid rgba(245,158,11,0.35); }
.level-badge.C1 { background: rgba(248,113,113,0.2); color: var(--bad); border: 1px solid rgba(248,113,113,0.35); }

/* ── Live Drill Chips (M9) ── */
.live-drill-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}
.live-chip {
  display: inline-flex;
  align-items: center;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 1.05rem;
  font-weight: 600;
  transition: all 0.1s ease;
}
.live-chip.chip-matched {
  background: rgba(52, 211, 153, 0.18);
  color: var(--ok);
  border: 1px solid var(--ok);
}
.live-chip.chip-current {
  background: rgba(94, 234, 212, 0.22);
  color: var(--acc2);
  border: 2px solid var(--acc2);
  box-shadow: 0 0 12px rgba(94, 234, 212, 0.4);
  animation: pulse-ring 1.2s infinite ease-in-out;
}
.live-chip.chip-upcoming {
  background: rgba(154, 166, 201, 0.08);
  color: var(--mut);
  opacity: 0.55;
  border: 1px dashed rgba(154, 166, 201, 0.25);
}
@keyframes pulse-ring {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}
.pulse, .btn-primary.pulse {
  animation: pulse-ring 1.1s infinite ease-in-out;
  box-shadow: 0 0 18px rgba(239, 68, 68, 0.45) !important;
}

/* ── Empty State Pattern ── */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  background: var(--bg2);
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
  margin: 16px 0;
}
.empty-icon {
  font-size: 40px;
  line-height: 1;
  margin-bottom: 12px;
  display: inline-block;
}
.empty-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--txt);
  margin-bottom: 6px;
}
.empty-hint {
  font-size: 14px;
  color: var(--mut);
  max-width: 400px;
  margin-bottom: 16px;
  line-height: 1.5;
}

/* ── HOME ORIENTING SCREEN ── */
.view-home { display: flex; flex-direction: column; gap: 20px; }
.home-greeting-band {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  background: var(--bg2);
}
.home-greeting-band h1 { margin-bottom: 4px; font-size: 26px; }
.home-greeting-band .sub { margin-bottom: 0; }
.stat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.stat-pill {
  background: var(--bg3);
  border: 1px solid var(--line);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
}
.xp-pill { color: var(--gold); border-color: rgba(251,191,36,0.3); }
.streak-pill { color: #f97316; border-color: rgba(249,115,22,0.3); }
.level-pill { color: var(--acc2); border-color: rgba(94,234,212,0.3); }
.due-pill { color: var(--acc); text-decoration: none; border-color: rgba(124,92,255,0.35); }
.due-pill:hover { background: rgba(124,92,255,0.15); }

/* ── MOAT-FIRST HERO CARDS (M13) ── */
.home-heroes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin: 4px 0 8px;
}
.home-hero-card {
  background: linear-gradient(135deg, rgba(16,24,48,0.9) 0%, rgba(22,32,60,0.95) 100%);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 22px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--sh1);
}
.home-hero-card:hover {
  border-color: var(--acc);
  transform: translateY(-2px);
  box-shadow: var(--sh2);
}
.hero-card-badge {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--acc2);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 8px;
}
.hero-card-title {
  font-size: 1.15rem;
  font-weight: 800;
  color: var(--txt);
  line-height: 1.35;
  margin-bottom: 8px;
}
.hero-card-sub {
  font-size: 0.88rem;
  color: var(--mut);
  line-height: 1.5;
  margin-bottom: 14px;
  flex: 1;
}
.hero-card-action {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--acc2);
}
@media (max-width: 768px) {
  .home-heroes {
    grid-template-columns: 1fr;
  }
}

.start-here-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}
.start-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  cursor: pointer;
  text-decoration: none;
  position: relative;
}
.start-card-icon { font-size: 28px; line-height: 1; }
.start-card-body h3 { font-size: 16px; margin-bottom: 4px; color: var(--txt); }
.start-card-body p { color: var(--mut); font-size: 13px; line-height: 1.4; margin: 0; }
.start-card-action {
  font-size: 13px;
  font-weight: 700;
  color: var(--acc);
  margin-top: auto;
  display: inline-flex;
  align-items: center;
}
.start-card:hover .start-card-action { color: var(--acc2); }

.home-analytics-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
.analytics-card { display: flex; flex-direction: column; gap: 12px; }
.week-chart { display: flex; align-items: flex-end; gap: 6px; height: 80px; padding: 8px 0; }
.bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.bar {
  background: var(--grad);
  border-radius: 4px 4px 0 0;
  min-height: 4px;
  width: 100%;
  transition: height 0.5s ease;
}
.bar-label { font-size: 11px; color: var(--mut); }
.progress-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; justify-content: space-around; }
.prog-item { display: flex; flex-direction: column; align-items: center; }
.prog-num { font-size: 28px; font-weight: 800; color: var(--acc); line-height: 1.1; }
.prog-label { font-size: 12px; color: var(--mut); margin-top: 2px; }
.home-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

/* ── ONBOARDING ── */
.view-onboarding { max-width: 480px; margin: 40px auto; text-align: center; }
.ob-logo { font-size: 2rem; font-weight: 800; margin-bottom: 32px; background: linear-gradient(135deg, #a78bfa, #f59e0b); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.ob-progress { height: 4px; background: var(--bg3); border-radius: 2px; margin-bottom: 32px; overflow: hidden; }
.ob-prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); border-radius: 2px; transition: width 0.4s ease; }
.view-onboarding h2 { margin-bottom: 24px; }
.ob-opts { display: flex; flex-direction: column; gap: 10px; }
.ob-opt { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 14px 20px; border-radius: 12px; font-size: 0.95rem; text-align: left; transition: all 0.15s; }
.ob-opt:hover { border-color: var(--accent); background: rgba(124,58,237,0.15); transform: translateX(4px); }
.ob-hint { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }

/* ── DAILY ── */
.daily-stat-row { display: flex; gap: 10px; margin-bottom: 20px; }
.daily-quests { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
.quest-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 0.9rem; }
.quest-item.done { color: var(--muted); text-decoration: line-through; }
.quest-check { font-size: 1rem; }
.daily-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
.dc-header { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent3); margin-bottom: 12px; }
.twister-text { font-size: 1.05rem; font-weight: 500; line-height: 1.6; margin-bottom: 16px; font-style: italic; }
.dc-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.pw-word { font-size: 1.8rem; font-weight: 800; color: var(--accent3); margin-bottom: 4px; }
.pw-ipa { color: var(--muted); font-size: 0.9rem; margin-bottom: 8px; }
.pw-meaning { font-weight: 600; margin-bottom: 8px; }
.pw-eg { color: var(--muted); margin-bottom: 12px; }
.idiom-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; }
.idiom-opts { display: flex; flex-direction: column; gap: 8px; }
.quote-text { font-size: 1.05rem; font-style: italic; border-left: 3px solid var(--accent); padding-left: 16px; margin-bottom: 8px; line-height: 1.7; }
.quote-by { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }

/* ── LEARN PATH ── */
.stage-block { margin-bottom: 32px; }
.stage-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.stage-badge { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: var(--accent); border-radius: 50%; font-size: 0.8rem; }
.lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.lesson-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.15s; }
.lesson-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.lesson-card.done { border-color: rgba(16,185,129,0.3); background: rgba(16,185,129,0.05); }
.lesson-num { font-size: 0.75rem; font-weight: 700; color: var(--accent3); margin-bottom: 4px; }
.lesson-title { font-size: 0.9rem; font-weight: 600; }
.lesson-done, .lesson-arrow { margin-top: 8px; font-size: 0.85rem; color: var(--muted); }

/* ── LESSON PLAYER ── */
.lesson-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.lesson-goal { color: var(--muted); margin-bottom: 20px; }
.pattern-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
.pattern-table th, .pattern-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
.pattern-table th { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.pattern-eng { cursor: pointer; font-weight: 500; }
.pattern-note { color: var(--muted); font-size: 0.85rem; }
.warn-box { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 10px; padding: 12px 16px; color: var(--gold); font-size: 0.9rem; margin-bottom: 24px; }
.lesson-complete-banner { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); border-radius: 16px; padding: 24px; text-align: center; font-size: 1.1rem; margin-top: 24px; }
.already-done { color: var(--green); font-size: 0.85rem; margin-top: 8px; }
.practice-bar { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.practice-prompt { margin-bottom: 12px; font-size: 0.95rem; }
.pb-typing { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.pb-typing input { flex: 1; }

/* ── WORD BANK ── */
.wb-search-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.wb-count { color: var(--muted); font-size: 0.85rem; white-space: nowrap; }
.wb-table { width: 100%; border-collapse: collapse; }
.wb-table th, .wb-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
.wb-table th { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }
.wb-word { font-weight: 600; cursor: pointer; }
.wb-word:hover { color: var(--accent3); }
.wb-ipa { color: var(--muted); font-style: italic; }

/* ── SPELLING ── */
.spell-game { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; text-align: center; }
.spell-progress { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
.spell-game input { max-width: 300px; margin: 16px auto; text-align: center; font-size: 1.2rem; letter-spacing: 0.1em; }
.spell-game .btn-primary, .spell-game .btn-secondary { margin: 8px; }

/* ── COACH ── */
.coach-modes { margin-bottom: 16px; }
.chat-window { height: 350px; overflow-y: auto; background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.bubble { max-width: 80%; padding: 12px 16px; border-radius: 16px; }
.bubble.nova { background: rgba(124,58,237,0.15); border: 1px solid rgba(124,58,237,0.2); align-self: flex-start; }
.bubble.user { background: var(--bg3); border: 1px solid var(--border); align-self: flex-end; }
.bubble.interviewer { background: rgba(37,211,102,0.1); border: 1px solid rgba(37,211,102,0.2); }
.bubble.prompt { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.2); width: 100%; max-width: 100%; }
.bubble-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
.bubble-text { font-size: 0.9rem; line-height: 1.5; }
.interview-q { background: rgba(37,211,102,0.1); border: 1px solid rgba(37,211,102,0.2); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
.chat-input-row { display: flex; gap: 8px; align-items: center; }
.chat-input-row input { flex: 1; }
.chat-input-row .btn-mic { padding: 10px 14px; }

/* ── QUIZ ── */
.quiz-progress { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
.quiz-skill { display: inline-block; background: rgba(124,58,237,0.15); color: var(--accent3); padding: 3px 10px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; margin-bottom: 16px; }
.quiz-q { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; font-size: 1rem; font-weight: 500; }
.quiz-opts { display: flex; flex-direction: column; gap: 8px; }
.skill-breakdown { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
.skill-row { display: flex; align-items: center; gap: 12px; }
.skill-name { width: 110px; font-size: 0.85rem; font-weight: 600; flex-shrink: 0; }
.skill-bar { flex: 1; height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.skill-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.6s ease; }
.skill-pct { width: 36px; text-align: right; font-size: 0.8rem; color: var(--muted); }

/* ── TRAINER ── */
.trainer-grid { display: grid; grid-template-columns: 280px 1fr; gap: 24px; margin-bottom: 24px; align-items: start; }
.radar-wrap { display: flex; justify-content: center; }
.radar-svg { max-width: 280px; }
.plan-list { display: flex; flex-direction: column; gap: 12px; }
.plan-item { display: flex; align-items: center; gap: 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.plan-icon { font-size: 1.5rem; }
.plan-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.plan-info strong { font-size: 0.9rem; }
.plan-info span { font-size: 0.75rem; color: var(--muted); }
.xp-chart { display: flex; align-items: flex-end; gap: 4px; height: 80px; overflow-x: auto; padding-bottom: 4px; }

/* ── SETTINGS ── */
.setting-group { margin-bottom: 20px; }
.setting-group label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; }
.setting-hint { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
.danger-zone { border-top: 1px solid var(--border); padding-top: 20px; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }

/* ── ASSESSMENT ── */
.assess-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.assess-progress { background: rgba(124,58,237,0.15); color: var(--accent3); padding: 6px 14px; border-radius: 10px; font-size: 0.85rem; font-weight: 700; margin-bottom: 16px; display: inline-block; }
.assess-prompt { font-size: 1.05rem; font-weight: 600; margin-bottom: 16px; }
.assess-passage { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; font-size: 0.9rem; line-height: 1.7; margin-bottom: 16px; max-height: 180px; overflow-y: auto; }
.assess-timer { font-size: 2.5rem; font-weight: 800; color: var(--accent3); text-align: center; margin: 16px 0; font-variant-numeric: tabular-nums; }
.assess-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.85rem; }
.assess-table th, .assess-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.assess-table th { color: var(--muted); text-transform: uppercase; font-size: 0.75rem; }
.assess-table tr.current-band td { background: rgba(124,58,237,0.1); color: var(--accent3); font-weight: 700; }
.result-btns { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }

/* ── LISTENING ── */
.passage-select { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.listen-controls { display: flex; gap: 8px; margin-bottom: 16px; }
.listen-text { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; font-size: 0.9rem; line-height: 1.7; margin-bottom: 16px; }
.comp-q { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.comp-q p { font-weight: 600; margin-bottom: 12px; }
.comp-opts { margin-top: 8px; }
.dict-sentence { font-size: 1.05rem; font-weight: 500; background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; user-select: none; filter: blur(4px); transition: filter 0.3s; }
.dict-sentence:hover { filter: none; }
.dict-controls { display: flex; gap: 8px; margin-bottom: 12px; }

/* ── ATLAS ── */
.atlas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.atlas-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; transition: all 0.15s; }
.atlas-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.atlas-name { font-weight: 700; margin-bottom: 6px; }
.atlas-formula { font-size: 0.8rem; color: var(--muted); font-family: monospace; }
.tense-formula { font-family: monospace; background: var(--bg3); padding: 10px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 0.95rem; }
.tense-when, .tense-signals { margin-bottom: 12px; font-size: 0.9rem; }
.signal-tag { background: rgba(124,58,237,0.15); color: var(--accent3); padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; margin-right: 6px; }
.tense-examples { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.tense-examples li { background: var(--bg2); border-left: 3px solid var(--accent); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 0.9rem; cursor: pointer; }
.detective-clue { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 10px; padding: 12px 16px; color: var(--gold); font-size: 0.85rem; margin-top: 16px; }
.detective-q { font-size: 0.85rem; color: var(--muted); margin-bottom: 8px; }
.detective-clue-box { font-size: 1rem; font-weight: 600; background: var(--bg2); border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border); }
.detective-quiz { max-width: 500px; }

/* ── PRONUNCIATION ── */
.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
.word-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
.word-text { font-size: 1rem; font-weight: 700; cursor: pointer; }
.word-text:hover { color: var(--accent3); }
.word-ipa { font-size: 0.75rem; color: var(--muted); margin: 4px 0; }
.pairs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.pair-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.pair-words { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.pair-word { font-size: 1.1rem; font-weight: 700; cursor: pointer; color: var(--accent3); }
.pair-word:hover { text-decoration: underline; }
.pair-sep { color: var(--muted); font-size: 0.8rem; }
.pair-tip { font-size: 0.8rem; color: var(--muted); }
.twisters-list { display: flex; flex-direction: column; gap: 12px; }
.twister-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.twister-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }

/* ── FOUNDATIONS ── */
.alphabet-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.letter-btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); width: 44px; height: 44px; border-radius: 10px; font-size: 1.1rem; font-weight: 700; }
.letter-btn:hover { background: rgba(124,58,237,0.2); border-color: var(--accent); }
.sounds-table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
.sounds-table th, .sounds-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.sounds-table th { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }
.ipa-sym { font-family: monospace; font-weight: 700; color: var(--accent3); cursor: pointer; }
.spell-tool { display: flex; gap: 8px; margin-bottom: 16px; }
.spell-chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ── CLARITY ── */
.stress-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.stress-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.stress-word { font-size: 1.2rem; font-weight: 800; margin-bottom: 8px; color: var(--accent3); }
.stress-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); }
.rhythm-list, .connected-grid { display: flex; flex-direction: column; gap: 12px; }
.rhythm-card, .connected-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.rhythm-sent { font-size: 1rem; margin-bottom: 8px; }
.rhythm-stressed { font-size: 0.85rem; margin-bottom: 4px; }
.rhythm-note { font-size: 0.8rem; color: var(--muted); }
.conn-normal { color: var(--muted); text-decoration: line-through; }
.conn-arrow { color: var(--accent3); margin: 0 8px; }
.conn-natural { font-weight: 700; color: var(--accent3); cursor: pointer; }
.conn-note { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
.connected-card { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }

/* ── IDIOMS ── */
.idiom-list { display: flex; flex-direction: column; gap: 12px; }
.idiom-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
.idiom-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.idiom-text { font-size: 1rem; font-weight: 700; }
.idiom-meaning { color: var(--muted); font-size: 0.85rem; margin-bottom: 4px; }
.idiom-eg { font-style: italic; font-size: 0.85rem; color: var(--accent3); }
.idiom-quiz { max-width: 500px; }
.iq-num { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
.iq-text { font-size: 1.2rem; font-weight: 700; background: var(--bg2); border-radius: 12px; padding: 16px; margin-bottom: 8px; }
.iq-question { font-weight: 600; margin: 12px 0 8px; }
.iq-opts { display: flex; flex-direction: column; gap: 8px; }

/* ── DOCTOR ── */
.doctor-input { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.doctor-ok { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); border-radius: 12px; padding: 16px; color: var(--green); }
.doctor-issues { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; padding: 16px; }
.doctor-issues h3 { color: var(--red); margin-bottom: 12px; }
.doctor-issues ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.doctor-issues li { padding: 8px 12px; background: rgba(239,68,68,0.05); border-radius: 8px; font-size: 0.9rem; border-left: 3px solid var(--red); }

/* ── SCENARIOS ── */
.scenario-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.scenario-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; cursor: pointer; transition: all 0.15s; }
.scenario-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.sc-level { display: inline-block; background: rgba(124,58,237,0.15); color: var(--accent3); padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; margin-bottom: 8px; }
.sc-phrases { font-size: 0.8rem; color: var(--muted); margin: 8px 0 12px; }
.scenario-play { max-width: 600px; }
.sc-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.sc-turn { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
.scenario-result { text-align: center; padding: 40px 20px; }

/* ── PHRASES ── */
.phrase-build { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
.phrase-num { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
.phrase-prompt { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
.phrase-starter { font-size: 0.9rem; color: var(--accent3); margin-bottom: 12px; }
.phrase-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.eg-box { margin-top: 12px; background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.2); border-radius: 10px; padding: 12px; font-size: 0.9rem; }
.grammar-blank { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
.blank-sent { font-size: 1.05rem; font-weight: 500; margin-bottom: 16px; }
.blank-slot { border-bottom: 2px solid var(--accent3); padding: 0 12px; color: var(--accent3); }
.phrasebook { display: flex; flex-direction: column; gap: 16px; }
.phrase-group h3 { margin-bottom: 10px; }
.phrase-group ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.phrase-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.phrase-item:hover { border-color: var(--accent3); }

/* ── REVIEW (MISSION 2) ── */

.review-empty-icon { font-size: 3rem; margin-bottom: 16px; }
.review-progress { font-size: 0.85rem; color: var(--muted); margin-bottom: 16px; }
.review-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 32px; text-align: center; margin-bottom: 24px; }
.rc-type { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent3); margin-bottom: 12px; }
.rc-text { font-size: 1.8rem; font-weight: 800; margin-bottom: 12px; cursor: pointer; }
.review-prompt { text-align: center; font-weight: 600; margin-bottom: 16px; }
.review-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

/* ── READING CORNER (MISSION 4) ── */
.view-read { display: flex; flex-direction: column; gap: 24px; max-width: 900px; margin: 0 auto; }
.read-home-header h1 { font-size: 1.8rem; margin-bottom: 6px; }
.read-home-header .sub { color: var(--muted); font-size: 0.95rem; }
.saved-words-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
.saved-words-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.saved-words-header h3 { font-size: 1.1rem; color: var(--gold); }
.badge-count { background: rgba(245,158,11,0.15); color: var(--gold); font-size: 0.8rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.empty-saved { font-size: 0.9rem; margin: 8px 0; }
.saved-words-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.saved-word-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; font-size: 0.85rem; }
.sw-word { font-weight: 700; color: var(--text); }
.sw-ipa { font-size: 0.8rem; color: var(--accent3); font-family: monospace; }
.sw-play, .sw-remove { background: none; border: none; cursor: pointer; font-size: 0.85rem; padding: 2px; color: var(--muted); border-radius: 4px; transition: color 0.15s; }
.sw-play:hover { color: var(--accent3); }
.sw-remove:hover { color: var(--red); }
.read-sections { display: flex; flex-direction: column; gap: 28px; }
.read-level-group { display: flex; flex-direction: column; gap: 14px; }
.read-level-header { display: flex; align-items: center; gap: 10px; }
.level-badge { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-weight: 800; font-size: 0.8rem; padding: 3px 10px; border-radius: 6px; }
.level-count { font-size: 0.85rem; color: var(--muted); }
.read-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.read-passage-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 18px; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; justify-content: space-between; }
.read-passage-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.rpc-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.rpc-level { font-size: 0.75rem; font-weight: 700; color: var(--accent3); background: rgba(124,58,237,0.15); padding: 2px 8px; border-radius: 6px; }
.rpc-saved { font-size: 0.75rem; color: var(--gold); font-weight: 600; }
.rpc-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; }
.rpc-excerpt { font-size: 0.85rem; color: var(--muted); line-height: 1.5; margin-bottom: 14px; flex: 1; }
.rpc-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: 10px; }
.rpc-btn { color: var(--accent3); font-weight: 600; }
.open-passage { display: flex; flex-direction: column; gap: 20px; }
.read-header { display: flex; flex-direction: column; gap: 10px; }
.read-title-row { display: flex; align-items: center; gap: 12px; }
.read-meta { display: flex; gap: 14px; font-size: 0.85rem; color: var(--muted); }
.saved-counter { color: var(--gold); font-weight: 600; }
.read-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.read-hint { font-size: 0.88rem; color: var(--accent3); background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.2); border-radius: 10px; padding: 10px 14px; }
.read-text-container { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 24px; font-size: 1.15rem; line-height: 2; color: #e2e8f0; }
.read-word { cursor: pointer; border-radius: 4px; padding: 1px 3px; transition: all 0.15s; display: inline-block; }
.read-word:hover { background: rgba(124,58,237,0.25); color: #fff; text-shadow: 0 0 1px #a78bfa; }
.word-chip-container { position: sticky; bottom: 16px; z-index: 100; margin-top: 8px; }
.word-chip { background: var(--bg2); border: 1px solid var(--acc); border-radius: 16px; padding: 18px 22px; box-shadow: var(--sh2); display: flex; flex-direction: column; gap: 10px; }
.word-chip.empty { border-color: var(--line); background: var(--bg2); text-align: center; font-size: 0.85rem; color: var(--mut); padding: 14px; }
.wc-top { display: flex; justify-content: space-between; align-items: center; }
.wc-title-area { display: flex; align-items: baseline; gap: 12px; }
.wc-word { font-size: 1.4rem; font-weight: 800; color: #fff; }
.wc-ipa { font-size: 1rem; color: var(--acc); font-family: monospace; }
.wc-close { background: none; border: none; color: var(--mut); font-size: 1.1rem; cursor: pointer; }
.wc-close:hover { color: #fff; }
.wc-meaning { font-size: 0.9rem; color: var(--txt); }
.wc-eg { font-size: 0.85rem; color: var(--mut); }
.wc-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

/* ── XP pop ── */
.xp-pop { position: absolute; pointer-events: none; font-size: 0.9rem; font-weight: 700; color: var(--gold); animation: xpFloat 1.5s ease forwards; z-index: 500; }
@keyframes xpFloat {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-40px); }
}

/* ── Not found ── */
.not-found { text-align: center; padding: 60px 20px; color: var(--mut); }

/* ── Mobile 5-Slot Bottom Bar & Sheet (M8) ── */
#mobile-bar {
  display: none;
}
#nav-more-sheet {
  display: none;
}

@media (max-width: 880px) {
  #sidebar { display: none !important; }
  #view {
    padding: 16px 14px calc(var(--mobbar-h) + env(safe-area-inset-bottom, 16px) + 20px);
    max-width: 100%;
  }

  #mobile-bar {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(var(--mobbar-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: rgba(10,15,30,0.96);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    z-index: 250;
    align-items: center;
    justify-content: space-around;
  }

  .mob-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: var(--mut);
    text-decoration: none;
    font-size: 11px;
    font-weight: 500;
    flex: 1;
    height: 100%;
    padding: 6px 2px;
    border: none;
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: color 0.15s;
    outline: none;
  }
  .mob-slot:hover, .mob-slot.active {
    color: var(--acc2);
  }
  .mob-slot.active .mob-label {
    font-weight: 700;
    color: #ffffff;
  }
  .mob-slot .mob-icon {
    font-size: 18px;
    line-height: 1.2;
  }
  .mob-slot.mob-fab .mob-icon {
    background: var(--grad);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(124,92,255,0.4);
    color: #ffffff;
  }
  .mob-slot .nav-badge {
    position: absolute;
    top: 6px;
    right: calc(50% - 18px);
  }

  /* Bottom Sheet Overlay */
  #nav-more-sheet {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 300;
    pointer-events: none;
    visibility: hidden;
    transition: visibility 0.2s;
  }
  #nav-more-sheet.open {
    pointer-events: auto;
    visibility: visible;
  }
  #nav-more-sheet .sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(4,7,15,0.75);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  #nav-more-sheet.open .sheet-backdrop {
    opacity: 1;
  }
  #nav-more-sheet .sheet-panel {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    max-height: 80vh;
    background: var(--bg1);
    border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    transform: translateY(100%);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 20px);
    box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
  }
  #nav-more-sheet.open .sheet-panel {
    transform: translateY(0);
  }
  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  .sheet-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--txt);
  }
  .sheet-close {
    background: var(--bg3);
    border: 1px solid var(--line);
    color: var(--mut);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    padding: 0;
  }
  .sheet-close:hover {
    color: #fff;
    border-color: var(--acc);
  }
  .sheet-content {
    padding: 16px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .sheet-section {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sheet-sec-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--mut);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .sheet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
  }
  .sheet-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    color: var(--txt);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
  }
  .sheet-item:hover {
    background: var(--bg3);
    border-color: var(--acc);
  }

  .trainer-grid { grid-template-columns: 1fr; }
  .ds-layout { grid-template-columns: 1fr; }
  .resume-layout { grid-template-columns: 1fr; }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DOCUMENT STUDIO
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

.ds-sidebar { display: flex; flex-direction: column; gap: 8px; background: var(--bg2); border-radius: 14px; padding: 16px; border: 1px solid var(--border); overflow-y: auto; max-height: 640px; }

.ds-empty { color: var(--muted); font-size: 0.85rem; line-height: 1.6; }

.ds-reader { background: var(--bg2); border-radius: 14px; border: 1px solid var(--border); padding: 24px; overflow-y: auto; max-height: 640px; }
.ds-no-doc { text-align: center; padding: 60px 20px; color: var(--muted); }
.ds-no-doc-icon { font-size: 3rem; margin-bottom: 16px; }
.ds-reader-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }

.ds-doc-tip { background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.2); border-radius: 10px; padding: 10px 14px; font-size: 0.82rem; color: var(--accent3); margin-bottom: 16px; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   RESUME ANALYZER
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.view-resume { display: flex; flex-direction: column; gap: 20px; }

.resume-input-panel { display: flex; flex-direction: column; gap: 10px; background: var(--bg2); border-radius: 14px; padding: 20px; border: 1px solid var(--border); }
.resume-input-header { display: flex; align-items: center; gap: 10px; }
.resume-input-header label.section-title { flex: 1; }
.resume-input-panel textarea { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; color: var(--text); padding: 12px; font-size: 0.9rem; resize: vertical; font-family: inherit; line-height: 1.7; }
.resume-actions { display: flex; gap: 10px; align-items: center; }
.resume-select { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 8px 12px; font-size: 0.85rem; flex: 1; }
.resume-report-panel { background: var(--bg2); border-radius: 14px; padding: 20px; border: 1px solid var(--border); overflow-y: auto; max-height: 640px; }
.resume-empty { text-align: center; padding: 48px 20px; color: var(--muted); }

.resume-report { display: flex; flex-direction: column; gap: 20px; }
.resume-score-header { text-align: center; padding: 16px; background: var(--bg3); border-radius: 12px; }
.resume-overall-score { font-size: 3.5rem; font-weight: 900; line-height: 1; }
.resume-score-max { font-size: 1.2rem; opacity: 0.6; }
.resume-score-label { font-size: 1rem; font-weight: 600; margin: 4px 0; }
.resume-word-count { font-size: 0.8rem; color: var(--muted); }
.resume-score-bars { display: flex; flex-direction: column; gap: 10px; }
.resume-bar-row { display: flex; align-items: center; gap: 10px; }
.resume-bar-label { width: 90px; font-size: 0.82rem; font-weight: 600; }
.resume-bar-track { flex: 1; height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }

.resume-issue-item { font-size: 0.85rem; padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   NOVA UPGRADES: doc banner, word popup, typing dots, clear button
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.nova-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }

.nova-doc-banner { display: flex; align-items: center; gap: 10px; background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.3); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.88rem; }
.doc-banner-icon { font-size: 1.1rem; }
.doc-banner-title { flex: 1; }
.doc-banner-clear { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; padding: 3px 10px; font-size: 0.8rem; transition: all 0.15s; }
.doc-banner-clear:hover { color: var(--red); border-color: var(--red); }
.doc-hint { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2); border-radius: 8px; padding: 10px 14px; font-size: 0.82rem; color: var(--green); margin-bottom: 10px; }
.btn-ghost { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); cursor: pointer; transition: all 0.15s; }

/* ══════════════════════════════════════════════════════════════════════
   TRAINER — skill event bus + radar aggregator
   TRAINER_EVENTS schema: { skill, delta, source, ts }
   ════════════════════════════════════════════════════════════════════*/
var TRAINER = (function () {
  'use strict';

  var SKILLS = ['pronunciation', 'grammar', 'vocab', 'spelling', 'fluency', 'listening', 'reading', 'writing'];
  /* INV-7: reading fires from docstudio (read_ mastery prefix, already in keysFor).
     writing fires from resume analyzer. No write_ mastery prefix exists yet in STORE
     because writing quality is assessed holistically (resume reports), not per-item.
     When per-word writing mastery is added, add 'write_' prefix here. */
  var EVENTS_KEY = 'engspell_trainer_events';
  var MAX_EVENTS = 500;

  function _loadEvents() {
    try {
      return JSON.parse(localStorage.getItem(EVENTS_KEY) || '[]');
    } catch (e) { return []; }
  }

  function _saveEvents(events) {
    try { localStorage.setItem(EVENTS_KEY, JSON.stringify(events)); } catch (e) {}
  }

  /**
   * log(event) — INV-7: only path to modify skill scores
   * event: { skill, delta, source }
   */
  function log(event) {
    if (!event || SKILLS.indexOf(event.skill) === -1) { return; }
    var ev = {
      skill: event.skill,
      delta: event.delta || 0,
      source: event.source || 'unknown',
      ts: Date.now()
    };
    var events = _loadEvents();
    events.push(ev);
    if (events.length > MAX_EVENTS) { events = events.slice(-MAX_EVENTS); }
    _saveEvents(events);

    /* M6 Daily Flow: drill completion hook */
    if (typeof FLOW !== 'undefined' && FLOW.mark && ev.delta > 0) {
      var drillSources = [
        'spelling/correct', 'listening/comp', 'listening/dict',
        'atlas/detective', 'idioms/', 'doctor/clean', 'practiceBar',
        'daily/twister', 'daily/word', 'daily/idiom', 'daily/quote',
        'docstudio/train', 'resume/analyze', 'phrases/blank'
      ];
      var isDrill = false;
      for (var d = 0; d < drillSources.length; d++) {
        if (ev.source.indexOf(drillSources[d]) !== -1) { isDrill = true; break; }
      }
      if (isDrill) {
        var f = FLOW.get();
        if (!f.steps[0]) {
          FLOW.mark(1);
        } else if (f.steps[1] && !f.steps[2]) {
          FLOW.mark(3);
        }
      }
    }
  }

  /** Returns {skill: cumulativeScore} capped 0–100 */
  function aggregate() {
    var events = _loadEvents();
    var scores = {};
    for (var i = 0; i < SKILLS.length; i++) { scores[SKILLS[i]] = 50; }
    for (var j = 0; j < events.length; j++) {
      var ev = events[j];
      if (scores[ev.skill] !== undefined) {
        scores[ev.skill] = Math.max(0, Math.min(100, scores[ev.skill] + ev.delta));
      }
    }
    return scores;
  }

  /** Returns array of {skill, score} sorted weakest first */
  function weakestFirst() {
    var scores = aggregate();
    var arr = [];
    for (var s in scores) {
      if (scores.hasOwnProperty(s)) { arr.push({skill: s, score: scores[s]}); }
    }
    arr.sort(function (a, b) { return a.score - b.score; });
    return arr;
  }

  /** Returns mastery keys for a given skill prefix */
  function keysFor(skill, mastery) {
    var map = {
      spelling:  'spell_',
      vocab:     ['idn_', 'pv_', 'read_'],
      listening: 'lsn_',
      reading:   'read_',
      /* writing: no per-item mastery prefix yet — holistic score only via resume reports */
      writing:   []
    };
    var prefix = map[skill];
    if (prefix === undefined || prefix === null) { return []; }
    /* Empty-array shorthand for skills with no mastery prefix */
    if (Array.isArray(prefix) && prefix.length === 0) { return []; }
    var prefixes = Array.isArray(prefix) ? prefix : [prefix];
    var keys = [];
    for (var k in mastery) {
      if (!mastery.hasOwnProperty(k)) { continue; }
      for (var p = 0; p < prefixes.length; p++) {
        if (k.indexOf(prefixes[p]) === 0) { keys.push(k); break; }
      }
    }
    return keys;
  }

  /** 30-day XP history: [{date, xp}] for bar chart */
  function xpHistory() {
    var events = _loadEvents();
    var map = {};
    for (var i = 0; i < events.length; i++) {
      var d = new Date(events[i].ts).toISOString().slice(0, 10);
      map[d] = (map[d] || 0) + Math.max(0, events[i].delta);
    }
    var out = [];
    for (var k in map) {
      if (map.hasOwnProperty(k)) { out.push({date: k, xp: map[k]}); }
    }

    return out.slice(-30);

    localStorage.removeItem(EVENTS_KEY);
  }

    SKILLS: SKILLS,
    log: log,
    aggregate: aggregate,
    weakestFirst: weakestFirst,
    keysFor: keysFor,
    xpHistory: xpHistory,
    clearEvents: clearEvents

    "that's": 'that is', "there's": 'there is', "here's": 'here is',
    "let's": 'let us', "who's": 'who is', "what's": 'what is',
    "needn't": 'need not', "mustn't": 'must not',
    "wanna": 'want to', "gonna": 'going to'

    'i': ['eye', 'aye', 'ai', 'ah'],
    'she': ['see', 'sea', 'c'],
    'he': ['hi'],
    'they': ['dey', 'day'],
    'we': ['wee', 'v'],
    'you': ['u', 'ya'],
    'it': ["it's"],
    'be': ['b'],
    'are': ['r', 'our'],
    'to': ['too', 'two', '2'],
    'for': ['four', 'fore', '4'],
    'their': ['there', "they're"],
    'there': ['their', "they're"],
    'your': ["you're", 'ur'],
    'one': ['won', '1'],
    'won': ['one'],
    'by': ['bye', 'buy'],
    'no': ['know'],
    'know': ['no'],
    'right': ['write'],
    'write': ['right']

    if (!w1 || !w2) { return false; }
    if (w1 === w2) { return true; }
    var homs1 = HOMOPHONES[w1];
    if (homs1 && homs1.indexOf(w2) !== -1) { return true; }
    var homs2 = HOMOPHONES[w2];
    if (homs2 && homs2.indexOf(w1) !== -1) { return true; }

    if (w1.length > 3 && w2.length > 3) {
      if (w1 + 's' === w2 || w2 + 's' === w1) { return true; }
      if (w1 + 'es' === w2 || w2 + 'es' === w1) { return true; }

/* ══════════════════════════════════════════════════════════════════════
   WEEKLY — "So What" Progress Rollups & Weekly History (M17: WEEKLY-01)
   ISO-week bucketing, deltas, CEFR story, cap at 500 oldest-pruned
   ════════════════════════════════════════════════════════════════════*/
var WEEKLY = (function () {
  'use strict';

  function getIsoWeekYearAndWeek(d) {

    if (typeof d === 'string' && /^\d{4}-\d{2}-\d{2}/.test(d)) {
      var y = parseInt(d.slice(0, 4), 10);
      var m = parseInt(d.slice(5, 7), 10) - 1;

    } else {

      wpm: wpm,

  function getDelta(curVal, prevVal, isHigherBetter) {

        delta: 0,
        direction: 'no-prior-week',
        text: '—',
        improved: false,
        isGood: false

    }
    var d = Math.round((curVal - prevVal) * 10) / 10;

    } else if (d < 0) {

    }

      direction: dir,

      statusPart = 'reached ' + curBand;
    } else if (curBand === prevBand) {
      statusPart = 'held ' + curBand;
    } else {
      var prevIdx = bands.indexOf(prevBand);
      if (curIdx > prevIdx) {
        statusPart = 'promoted to ' + curBand;
      } else {
        statusPart = 'slipped to ' + curBand;
      }
    }

    var progressPart = '';
    if (nextBand) {

      } else if (wpmDelta === 0 && prevWpm !== undefined && prevWpm !== null) {

      } else {

      }

    }

  }

        curWeekKey = allWeeks[allWeeks.length - 1];
        thisItems = buckets[curWeekKey] || [];
        prevWeekKey = getPrevIsoWeek(curWeekKey);
      }
    }
    var prevItems = buckets[prevWeekKey] || [];

    var thisSum = summarizeBucket(thisItems);
    var prevSum = summarizeBucket(prevItems);

    var deltas = {
      wpm: getDelta(thisSum ? thisSum.wpm : 0, prevSum ? prevSum.wpm : null, true),
      fillersPerMin: getDelta(thisSum ? thisSum.fillersPerMin : 0, prevSum ? prevSum.fillersPerMin : null, false),

      lessonsDone: getDelta(thisSum ? thisSum.lessonsDone : 0, prevSum ? prevSum.lessonsDone : null, true),

      curFillerFraction,
      prevSum ? prevSum.wpm : null,
      prevFillerFraction

      locked: false,
      totalSessions: totalSessions,
      curWeek: curWeekKey,
      prevWeek: prevWeekKey,
      thisWeek: thisSum,
      lastWeek: prevSum,
      deltas: deltas,
      band: curBand,
      story: cefrStory

})();

    var tTokens = (tText || '').toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);
    var sTokens = (spokenSentence || '').toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(Boolean);

    if (tTokens.length === 0) { return { pass: true, pct: 100, matched: 0, total: 0 }; }

    var matched = 0;
    for (var i = 0; i < tTokens.length; i++) {
      if (sTokens.indexOf(tTokens[i]) !== -1) {
        matched++;
      }
    }
    var pct = matched / tTokens.length;
    return {
      pass: pct >= 0.85,
      pct: Math.round(pct * 100),
      matched: matched,
      total: tTokens.length
    };
  }

  return {
    getPacks: getPacks,
    getPack: getPack,
    getStore: getStore,
    getPackProgress: getPackProgress,
    isPackDone: isPackDone,
    isUnlocked: isUnlocked,
    hasNeutralizedBadge: hasNeutralizedBadge,
    saveProgress: saveProgress,
    buildListenQuiz: buildListenQuiz,
    evaluateSay: evaluateSay,
    evaluateSentence: evaluateSentence
  };
})();

function _renderFlowCard() {
  if (typeof FLOW === 'undefined' || !FLOW.get) { return ''; }
  var flow = FLOW.get();
  var cur = FLOW.current();
  var defs = FLOW.stepDefs;
  var doneCount = 0;
  for (var d = 0; d < flow.steps.length; d++) {
    if (flow.steps[d]) { doneCount++; }
  }
  var isAllDone = (doneCount === 5);

  var h = '<div class="flow-card">' +
    '<div class="flow-card-header">' +
      '<div class="flow-card-title">' +
        (isAllDone ? '🌟 <span>Today\'s Flow Complete!</span>' : '⚡ <span>Today\'s Flow</span>') +
      '</div>' +
      '<div class="flow-card-badge' + (isAllDone ? ' complete' : '') + '">' +
        (isAllDone ? '5/5 Done · Daily Star Earned 🔥' : doneCount + '/5 Complete · Next: ' + cur.label) +
      '</div>' +
    '</div>' +
    '<div class="flow-steps">';

  for (var i = 0; i < defs.length; i++) {
    var stepDef = defs[i];
    var isDone = !!flow.steps[i];
    var isUnlocked = FLOW.isStepUnlocked(i + 1);
    var isActive = (!isDone && isUnlocked);
    var isLocked = !isUnlocked;

    var stepCls = 'flow-step';
    if (isDone) { stepCls += ' done'; }
    else if (isActive) { stepCls += ' active'; }
    else if (isLocked) { stepCls += ' locked'; }

    var numText = isDone ? '✓' : (isLocked ? '🔒' : String(i + 1));
    var actionHtml = '';
    if (isDone) {
      actionHtml = '<button type="button" class="flow-step-btn" onclick="FLOW.openStep(' + (i + 1) + ')">Review ✓</button>';
    } else if (isActive) {
      actionHtml = '<button type="button" class="flow-step-btn" onclick="FLOW.openStep(' + (i + 1) + ')">Start →</button>';
    } else {
      actionHtml = '<button type="button" class="flow-step-btn" onclick="FLOW.openStep(' + (i + 1) + ')" title="' + stepDef.reason + '">Locked 🔒</button>';
    }

    h += '<div class="' + stepCls + '" data-step="' + (i + 1) + '">' +
      '<div class="flow-step-top">' +
        '<div class="flow-step-num">' + numText + '</div>' +
        '<div class="flow-step-status">' + (isDone ? '✅ Done' : (isActive ? '▶ Next' : '🔒 Locked')) + '</div>' +
      '</div>' +
      '<div class="flow-step-title">' + (i + 1) + '. ' + stepDef.label + '</div>' +
      '<div class="flow-step-desc">' + (isLocked ? stepDef.reason : stepDef.title) + '</div>' +
      actionHtml +
    '</div>';
  }

  h += '</div></div>';
  return h;
}

      '<div class="mastery-dots big">' + _masteryDots(mastery) + '</div>' +
      '<button class="btn-primary" id="spell-play">🔊 Hear the Word</button>' +
      '<button class="btn-secondary" id="spell-slow">🐢 Hear Slowly</button>' +
      '<input type="text" id="spell-ans" placeholder="Type the word..." autocomplete="off" autocorrect="off" spellcheck="false" />' +
      '<button class="btn-primary" id="spell-submit">✅ Check</button>' +
      '<div id="spell-feedback"></div>' +
      '</div></div>';

    document.getElementById('spell-play').addEventListener('click', function () {
      SPEECH.speak(current.w);
    });
    document.getElementById('spell-slow').addEventListener('click', function () {
      SPEECH.speakSlow(current.w);
    });

    for (var lvl = 1; lvl <= 3; lvl++) {
      (function (lv) {
        document.getElementById('spell-lvl-' + lv).addEventListener('click', function () {
          self._level = lv;
          self._round = [];
          self.render(el);
        });
      }(lvl));
    }

    document.getElementById('spell-submit').addEventListener('click', function () {
      var ans = document.getElementById('spell-ans').value.trim().toLowerCase();
      var fb = document.getElementById('spell-feedback');
      if (ans === current.w) {
        var ruleHtml = current.rule ? ('<div style="margin-top:6px;font-size:0.85rem;color:var(--ok);">💡 <strong>Rule:</strong> ' + _escB(current.rule) + '</div>') : '';
        fb.innerHTML = '<p class="verdict pass">✅ Correct! The word is: <strong>' + _escB(current.w) + '</strong></p>' + ruleHtml;
        STORE.master('spell_' + current.w, true);
        TRAINER.log({skill: 'spelling', delta: 2, source: 'spelling/correct'});
        STORE.addXP(5);
        setTimeout(function () {
          self._idx = (self._idx + 1) % self._round.length;
          self.render(el);
        }, 1500);
      } else {
        var wrongRuleHtml = current.rule ? ('<div style="margin-top:8px;padding:8px 12px;background:rgba(245,158,11,0.1);border-left:4px solid var(--warn);border-radius:6px;font-size:0.9rem;color:var(--txt);text-align:left;">💡 <strong>Spelling rule / mnemonic:</strong> ' + _escB(current.rule) + '</div>') : '';
        fb.innerHTML = '<p class="verdict fail">❌ The correct spelling is: <strong>' + _escB(current.w) + '</strong></p>' + wrongRuleHtml;
        STORE.master('spell_' + current.w, false);
        TRAINER.log({skill: 'spelling', delta: -1, source: 'spelling/wrong'});
      }
    });

    document.getElementById('spell-ans').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { document.getElementById('spell-submit').click(); }
    });
  }
};

function _renderScenario(el, sc) {
  var turnIdx = 0;
  var scores = [];

  function renderTurn() {
    var turn = sc.turns[turnIdx];
    var html = '<div class="scenario-play" data-scenario-id="' + sc.id + '">' +
      '<div class="sc-header"><button onclick="navigate(\'scenarios\')" class="btn-back">← Back</button><h2>' + sc.title + '</h2></div>' +
      '<div class="sc-turn">' + (turnIdx + 1) + ' / ' + sc.turns.length + '</div>';

    if (turn.speaker === 'i') {
      html += '<div class="bubble interviewer">' +
        '<div class="bubble-label">Interviewer</div>' +
        '<div class="bubble-text" data-say="' + turn.text + '">' + turn.text + ' <button class="btn-sm" data-say="' + turn.text + '">🔊</button></div>' +
        '</div>' +
        '<button class="btn-primary" id="sc-next">Continue →</button>';
    } else {
      html += '<div class="bubble prompt">' +
        '<div class="bubble-label">Your turn</div>' +
        '<div class="bubble-text">' + turn.prompt + '</div>' +
        '</div>';

      if (SPEECH.canListen()) {
        html += '<button class="btn-mic" id="sc-mic">🎤 Speak</button>';
      }
      html += '<textarea id="sc-input" rows="2" placeholder="Type your response..."></textarea>' +
        '<button class="btn-primary" id="sc-submit">Submit</button>' +
        '<div id="sc-fb"></div>';
    }
    html += '</div>';
    el.innerHTML = html;

    var nextBtn = document.getElementById('sc-next');
    if (nextBtn) {
      nextBtn.addEventListener('click', function () {
        turnIdx++;
        if (turnIdx >= sc.turns.length) { _showScResult(el, sc, scores); return; }
        renderTurn();
      });
    }

    var micBtn = document.getElementById('sc-mic');
    if (micBtn) {
      micBtn.addEventListener('click', function () {
        micBtn.textContent = '🔴 Listening…';
        micBtn.disabled = true;
        micBtn.classList.add('pulse');
        SPEECH.listen({
          interim: true,
          continuous: true,
          onresult: function (t, isFinal) {
            var inp = document.getElementById('sc-input');
            if (inp) { inp.value = t; }
            if (isFinal) {
              micBtn.textContent = '🎤 Speak';
              micBtn.disabled = false;
              micBtn.classList.remove('pulse');
            }
          },
          onend: function () {
            micBtn.textContent = '🎤 Speak';
            micBtn.disabled = false;
            micBtn.classList.remove('pulse');
          },
          onerror: function (m, code) {
            micBtn.textContent = '🎤 Speak';
            micBtn.disabled = false;
            micBtn.classList.remove('pulse');
            if (code !== 'aborted') { UI.toast(m, 'error'); }
          }
        });
      });
    }

    var submitBtn = document.getElementById('sc-submit');
    if (submitBtn) {
      submitBtn.addEventListener('click', function () {
        var resp = document.getElementById('sc-input').value.trim();
        if (!resp) { UI.toast('Please say or type a response.', 'error'); return; }
        var fb = document.getElementById('sc-fb');
        var words = U.tokenise(resp).length;
        scores.push(words);
        fb.innerHTML = '<p class="verdict pass">✅ Good! ' + words + ' words. Moving on...</p>';
        TRAINER.log({skill: 'fluency', delta: 2, source: 'scenarios/turn'});
        STORE.addXP(5);
        setTimeout(function () {
          turnIdx++;
          if (turnIdx >= sc.turns.length) { _showScResult(el, sc, scores); return; }
          renderTurn();
        }, 1200);
      });
    }
  }

  renderTurn();
}

function _showScResult(el, sc, scores) {
  var total = 0;
  for (var i = 0; i < scores.length; i++) { total += scores[i]; }
  el.innerHTML = '<div class="scenario-result">' +

        var popup = document.createElement('div');
        popup.className = 'word-popup';
        if (found) {
          popup.innerHTML = '<strong>' + _esc(found.w) + '</strong> <span class="ipa">' + (found.ipa || '') + '</span><br><span class="word-def">' + _esc(found.def || found.pos || '') + '</span>'
            + '<button class="word-popup-say" onclick="SPEECH.speak(\'' + _esc(found.w) + '\')">🔊</button>'
            + '<button class="word-popup-close">×</button>';
        } else {
          popup.innerHTML = '<strong>' + _esc(sel) + '</strong><br><span class="word-def">Not in word bank — ask Nova!</span>'
            + '<button class="word-popup-close">×</button>';
        }
