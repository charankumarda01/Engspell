VIEWS.atlas = {
  _selected: null,
  _mode: 'browse',
  _detectiveQ: 0,
  render(el) {
    const self = this;
    const { _selected: selected, _mode: mode } = self;

    const modeBar = `<div class="tab-bar">
      <button class="tab-btn${mode==='browse'?' active':''}" id="atlas-browse">📖 Browse Tenses</button>
      <button class="tab-btn${mode==='detective'?' active':''}" id="atlas-detective">🕵️ Tense Detective</button>
    </div>`;

    let content = '';
    if (mode === 'browse') {
      if (!selected) {
        const grid = ATLAS.map(t =>
          `<div class="atlas-card" onclick="VIEWS.atlas._selected='${t.id}'; VIEWS.atlas.render(document.getElementById('view'))">
            <div class="atlas-name">${t.name}</div>
            <div class="atlas-formula">${t.formula}</div>
          </div>`
        ).join('');
        content = `<div class="atlas-grid">${grid}</div>`;
      } else {
        const tense = ATLAS.find(t => t.id === selected);
        if (!tense) { self._selected = null; self.render(el); return; }
        const examples = tense.examples.map(e =>
          `<li data-say="${e}">${e} <button class="btn-sm" data-say="${e}">🔊</button></li>`
        ).join('');
        const signals = tense.signals.map(s => `<span class="signal-tag">${s}</span>`).join('');
        content = `
        <div class="tense-detail">
          <button onclick="VIEWS.atlas._selected=null; VIEWS.atlas.render(document.getElementById('view'))" class="btn-back">← All Tenses</button>
          <h2>${tense.name}</h2>
          <div class="tense-formula">${tense.formula}</div>
          <div class="tense-when"><strong>Use when:</strong> ${tense.when}</div>
          <div class="tense-signals"><strong>Signal words:</strong> ${signals}</div>
          <div class="section-title">Examples</div>
          <ul class="tense-examples">${examples}</ul>
          <div class="warn-box">⚠️ ${tense.desiTrap}</div>
          <div class="detective-clue">🕵️ Detective clue: ${tense.detectiveClue}</div>
        </div>`;
      }
    } else {
      // Tense detective quiz
      const tense = ATLAS[self._detectiveQ % ATLAS.length];
      const clue = tense.detectiveClue;
      const opts = ATLAS.map(t => t.name);
      const shuffled = opts.slice().sort(() => Math.random() - 0.5).slice(0, 4);
      if (shuffled.indexOf(tense.name) === -1) { shuffled[0] = tense.name; }
      const optsHtml = shuffled.map(name =>
        `<button class="opt-btn" data-ans="${name === tense.name ? '1' : '0'}">${name}</button>`
      ).join('');

      content = `
      <div class="detective-quiz">
        <div class="detective-q">Q${self._detectiveQ + 1}</div>
        <div class="detective-clue-box">"${clue}"</div>
        <p>Which tense is this?</p>
        <div class="opts-row" id="det-opts">${optsHtml}</div>
        <div id="det-fb"></div>
      </div>`;
    }

    el.innerHTML = `<div class="view-atlas"><h1>📐 Grammar Atlas</h1><p class="sub">12 tenses — when, why, and how to use them.</p>${modeBar}<div class="tab-content">${content}</div></div>`;

    document.getElementById('atlas-browse').addEventListener('click', () => { self._mode = 'browse'; self.render(el); });
    document.getElementById('atlas-detective').addEventListener('click', () => { self._mode = 'detective'; self.render(el); });

    if (mode === 'detective') {
      const detOpts = document.getElementById('det-opts');
      if (detOpts) {
        detOpts.addEventListener('click', e => {
          const btn = e.target.closest('.opt-btn');
          if (!btn) return;
          const correct = btn.dataset.ans === '1';
          const tense = ATLAS[self._detectiveQ % ATLAS.length];
          document.getElementById('det-fb').innerHTML = correct
            ? `<p class="verdict pass">✅ Correct! ${tense.name}</p>`
            : `<p class="verdict fail">❌ It was: ${tense.name}. ${tense.formula}</p>`;
          detOpts.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
          TRAINER.log({skill: 'grammar', delta: correct ? 2 : -1, source: 'atlas/detective'});
          STORE.addXP(correct ? 5 : 1);
          setTimeout(() => { self._detectiveQ++; self.render(el); }, 1400);
        });
      }
    }
  }
};

/* ── READING CORNER (MISSION 4 — READ-01) ───────────────────────────── */
VIEWS.read = {
  _activeWord: null,

  lookupEntry(word) {
    if (!word) return null;
    const clean = String(word).toLowerCase().replace(/[^a-z'-]/g, '').trim();
    if (!clean) return null;

    if (typeof POWER_WORDS !== 'undefined' && Array.isArray(POWER_WORDS)) {
      const found = POWER_WORDS.find(p => p.w && p.w.toLowerCase() === clean);
      if (found) return found;
    }
    if (typeof WORDS !== 'undefined' && Array.isArray(WORDS)) {
      const found = WORDS.find(w => w.w && w.w.toLowerCase() === clean);
      if (found) return found;
    }
    return null;
  },

  lookupWord(word) {
    const entry = this.lookupEntry(word);
    return (entry && entry.ipa) ? entry.ipa : 'IPA not in dictionary';
  },

  saveWord(word) {
    if (!word) return null;
    const clean = String(word).toLowerCase().replace(/[^a-z'-]/g, '').trim();
    if (!clean) return null;
    const key = 'read_' + clean;

    STORE.master(key, true);

    const srs = STORE.get('srs') || {};
    srs[key] = {
      interval: 0,
      due: Date.now()
    };
    STORE.set('srs', srs);

    TRAINER.log({ skill: 'vocab', delta: 1, source: 'read/save' });
    STORE.addXP(2);

    if (typeof updateReviewBadge === 'function') {
      updateReviewBadge();
    }

    return {
      key: key,
      word: clean,
      mastery: STORE.getMastery(key),
      srs: srs[key]
    };
  },

  removeWord(word) {
    if (!word) return;
    const clean = String(word).toLowerCase().replace(/[^a-z'-]/g, '').trim();
    const key = 'read_' + clean;

    const mastery = STORE.get('mastery') || {};
    delete mastery[key];
    STORE.set('mastery', mastery);

    const srs = STORE.get('srs') || {};
    delete srs[key];
    STORE.set('srs', srs);

    if (typeof updateReviewBadge === 'function') {
      updateReviewBadge();
    }
  },

  getSavedWords() {
    const mastery = STORE.get('mastery') || {};
    const words = [];
    for (const k in mastery) {
      if (mastery.hasOwnProperty(k) && k.startsWith('read_') && mastery[k] > 0) {
        words.push(k.replace('read_', ''));
      }
    }
    return words;
  },

  renderSavedSection() {
    const saved = this.getSavedWords();
    if (saved.length === 0) {
      return `
      <div class="saved-words-section">
        <div class="saved-words-header">
          <h3>⭐ My Saved Words</h3>
          <span class="badge-count">0</span>
        </div>
        <p class="muted empty-saved">No words saved yet. Tap any word in a passage to save it for spaced review.</p>
      </div>`;
    }

    const chipsHtml = saved.map(w => {
      const ipa = this.lookupWord(w);
      const hasIpa = ipa && ipa !== 'IPA not in dictionary';
      return `
      <div class="saved-word-chip" data-word="${w}">
        <span class="sw-word">${w}</span>
        ${hasIpa ? `<span class="sw-ipa">${ipa}</span>` : ''}
        <button class="btn-icon sw-play" data-say="${w}" title="Listen">🔊</button>
        <button class="btn-icon sw-remove" data-remove="${w}" title="Remove">✕</button>
      </div>`;
    }).join('');

    return `
    <div class="saved-words-section">
      <div class="saved-words-header">
        <h3>⭐ My Saved Words</h3>
        <span class="badge-count">${saved.length}</span>
      </div>
      <div class="saved-words-chips">
        ${chipsHtml}
      </div>
    </div>`;
  },

  getPassageSavedCount(passage) {
    if (!passage || !passage.text) return 0;
    const mastery = STORE.get('mastery') || {};
    const words = passage.text.toLowerCase().match(/[a-z'-]+/g) || [];
    let count = 0;
    const seen = {};
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      if (!seen[w]) {
        seen[w] = true;
        if (mastery['read_' + w] && mastery['read_' + w] > 0) {
          count++;
        }
      }
    }
    return count;
  },

  render(el, arg) {
    const self = this;

    // Handle Open Passage state
    if (arg) {
      const passages = (typeof PASSAGES !== 'undefined' && Array.isArray(PASSAGES)) ? PASSAGES : [];
      const passage = passages.find(p => p.id === arg);

      if (!passage) {
        if (typeof navigate === 'function') { navigate('read'); }
        return;
      }

      const wordCount = passage.text.split(/\s+/).filter(Boolean).length;
      const savedCount = self.getPassageSavedCount(passage);

      // Wrap each word in a span with data-word
      const textHtml = passage.text.replace(/([A-Za-z0-9'-]+)/g, (match) => {
        return `<span class="read-word" data-word="${match}">${match}</span>`;
      });

      el.innerHTML = `
      <div class="view-read open-passage" id="open-passage-${passage.id}">
        <div class="read-header">
          <button class="btn-back" id="read-back">← Back to Reading Corner</button>
          <div class="read-title-row">
            <span class="rpc-level">${passage.level}</span>
            <h2>${passage.title}</h2>
          </div>
          <div class="read-meta">
            <span>📄 ${wordCount} words</span>
            <span class="saved-counter">💾 saved (<strong id="psg-saved-cnt">${savedCount}</strong>)</span>
          </div>
          <div class="read-actions">
            <button class="btn-primary" data-say="${passage.text}">🔊 Listen (Normal)</button>
            <button class="btn-secondary" id="psg-slow">🐢 Listen Slow</button>
            <a href="#/listening" class="btn-link">👂 Listening Lab →</a>
          </div>
        </div>

        <p class="read-hint">💡 <em>Tap any word</em> to see its IPA pronunciation, hear it spoken, and save it to your SRS review queue.</p>

        <div class="read-text-container" id="read-text-box">
          ${textHtml}
        </div>

        <!-- Floating / Docked Word Chip -->
        <div id="word-chip-container" class="word-chip-container">
          <div class="word-chip empty">
            <span class="wc-tip">👆 Tap any word in the passage above to inspect its pronunciation and meaning.</span>
          </div>
        </div>
      </div>`;

      const btnBack = (el.querySelector ? el.querySelector('#read-back') : null) || document.getElementById('read-back');
      if (btnBack && btnBack.addEventListener) {
        btnBack.addEventListener('click', () => {
          if (typeof navigate === 'function') navigate('read');
        });
      }

      const btnSlow = (el.querySelector ? el.querySelector('#psg-slow') : null) || document.getElementById('psg-slow');
      if (btnSlow && btnSlow.addEventListener) {
        btnSlow.addEventListener('click', () => {
          if (typeof SPEECH !== 'undefined' && SPEECH.speakSlow) {
            SPEECH.speakSlow(passage.text);
          }
        });
      }

      // Word click handling
      const textBox = (el.querySelector ? el.querySelector('#read-text-box') : null) || document.getElementById('read-text-box');
      const chipContainer = (el.querySelector ? el.querySelector('#word-chip-container') : null) || document.getElementById('word-chip-container');

      function showWordChip(rawWord) {
        if (!chipContainer) return;
        const clean = String(rawWord).toLowerCase().replace(/[^a-z'-]/g, '').trim();
        if (!clean) return;

        const ipa = self.lookupWord(clean);
        const entry = self.lookupEntry(clean);
        const isSaved = (typeof STORE !== 'undefined' && STORE.getMastery)
          ? STORE.getMastery('read_' + clean) > 0
          : false;

        chipContainer.innerHTML = `
        <div class="word-chip active">
          <div class="wc-top">
            <div class="wc-title-area">
              <span class="wc-word">${clean}</span>
              <span class="wc-ipa">${ipa}</span>
            </div>
            <button class="btn-icon wc-close" id="wc-close" title="Close">✕</button>
          </div>
          ${entry && entry.meaning ? `<div class="wc-meaning"><strong>Meaning:</strong> ${entry.meaning}</div>` : ''}
          ${entry && entry.eg ? `<div class="wc-eg"><em>"${entry.eg}"</em></div>` : ''}
          <div class="wc-buttons">
            <button class="btn-sm" id="wc-speak">🔊 Normal</button>
            <button class="btn-sm" id="wc-slow">🐢 Slow</button>
            <button class="${isSaved ? 'btn-secondary' : 'btn-primary'} btn-sm" id="wc-save">
              ${isSaved ? '✅ Saved in Review' : '⭐ Save Word'}
            </button>
          </div>
        </div>`;

        const closeBtn = chipContainer.querySelector('#wc-close');
        if (closeBtn) {
          closeBtn.addEventListener('click', () => {
            chipContainer.innerHTML = `
            <div class="word-chip empty">
              <span class="wc-tip">👆 Tap any word in the passage above to inspect its pronunciation and meaning.</span>
            </div>`;
          });
        }

        const speakBtn = chipContainer.querySelector('#wc-speak');
        if (speakBtn) {
          speakBtn.addEventListener('click', () => {
            if (typeof SPEECH !== 'undefined' && SPEECH.speak) {
              SPEECH.speak(clean);
            }
          });
        }

        const slowBtn = chipContainer.querySelector('#wc-slow');
        if (slowBtn) {
          slowBtn.addEventListener('click', () => {
            if (typeof SPEECH !== 'undefined' && SPEECH.speakSlow) {
              SPEECH.speakSlow(clean);
            }
          });
        }

        const saveBtn = chipContainer.querySelector('#wc-save');
        if (saveBtn) {
          saveBtn.addEventListener('click', () => {
            self.saveWord(clean);
            saveBtn.textContent = '✅ Saved in Review';
            saveBtn.className = 'btn-secondary btn-sm';
            const cntEl = (el.querySelector ? el.querySelector('#psg-saved-cnt') : null) || document.getElementById('psg-saved-cnt');
            if (cntEl) {
              cntEl.textContent = self.getPassageSavedCount(passage);
            }
            if (typeof UI !== 'undefined' && UI.toast) {
              UI.toast('Saved "' + clean + '" to Review queue!');
            }
          });
        }
      }

      if (textBox && textBox.addEventListener) {
        textBox.addEventListener('click', (e) => {
          const target = e.target.closest ? e.target.closest('.read-word') : null;
          if (!target) return;
          const w = target.getAttribute('data-word');
          if (w) {
            showWordChip(w);
            if (typeof SPEECH !== 'undefined' && SPEECH.speakSlow) {
              SPEECH.speakSlow(w.toLowerCase().replace(/[^a-z'-]/g, ''));
            }
          }
        });
      }

      return;
    }

    // Passage List state (Reading Corner Home)
    const passages = (typeof PASSAGES !== 'undefined' && Array.isArray(PASSAGES)) ? PASSAGES : [];
    const levels = ['A1', 'A2', 'B1', 'B2', 'C1'];

    let groupsHtml = '';
    levels.forEach(lvl => {
      const lvlPassages = passages.filter(p => p.level === lvl);
      if (lvlPassages.length === 0) return;

      const cardsHtml = lvlPassages.map(p => {
        const savedCount = self.getPassageSavedCount(p);
        const wordCount = p.text.split(/\s+/).filter(Boolean).length;
        const excerpt = p.text.slice(0, 110) + (p.text.length > 110 ? '...' : '');

        return `
        <div class="read-passage-card" onclick="navigate('read','${p.id}')">
          <div class="rpc-top">
            <span class="rpc-level">${p.level}</span>
            <span class="rpc-saved">💾 saved (${savedCount})</span>
          </div>
          <h3 class="rpc-title">${p.title}</h3>
          <p class="rpc-excerpt">${excerpt}</p>
          <div class="rpc-footer">
            <span class="rpc-words">📄 ${wordCount} words</span>
            <span class="rpc-btn">Read →</span>
          </div>
        </div>`;
      }).join('');

      groupsHtml += `
      <div class="read-level-group">
        <div class="read-level-header">
          <span class="level-badge">${lvl}</span>
          <span class="level-count">${lvlPassages.length} passages</span>
        </div>
        <div class="read-grid">${cardsHtml}</div>
      </div>`;
    });

    el.innerHTML = `
    <div class="view-read">
      <div class="read-home-header">
        <h1>📚 Reading Corner</h1>
        <p class="sub">Read graded texts from A1 to C1. Tap any word to see its phonetic IPA, hear correct pronunciation, and save it to your Spaced Repetition review deck.</p>
      </div>

      <div id="read-saved-container">
        ${self.renderSavedSection()}
      </div>

      <div class="read-sections">
        ${groupsHtml || '<p class="muted">No reading passages found.</p>'}
      </div>
    </div>`;

    // Event delegation on saved words section
    const savedContainer = (el.querySelector ? el.querySelector('#read-saved-container') : null) || document.getElementById('read-saved-container');
    if (savedContainer && savedContainer.addEventListener) {
      savedContainer.addEventListener('click', (e) => {
        const removeBtn = e.target.closest ? e.target.closest('[data-remove]') : null;
        if (removeBtn) {
          const w = removeBtn.getAttribute('data-remove');
          if (w) {
            self.removeWord(w);
            self.render(el);
          }
          return;
        }

        const playBtn = e.target.closest ? e.target.closest('[data-say]') : null;
        if (playBtn) {
          const w = playBtn.getAttribute('data-say');
          if (w && typeof SPEECH !== 'undefined' && SPEECH.speakSlow) {
            SPEECH.speakSlow(w);
          }
        }
      });
    }
  }
};

VIEWS.docstudio = {
  _activeIdx: -1,

  render: function(el) {
    var self = this;
    var docs = STORE.get("docs") || [];
    var activeDoc = self._activeIdx >= 0 ? docs[self._activeIdx] : null;

    var docListHtml = "";
    if (docs.length === 0) {
      docListHtml = "<p class=\"ds-empty\">No documents yet.<br>Upload a file or paste text below.</p>";
    } else {
      for (var i = 0; i < docs.length; i++) {
        var d = docs[i];
        var iact = self._activeIdx === i ? " active" : "";
        docListHtml += "<div class=\"ds-doc-item" + iact + "\" data-idx=\"" + i + "\">" +
          "<span class=\"ds-doc-icon\">📄</span>" +
          "<span class=\"ds-doc-name\">" + _escF(d.title) + "</span>" +
          "<button class=\"ds-doc-delete\" data-del=\"" + i + "\" title=\"Remove\">&#215;</button>" +
          "</div>";
      }
    }

    var readerHtml = activeDoc ? _renderDocReader(activeDoc) :
      "<div class=\"ds-no-doc\"><div class=\"ds-no-doc-icon\">📖</div>" +
      "<h2>Select or upload a document</h2>" +
      "<p>Choose from the list on the left, or upload a new file.</p></div>";

    el.innerHTML =
      "<div class=\"view-docstudio\">" +
        "<div class=\"ds-header\">" +
          "<div><h1>📄 Document Studio</h1>" +
          "<p class=\"sub\">Upload any text file or paste content &mdash; then read, study, and ask Nova about it.</p></div>" +
          "<label class=\"btn-primary ds-upload-btn\" for=\"ds-file-input\">" +
            "&#8679; Upload File" +
            "<input type=\"file\" id=\"ds-file-input\" accept=\".txt,.md,.csv,.js,.html,.py,.json,.pdf\" style=\"display:none\">" +
          "</label>" +
        "</div>" +
        "<div class=\"ds-layout\">" +
          "<div class=\"ds-sidebar\">" +
            "<div class=\"ds-sidebar-title\">Your Documents</div>" +
            docListHtml +
            "<div class=\"ds-paste-section\">" +
              "<textarea id=\"ds-paste\" placeholder=\"Or paste text here…\" rows=\"4\"></textarea>" +
              "<div class=\"ds-paste-row\">" +
                "<input type=\"text\" id=\"ds-paste-title\" placeholder=\"Document title\" />" +
                "<button class=\"btn-primary\" id=\"ds-paste-save\">Save</button>" +
              "</div>" +
            "</div>" +
          "</div>" +
          "<div class=\"ds-reader\" id=\"ds-reader\">" + readerHtml + "</div>" +
        "</div>" +
      "</div>";

    self._bindEvents(el, docs);
  },

  _bindEvents: function(el, docs) {
    var self = this;

    var fileInput = el.querySelector("#ds-file-input");
    if (fileInput) {
      fileInput.addEventListener("change", function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var title = file.name.replace(/\.[^/.]+$/, "");
        var isPdf = file.name.toLowerCase().endsWith(".pdf");
        fileInput.value = "";

        if (isPdf) {
          /* FIX-4: Lazy-load local vendored pdf.js, then extract text */
          UI.toast("📄 Loading PDF…", "info");
          _loadPdfJs(function(err) {
            if (err) { UI.toast("❌ PDF engine failed to load: " + err, "error"); return; }
            _extractPdfText(file, function(text, extractErr) {
              if (extractErr) { UI.toast("❌ Could not read PDF: " + extractErr, "error"); return; }
              self._saveDoc(title, text, el);
            });
          });
        } else {
          var reader = new FileReader();
          reader.onload = function(ev) {
            self._saveDoc(title, ev.target.result, el);
          };
          reader.readAsText(file, "UTF-8");
        }
      });
    }

    var pasteSaveBtn = el.querySelector("#ds-paste-save");
    if (pasteSaveBtn) {
      pasteSaveBtn.addEventListener("click", function() {

    el.querySelectorAll(".ds-doc-item").forEach(function(item) {

        self.render(el);
      });

    el.querySelectorAll(".ds-doc-delete").forEach(function(btn) {
      btn.addEventListener("click", function(e) {

        STORE.set("docs", d3);

        self.render(el);

    var readerEl = el.querySelector("#ds-reader");
    if (readerEl) {

      readerEl.addEventListener("dblclick", function() {
        var sel = window.getSelection ? window.getSelection().toString().trim() : "";
        if (!sel || sel.indexOf(" ") !== -1) return;
        var word = sel.toLowerCase().replace(/[^a-z]/g, "");
        if (!word) return;
        _showWordPopup(sel, word);
      });
      /* FIX-5: single-tap word lookup for touch devices — pointerup within 300ms */
      var _tapStart = 0;
      var _tapX0 = 0;
      var _tapY0 = 0;
      readerEl.addEventListener("pointerdown", function(e) {
        _tapStart = Date.now();
        _tapX0 = e.clientX;
        _tapY0 = e.clientY;
      });
      readerEl.addEventListener("pointerup", function(e) {
        var dt = Date.now() - _tapStart;
        var dx = Math.abs(e.clientX - _tapX0);
        var dy = Math.abs(e.clientY - _tapY0);
        if (dt > 300 || dx > 10 || dy > 10) return; /* not a quick tap */
        var sel = window.getSelection ? window.getSelection().toString().trim() : "";
        if (!sel || sel.indexOf(" ") !== -1) return;
        var word = sel.toLowerCase().replace(/[^a-z]/g, "");
        if (!word) return;
        _showWordPopup(sel, word);
      });
    }

    el.querySelectorAll(".ds-send-nova").forEach(function(btn) {
      btn.addEventListener("click", function() {
        var d4 = STORE.get("docs") || [];
        var idx = self._activeIdx;
        if (idx < 0 || !d4[idx]) return;
        d4.forEach(function(doc, i) { doc.active = (i === idx); });
        STORE.set("docs", d4);
        if (typeof VIEWS.coach !== "undefined") {
          VIEWS.coach._activeDoc = d4[idx];
          VIEWS.coach._mode = "document";
        }
        UI.toast("📄 Document sent to Nova — opening Nova!", "info");
        setTimeout(function() { window.navigate("coach"); }, 900);
      });
    });

    el.querySelectorAll(".ds-train-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        TRAINER.log({skill: "reading", delta: 2, source: "docstudio/train"});
        STORE.addXP(10);
        UI.toast("🎓 +10 XP — trained from document!", "success");
      });
    });
  },

  _saveDoc: function(title, text, el) {
    var CHAR_LIMIT = 400000;
    var SIZE_LIMIT = 3 * 1024 * 1024; /* 3 MB in bytes */
    var truncated = false;

    /* FIX-2: hard cap per document */
    if (text.length > CHAR_LIMIT) {
      text = text.slice(0, CHAR_LIMIT);
      truncated = true;
    }

    /* FIX-2: check total stored size before saving */
    var docs = STORE.get("docs") || [];
    var existingSize = 0;
    for (var di = 0; di < docs.length; di++) {
      existingSize += (docs[di].text || "").length;
    }
    if (existingSize + text.length > SIZE_LIMIT) {
      UI.toast("❌ Storage full (3 MB limit). Delete some documents first, then retry.", "error");
      return;
    }

    var sections = _splitSections(text);
    var wc = text.split(/\s+/).length;
    var doc = { title: title, text: text, sections: sections, added: Date.now(), active: true, wordCount: wc };
    docs.forEach(function(d) { d.active = false; });
    docs.push(doc);
    STORE.set("docs", docs);
    this._activeIdx = docs.length - 1;
    TRAINER.log({skill: "reading", delta: 1, source: "docstudio/upload"});
    if (truncated) {
      UI.toast("⚠️ \"" + _truncate(title, 22) + "\" truncated to 400k chars — first portion saved.", "info");
    } else {
      UI.toast("✅ \"" + _truncate(title, 28) + "\" saved — " + wc.toLocaleString() + " words", "success");
    }
    this.render(el);
  }

};

/* FIX-4: PDF.js lazy-loader — injects local vendored scripts only when first PDF is picked.
   Paths are relative; works via file:// and any static server.
   INV-2 / INV-8: no CDN, no remote URL — src/vendor/ files are committed. */
var _pdfJsLoaded = false;

function _loadPdfJs(cb) {
  if (_pdfJsLoaded && typeof pdfjsLib !== "undefined") { cb(null); return; }
  if (typeof document === "undefined") { cb("no DOM"); return; }

  /* Inject pdf.min.js (the API wrapper) */
  var script = document.createElement("script");
  /* Path is relative to index.html which is at root */
  script.src = "src/vendor/pdf.min.js";
  script.onload = function() {
    /* Point worker to the local vendored copy — no CDN */
    if (typeof pdfjsLib !== "undefined") {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "src/vendor/pdf.worker.min.js";
      _pdfJsLoaded = true;
      cb(null);
    } else {
      cb("pdfjsLib not defined after load");
    }
  };
  script.onerror = function() { cb("failed to load src/vendor/pdf.min.js"); };
  document.head.appendChild(script);
}

function _extractPdfText(file, cb) {
  /* Read file as ArrayBuffer, then parse page-by-page via pdf.js */
  var fr = new FileReader();
  fr.onload = function(ev) {
    var typedArr = new Uint8Array(ev.target.result);
    pdfjsLib.getDocument({data: typedArr}).promise.then(function(pdfDoc) {
      var totalPages = pdfDoc.numPages;
      var pageTexts = [];
      var pagesRead = 0;

      function readPage(n) {
        pdfDoc.getPage(n).then(function(page) {
          page.getTextContent().then(function(tc) {
            var pageText = tc.items.map(function(item) {
              return item.str;
            }).join(" ");
            pageTexts[n - 1] = pageText;
            pagesRead++;
            if (pagesRead < totalPages) {
              readPage(n + 1);
            } else {
              cb(pageTexts.join("\n\n"), null);
            }
          }).catch(function(e) { cb(null, String(e)); });
        }).catch(function(e) { cb(null, String(e)); });
      }

      if (totalPages === 0) { cb("", null); } else { readPage(1); }
    }).catch(function(e) { cb(null, String(e)); });
  };
  fr.onerror = function() { cb(null, "FileReader error"); };
  fr.readAsArrayBuffer(file);
}

function _renderDocReader(doc) {

  var sections = (doc.sections && doc.sections.length) ? doc.sections : [{heading: "", body: doc.text}];
  var readTime = Math.max(1, Math.round(doc.wordCount / 200));
  var html =
    "<div class=\"ds-reader-header\">" +
      "<div>" +
        "<h2 class=\"ds-reader-title\">" + _escF(doc.title) + "</h2>" +
        "<span class=\"ds-reader-meta\">" + (doc.wordCount || 0).toLocaleString() + " words &middot; ~" + readTime + " min read &middot; " + sections.length + " section" + (sections.length !== 1 ? "s" : "") + "</span>" +
      "</div>" +
      "<div class=\"ds-reader-actions\">" +
        "<button class=\"btn-ghost btn-sm ds-send-nova\">🤖 Ask Nova</button>" +
        "<button class=\"btn-ghost btn-sm ds-train-btn\">🎓 +XP</button>" +
      "</div>" +
    "</div>" +
    "<div class=\"ds-doc-tip\">💡 <strong>Double-click any word</strong> to look it up. Click &ldquo;Ask Nova&rdquo; to open a doc-aware AI session.</div>" +
    "<div class=\"ds-sections\">";

  for (var si = 0; si < sections.length; si++) {
    var s = sections[si];
    html += "<div class=\"ds-section\">";
    if (s.heading) { html += "<h3 class=\"ds-section-heading\">" + _escF(s.heading) + "</h3>"; }
    var paras = s.body.split(/\n{2,}/).filter(function(p) { return p.trim(); });
    for (var pi = 0; pi < paras.length; pi++) {
      html += "<p class=\"ds-para\">" + _escF(paras[pi].trim()) + "</p>";
    }
    html += "</div>";
  }
  html += "</div>";
  return html;
}

function _splitSections(text) {
  var lines = text.split("\n");
  var sections = [];
  var current = {heading: "", body: ""};
  for (var li = 0; li < lines.length; li++) {
    var line = lines[li];
    var isHeading = /^#{1,3}\s+/.test(line) ||
      (line.trim().length > 0 && line.trim().length < 80 && /^[A-Z0-9]/.test(line.trim()) && !line.trim().endsWith(".") && !line.trim().endsWith(","));
    if (isHeading && current.body.trim()) {
      sections.push(current);
      current = {heading: line.replace(/^#+\s*/, "").trim(), body: ""};
    } else if (isHeading && !current.body.trim()) {
      current.heading = line.replace(/^#+\s*/, "").trim();
    } else {
      current.body += line + "\n";
    }
  }
  if (current.body.trim() || current.heading) { sections.push(current); }
  return sections.length ? sections : [{heading: "", body: text}];
}

function _showWordPopup(sel, word) {
  document.querySelectorAll(".word-popup").forEach(function(p) { if (p.parentNode) p.parentNode.removeChild(p); });
  var found = null;
  if (typeof WORDS !== "undefined") {
    for (var wi = 0; wi < WORDS.length; wi++) {
      if (WORDS[wi].w && WORDS[wi].w.toLowerCase() === word) { found = WORDS[wi]; break; }
    }
  }
  var popup = document.createElement("div");
  popup.className = "word-popup";
  /* FIX-5: WORDS schema only has {w, ipa, lvl} — render only those fields */
  if (found) {
    popup.innerHTML =
      "<strong>" + _escF(found.w) + "</strong>" +
      (found.ipa ? " <span class=\"ipa\">" + _escF(found.ipa) + "</span>" : "") +
      (found.lvl ? " <span class=\"word-lvl\">[" + _escF(found.lvl) + "]</span>" : "") +
      "<div class=\"word-popup-actions\">" +
        "<button class=\"word-popup-say\">🔊 Hear it</button>" +
        "<button class=\"word-popup-close\">&#215; Close</button>" +
      "</div>";
  } else {
    popup.innerHTML =
      "<strong>" + _escF(sel) + "</strong><br>" +
      "<span class=\"word-def muted\">Not in word bank &mdash; ask Nova!</span>" +
      "<div class=\"word-popup-actions\">" +
        "<button class=\"word-popup-say\">🔊 Hear it</button>" +
        "<button class=\"word-popup-close\">&#215; Close</button>" +
      "</div>";
  }
  popup.style.cssText = "position:fixed;bottom:140px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid rgba(124,58,237,0.5);border-radius:14px;padding:16px 20px;z-index:600;font-size:0.9rem;min-width:240px;box-shadow:0 8px 40px rgba(0,0,0,0.5);";
  document.body.appendChild(popup);
  /* FIX-5: addEventListener instead of inline onclick */
  var sayBtn = popup.querySelector(".word-popup-say");
  if (sayBtn) {
    var wordToSay = found ? found.w : sel;
    sayBtn.addEventListener("click", function() { if (typeof SPEECH !== "undefined") { SPEECH.speak(wordToSay); } });
  }
  var closeBtn = popup.querySelector(".word-popup-close");
  if (closeBtn) closeBtn.addEventListener("click", function() { if (popup.parentNode) popup.parentNode.removeChild(popup); });
  setTimeout(function() { if (popup.parentNode) popup.parentNode.removeChild(popup); }, 6000);
}

function _escF(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function _truncate(s, n) {
  return s.length > n ? s.slice(0, n) + "..." : s;
}

function _runAnalysis(text, type) {
  var issues = [];
  var grammarScore = 100;
  var vocabScore = 100;
  var structureScore = 100;

  if (typeof COACH_RULES !== "undefined") {
    for (var ri = 0; ri < COACH_RULES.length; ri++) {
      if (COACH_RULES[ri].pat.test(text)) {
        issues.push({cat: "grammar", msg: COACH_RULES[ri].fix, severity: "high"});
        grammarScore = Math.max(0, grammarScore - 12);
      }
    }
  }
  if (typeof COACH_UPGRADES !== "undefined") {
    for (var ui = 0; ui < COACH_UPGRADES.length; ui++) {
      var up = COACH_UPGRADES[ui];
      var pat = new RegExp("\\b" + up.basic.toLowerCase() + "\\b", "i");
      if (pat.test(text)) {
        issues.push({cat: "vocab", msg: "\"" + up.basic + "\" \u2192 try \"" + up.better + "\" (B1) or \"" + up.adv + "\" (C1)", severity: "medium"});
        vocabScore = Math.max(0, vocabScore - 8);
      }
    }
  }
  if (type === "resume") {
    var lower = text.toLowerCase();
    var expected = ["experience", "education", "skills", "summary", "projects", "contact"];
    var missing = [];
    for (var si = 0; si < expected.length; si++) { if (lower.indexOf(expected[si]) === -1) missing.push(expected[si]); }
    if (missing.length > 3) {
      issues.push({cat: "structure", msg: "Missing common resume sections: " + missing.slice(0, 3).join(", "), severity: "medium"});
      structureScore = Math.max(0, structureScore - 20);
    }
    var wc2 = text.split(/\s+/).length;
    if (wc2 < 100) {
      issues.push({cat: "structure", msg: "Resume seems short — aim for 300-600 words", severity: "medium"});
      structureScore = Math.max(0, structureScore - 15);
    }
  }
  var sentences = text.split(/[.!?]+/).filter(function(s) { return s.trim().split(/\s+/).length > 5; });
  var longSents = sentences.filter(function(s) { return s.trim().split(/\s+/).length > 35; });
  if (longSents.length > 0) {
    issues.push({cat: "clarity", msg: longSents.length + " sentence(s) over 35 words — break them up", severity: "low"});
  }
  var passivePat = /\b(is|are|was|were|be|been|being)\s+\w+ed\b/gi;
  var passiveCount = (text.match(passivePat) || []).length;
  if (passiveCount > 4) {
    issues.push({cat: "clarity", msg: passiveCount + " passive voice uses — prefer active voice for impact", severity: "low"});
  }
  var overall = Math.round(grammarScore * 0.35 + vocabScore * 0.30 + structureScore * 0.25 + Math.min(100, 100 - longSents.length * 5) * 0.10);
  return { ts: Date.now(), type: type, grammar: grammarScore, vocab: vocabScore, structure: structureScore, overall: overall, issues: issues, wordCount: text.split(/\s+/).length, geminiCritique: null };
}

function _resumeGeminiCritique(text, type, report, reportEl, key) {
  var typeLabel = {resume: "resume", cover: "cover letter", email: "professional email", essay: "essay"}[type] || "document";
  var excerpt = text.slice(0, 2000);
  var honest = (typeof isHonest === "function") ? isHonest() : false;
  var prompt = "";
  if (honest) {
    prompt = "You are Nova in BRUTAL HONESTY mode. The student has shared a " + typeLabel + " for harsh review.\n" +
      "Scores: Grammar " + report.grammar + "/100, Vocabulary " + report.vocab + "/100, Structure " + report.structure + "/100, Overall " + report.overall + "/100.\n" +
      "Text:\n---\n" + excerpt + "\n---\n" +
      "Start with a strict overall score 'N/10'. List EVERY weakness and error one per line with ▸. Zero fluff, direct, uncompromising critique. End with the single most critical rewrite.";
  } else {
    prompt = "You are Nova, an expert English writing coach. The student has shared a " + typeLabel + " for analysis.\n" +
      "Scores: Grammar " + report.grammar + "/100, Vocabulary " + report.vocab + "/100, Structure " + report.structure + "/100, Overall " + report.overall + "/100.\n" +
      "Text:\n---\n" + excerpt + "\n---\n" +
      "Write a warm but honest 3-paragraph critique (~200 words):\n" +
      "1. What they did WELL (quote specific phrases)\n" +
      "2. The 2-3 most important improvements (be actionable)\n" +
      "3. A motivating closing sentence.\n" +
      "Do NOT repeat the scores. Be a real coach.";
  }
  var body = {contents: [{role: "user", parts: [{text: prompt}]}]};
  var url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + key;
  var geminiSection = reportEl ? reportEl.querySelector("#resume-gemini-section") : null;
  if (geminiSection) { geminiSection.innerHTML = "<div class=\"section-title\">🤖 Nova's Expert Critique</div><p class=\"muted\">Nova is reading your text…</p>"; }
  if (typeof fetch === "function") {
    fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)})
      .then(function(res) { return res.json(); })
      .then(function(resp) {
        var critique = resp.candidates[0].content.parts[0].text;
        report.geminiCritique = critique;
        var reps = STORE.get("resumeReports") || [];
        if (reps.length > 0) { reps[reps.length - 1].geminiCritique = critique; }
        STORE.set("resumeReports", reps);
        if (geminiSection) {
          geminiSection.innerHTML = "<div class=\"section-title\">🤖 Nova's Expert Critique</div><div class=\"resume-gemini-text\">" + _escF(critique) + "</div>";
        }
      }).catch(function() {
        if (geminiSection) { geminiSection.innerHTML = "<div class=\"section-title\">🤖 Nova's Expert Critique</div><p class=\"muted\">Could not connect right now. Try again when online.</p>"; }
      });
  }
}
</script>
</body>
</html>
