        setTimeout(function () { if (popup.parentNode) { popup.parentNode.removeChild(popup); } }, 5000);
      });
    }

    function _send() {
      var input = document.getElementById('nova-input');
      var text = input.value.trim();
      if (!text) { return; }
      input.value = '';
      var h = self._getHistory();
      h.push({role: 'user', text: _esc(text)});
      self._saveHistory();

      /* Part B: Free Talk Live */
      var settings = STORE.get('settings') || {};
      if (settings.liveCorrect) {
        var fixes = [];
        var words = (typeof U !== 'undefined' && U.tokenise) ? U.tokenise(text).length : text.split(/\s+/).filter(Boolean).length;
        for (var ri = 0; ri < COACH_RULES.length; ri++) {
          if (COACH_RULES[ri].pat.test(text)) {
            fixes.push(COACH_RULES[ri].fix);
          }
        }
        var honest = (typeof isHonest === 'function') ? isHonest() : false;
        var liveChipText = '';
        if (honest) {
          var score = Math.max(1, Math.min(10, 10 - (fixes.length * 2) - (words < 4 ? 2 : 0)));
          var color = score < 6 ? '#ef4444' : (score <= 8 ? '#f59e0b' : '#10b981');
          liveChipText = '<span class="live-verdict-chip" style="display:inline-block;margin-top:6px;font-size:0.75rem;padding:2px 8px;border-radius:10px;background:' + color + '22;color:' + color + ';border:1px solid ' + color + ';">⚡ Live Score: ' + score + '/10' + (fixes.length > 0 ? ' · ' + _esc(fixes[0]) : '') + '</span>';
        } else if (fixes.length > 0) {
          liveChipText = '<span class="live-verdict-chip" style="display:inline-block;margin-top:6px;font-size:0.75rem;padding:2px 8px;border-radius:10px;background:rgba(245,158,11,0.15);color:var(--warn);border:1px solid rgba(245,158,11,0.3);">⚡ Live Correction: ' + _esc(fixes[0]) + '</span>';
        }

        if (settings.bargeIn) {
          var hiFix = LIVE_COACH.detectHighSeverityFix(text);
          if (hiFix) {
            if (LIVE_COACH.bargeInThrottle.canExecute(Date.now(), self._inFlightReply)) {
              SPEECH.speak(hiFix.spoken);
              LIVE_COACH.bargeInThrottle.record(Date.now());
            } else {
              liveChipText += '<span class="live-barge-chip" style="display:inline-block;margin-top:4px;margin-left:6px;font-size:0.72rem;padding:1px 6px;border-radius:8px;background:rgba(124,92,255,0.15);color:var(--acc2);">🎙️ ' + _esc(hiFix.spoken) + '</span>';
            }
          }
        }

        if (liveChipText && chatWin) {
          var userBubbles = chatWin.querySelectorAll('.bubble.user');
          if (userBubbles.length > 0) {
            var lastBubble = userBubbles[userBubbles.length - 1];
            var chipDiv = document.createElement('div');
            chipDiv.innerHTML = liveChipText;
            lastBubble.appendChild(chipDiv);
          }
        }
      }

      _novaRespond(text, self, el);
    }

    document.getElementById('nova-send').addEventListener('click', _send);
    document.getElementById('nova-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { _send(); }
    });
  }
};

function _esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function _novaRespond(userText, self, el) {
  var settings = STORE.get('settings') || {};
  var key = settings.geminiKey || '';

  if (key && key.trim().length > 10) {
    _novaGemini(userText, self, el, key.trim());
  } else {
    var reply = _novaRules(userText);
    var h = self._getHistory();
    h.push({role: 'nova', text: _esc(reply)});
    self._saveHistory();
    STORE.get('coachStats').messages = (STORE.get('coachStats').messages || 0) + 1;
    STORE.save();
    TRAINER.log({skill: 'fluency', delta: 1, source: 'coach/chat'});
    if (typeof FLOW !== 'undefined' && FLOW.recordNovaTurn) {
      FLOW.recordNovaTurn();
    }
    SPEECH.speak(reply);
    self.render(el);
  }
}

function _novaRules(text) {
  var t = text.toLowerCase();
  var honest = (typeof isHonest === 'function') ? isHonest() : false;

  if (honest) {
    var fixes = [];
    var words = (typeof U !== 'undefined' && U.tokenise) ? U.tokenise(text).length : text.split(/\s+/).filter(Boolean).length;

    /* Collect ALL grammar rule checks */
    for (var ri = 0; ri < COACH_RULES.length; ri++) {
      if (COACH_RULES[ri].pat.test(text)) {
        fixes.push('Grammar: ' + COACH_RULES[ri].fix);
      }
    }

    /* Collect ALL vocabulary upgrades */
    for (var ui = 0; ui < COACH_UPGRADES.length; ui++) {
      var up = COACH_UPGRADES[ui];
      if (t.indexOf(up.basic.toLowerCase()) !== -1) {
        fixes.push('Upgrade "' + up.basic + '" → "' + up.better + '" (or "' + up.adv + '")');
      }
    }

    var score = Math.max(1, Math.min(10, 10 - (fixes.length * 2) - (words < 4 ? 2 : 0)));
    var color = score < 6 ? '#ef4444' : (score <= 8 ? '#f59e0b' : '#10b981');
    var chipHtml = '<span class="honest-score-chip" style="background:' + color + '22;color:' + color + ';border:1px solid ' + color + ';border-radius:12px;padding:2px 8px;font-weight:700;font-size:0.82rem;">' + score + '/10</span>';

    var out = chipHtml + ' <strong>Score: ' + score + '/10</strong>\n';
    if (fixes.length > 0) {
      out += 'Mistakes to fix:\n';
      for (var fi = 0; fi < fixes.length; fi++) {
        out += '▸ ' + fixes[fi] + '\n';
      }
      out += 'Exact corrected sentence required. Under 90 words.';
    } else {
      if (words < 4) {
        out += '▸ Too brief. Express a complete sentence (at least 4 words) to score higher.';
      } else {
        out += 'Zero glaring errors detected. Well structured.';
      }
    }
    return out;
  }

  /* Grammar rule checks */
  for (var ri = 0; ri < COACH_RULES.length; ri++) {
    if (COACH_RULES[ri].pat.test(text)) {
      return '⚠️ Grammar note: ' + COACH_RULES[ri].fix;
    }
  }

  /* Vocabulary upgrade */
  for (var ui = 0; ui < COACH_UPGRADES.length; ui++) {
    var up = COACH_UPGRADES[ui];
    if (t.indexOf(up.basic.toLowerCase()) !== -1) {
      return '💡 Upgrade: Instead of "' + up.basic + '" try "' + up.better + '" (B1) or "' + up.adv + '" (C1).';
    }
  }

  /* Intent matching */
  for (var ii = 0; ii < COACH_INTENTS.length; ii++) {
    var intent = COACH_INTENTS[ii];
    var keys = intent.k.split('|');
    for (var ki = 0; ki < keys.length; ki++) {
      if (t.indexOf(keys[ki].trim()) !== -1) {
        return intent.r;
      }
    }
  }

  return 'Good effort! Keep practising. For real AI feedback on grammar, pronunciation, and more — add your free Gemini key in Settings. Double-click any word in my replies to look it up instantly.';
}

function _novaBuildSystemPrompt(self) {
  'use strict';
  var user = STORE.get('user') || {};
  var settings = STORE.get('settings') || {};
  var radar = (typeof TRAINER !== 'undefined' && TRAINER.radar) ? TRAINER.radar() : [];

  /* Find weakest skill */
  var weakSkill = 'fluency';
  var weakScore = 100;
  for (var ri = 0; ri < radar.length; ri++) {
    if (radar[ri].val < weakScore) { weakScore = radar[ri].val; weakSkill = radar[ri].skill; }
  }

  var name = user.name ? user.name : 'the learner';
  var level = user.level || 'A2';
  var mode = self ? self._mode || 'chat' : 'chat';

  var base = 'You are Nova, an expert English speaking coach specialising in helping Indian learners.' +
    ' The student\'s name is ' + name + ' and their current CEFR level is ' + level + '.' +
    ' Their weakest skill right now is ' + weakSkill + ' — prioritise that in your coaching.' +
    ' Mode: ' + mode + '.' +
    ' Rules: correct grammar gently by quoting the error then giving the fix; suggest vocabulary upgrades when appropriate;' +
    ' be warm, direct, and concise (2–4 sentences unless asked for more).' +
    ' Never say you are an AI. You are Nova.';

  /* Document context */
  if (mode === 'document' && self && self._activeDoc) {
    var excerpt = self._activeDoc.text ? self._activeDoc.text.slice(0, 1200) : '';
    base += ' The student is currently reading a document titled "' + self._activeDoc.title + '".' +
      ' Here is an excerpt for context:\n---\n' + excerpt + '\n---' +
      ' When the student asks about a word or phrase, quote the surrounding sentence from the excerpt before explaining.' +
      ' When asked to summarise, produce a 3-bullet summary of the excerpt.';
  }

  /* M7 Brutal Honesty Mode */
  if (typeof isHonest === 'function' ? isHonest() : (settings.honestMode)) {
    base += ' BRUTAL HONESTY mode: start each reply with strict score \'N/10\'; list EVERY mistake one per line with ▸; never praise below 8/10; give the exact corrected sentence; under 90 words.';
  }

  return base;
}

function _novaGemini(userText, self, el, key) {
  var settings = STORE.get('settings') || {};
  var provider = settings.llmProvider || 'gemini';
  var hist = self._getHistory().slice(-12); /* last 12 turns for context */
  var messages = [];
  for (var i = 0; i < hist.length - 1; i++) { /* exclude the just-pushed user message */
    messages.push({
      role: hist[i].role === 'user' ? 'user' : 'model',
      content: hist[i].text
    });
  }
  messages.push({ role: 'user', content: userText });

  var systemPrompt = _novaBuildSystemPrompt(self);

  /* Show typing indicator */
  var h = self._getHistory();
  h.push({role: 'nova', text: '<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>'});
  self.render(el);
  /* Remove the typing indicator entry (it will be replaced by real reply) */
  h.pop();

  self._inFlightReply = true;

  llmAsk({
    provider: provider,
    key: key,
    systemPrompt: systemPrompt,
    messages: messages
  }).then(function (reply) {
    self._inFlightReply = false;
    h.push({role: 'nova', text: _esc(reply)});
    self._saveHistory();
    TRAINER.log({skill: 'fluency', delta: 1, source: 'coach/' + provider});
    if (typeof FLOW !== 'undefined' && FLOW.recordNovaTurn) {
      FLOW.recordNovaTurn();
    }
    STORE.save();
    SPEECH.speak(reply);
    self.render(el);
  }).catch(function (err) {
    self._inFlightReply = false;
    if (typeof UI !== 'undefined' && UI.toast) {
      UI.toast('⚠️ ' + provider + ' unavailable. Switching to offline engine.', 'warning');
    }
    if (typeof NOVA !== 'undefined' && typeof NOVA.fail === 'function') {
      NOVA.fail(err);
    } else if (typeof VIEWS.coach.fail === 'function') {
      VIEWS.coach.fail(err);
    }
    var reply = _novaRules(userText) + ' (offline — no connection)';
    h.push({role: 'nova', text: _esc(reply)});
    self._saveHistory();
    self.render(el);
  });
}

VIEWS.quiz = {
  _questions: [],
  _idx: 0,
  _answers: [],
  render: function (el, arg) {
    'use strict';
    var self = this;

    if (arg === 'result') {
      _renderQuizResult(el, self._answers, self._questions);
      return;
    }

    if (self._idx === 0 || arg === 'start') {
      // Shuffle and pick 15
      var pool = QUIZ_BANK.slice();
      for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
      self._questions = pool.slice(0, 15);
      self._idx = 0;
      self._answers = [];
    }

    if (self._idx >= self._questions.length) {
      _renderQuizResult(el, self._answers, self._questions);
      return;
    }

    var q = self._questions[self._idx];
    var optsHtml = '';
    for (var oi = 0; oi < q.opts.length; oi++) {
      optsHtml += '<button class="opt-btn" id="quiz-opt-' + oi + '">' + q.opts[oi] + '</button>';
    }

    el.innerHTML = '<div class="view-quiz">' +
      '<h1>🎓 Level Test</h1>' +
      '<div class="quiz-progress">Question ' + (self._idx + 1) + ' / ' + self._questions.length + '</div>' +
      '<div class="quiz-skill">Skill: ' + q.skill + '</div>' +
      '<div class="quiz-q"><p>' + q.q + '</p></div>' +
      '<div class="quiz-opts">' + optsHtml + '</div>' +
      '<div id="quiz-fb"></div>' +
      '</div>';

    for (var oi2 = 0; oi2 < q.opts.length; oi2++) {
      (function (idx) {
        var btn = document.getElementById('quiz-opt-' + idx);
        if (!btn) { return; }
        btn.addEventListener('click', function () {
          var fb = document.getElementById('quiz-fb');
          var correct = idx === q.ans;
          self._answers.push({q: q, chosen: idx, correct: correct});
          if (correct) {
            fb.innerHTML = '<p class="verdict pass">✅ Correct!</p>';
            TRAINER.log({skill: q.skill, delta: 2, source: 'quiz/correct'});
            STORE.addXP(5);
          } else {
            fb.innerHTML = '<p class="verdict fail">❌ Correct answer: ' + q.opts[q.ans] + '</p>';
            TRAINER.log({skill: q.skill, delta: -1, source: 'quiz/wrong'});
          }
          // Disable all opts
          for (var k = 0; k < q.opts.length; k++) {
            var b = document.getElementById('quiz-opt-' + k);
            if (b) { b.disabled = true; }
          }
          setTimeout(function () {
            self._idx++;
            self.render(el);
          }, 1200);
        });
      }(oi2));
    }
  }
};

function _renderQuizResult(el, answers, questions) {
  var correct = 0;
  var skillScores = {};
  for (var i = 0; i < answers.length; i++) {
    if (answers[i].correct) { correct++; }
    var sk = answers[i].q.skill;
    skillScores[sk] = skillScores[sk] || {ok: 0, total: 0};
    skillScores[sk].total++;
    if (answers[i].correct) { skillScores[sk].ok++; }
  }
  var pct = Math.round((correct / questions.length) * 100);
  var cefr = pct >= 90 ? 'C1' : pct >= 75 ? 'B2' : pct >= 55 ? 'B1' : pct >= 35 ? 'A2' : 'A1';

  var skillRows = '';
  for (var sk in skillScores) {
    if (skillScores.hasOwnProperty(sk)) {
      var s = skillScores[sk];
      var bar = Math.round((s.ok / s.total) * 100);
      skillRows += '<div class="skill-row"><span class="skill-name">' + sk + '</span><div class="skill-bar"><div class="skill-fill" style="width:' + bar + '%"></div></div><span class="skill-pct">' + bar + '%</span></div>';
    }
  }

  el.innerHTML = '<div class="view-quiz-result">' +
    '<h1>🎓 Level Test Results</h1>' +
    '<div class="cefr-badge">' + cefr + '</div>' +
    '<p><strong>' + correct + ' / ' + questions.length + '</strong> correct (' + pct + '%)</p>' +
    '<div class="skill-breakdown">' + skillRows + '</div>' +
    '<div class="result-btns">' +
    '<button onclick="VIEWS.quiz._idx=0; VIEWS.quiz.render(document.getElementById(\'view\'), \'start\')" class="btn-primary">Retake Test</button>' +
    '<a href="#/trainer" class="btn-link">View My Trainer →</a>' +
    '</div></div>';

  var user = STORE.get('user') || {};
  user.level = cefr;
  STORE.set('user', user);
  STORE.addXP(20);
  UI.toast('Level Test complete! You are ' + cefr + '. +20 XP', 'success');
  if (typeof FLOW !== 'undefined' && FLOW.mark) {
    FLOW.mark(1);
  }
}

        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;">'
        + '<span style="font-size:0.75rem;color:var(--acc2);text-transform:uppercase;font-weight:700;letter-spacing:0.05em;">Target Sentence</span>'
        + '<div style="display:flex;gap:6px;">'
        + '<button class="btn-ghost btn-sm" id="ob-hear-model" style="padding:4px 8px;font-size:0.8rem;border:1px solid var(--line);" title="Listen to model pronunciation">🔊 Hear Model</button>'
        + '<button class="btn-ghost btn-sm" id="ob-listen-slow" style="padding:4px 8px;font-size:0.8rem;border:1px solid var(--line);" title="Listen slowly">🐢 Slow</button>'
        + '</div>'
        + '</div>'
        + '<div id="ob-target-display" style="font-size:1.15rem;font-weight:700;color:var(--txt);margin-bottom:10px;line-height:1.4;">' + _esc(target) + '</div>'
        + '<div id="ob-chips-container" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;">'
        + (typeof LIVE_COACH !== 'undefined' ? LIVE_COACH.renderChipHTML(target, self._lastPartial || '') : _esc(target))
        + '</div>'
        + '<div id="ob-heard-box" style="min-height:24px;font-size:0.85rem;color:var(--mut);margin-top:8px;">'
        + (self._lastPartial ? ('Heard: <strong>&ldquo;' + _esc(self._lastPartial) + '&rdquo;</strong>') : 'Tap &ldquo;Start Speaking&rdquo; and read the sentence aloud...')

      } else {
        html += '<div style="background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.3);border-radius:var(--r-sm);padding:10px;margin-bottom:14px;font-size:0.82rem;color:var(--txt);text-align:center;">'
          + 'ℹ️ Browser microphone not detected. Type below to practice word-by-word live matching!'
          + '</div>';
      }

      html += '<div style="display:flex;gap:8px;margin-bottom:16px;">'

        + '<button class="btn-secondary" id="ob-typed-submit">Check</button>'
        + '</div>'

    }

    /* SCREEN 4: Power-up (Cloud Brain) */
    else if (screen === 3) {
      var currentKey = (STORE.get('settings') || {}).geminiKey || '';
      html += '<h1 style="font-size:1.4rem;font-weight:800;margin-bottom:4px;">⚡ Power-Up: Nova\'s Cloud Brain</h1>'
        + '<p style="color:var(--mut);font-size:0.85rem;margin-bottom:16px;">Nova works 100% offline out-of-the-box. Connect your free Google Gemini API key to unlock nuanced conversation and live accent coaching.</p>'

        + '<div style="background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;font-size:0.8rem;">'
        + '<div style="font-weight:700;color:var(--ok);margin-bottom:4px;">🛡️ Offline Rules</div>'
        + '<div style="color:var(--mut);line-height:1.4;">' + (allLessons.length || 68) + ' lessons, ' + (allPassages.length || 34) + ' graded texts, pronunciation lab, and SRS review always free forever.</div>'

        + '<label style="display:block;font-size:0.82rem;font-weight:600;margin-bottom:6px;color:var(--txt);">Gemini API Key <small>(<a href="https://aistudio.google.com" target="_blank" rel="noopener" style="color:var(--acc2);">Get free key at Google AI Studio ↗</a>)</small></label>'
        + '<input type="password" id="ob-gemini-key" placeholder="Paste your Gemini key here..." value="' + _esc(currentKey) + '" style="width:100%;padding:10px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--txt);margin-bottom:8px;" />'
        + '<div style="display:flex;align-items:center;gap:10px;">'
        + '<button class="btn-secondary btn-sm" id="ob-test-llm">🧪 Test & activate</button>'
        + '<span id="ob-test-status" style="font-size:0.85rem;">' + (currentKey ? '<strong style="color:var(--ok);">✅ Active</strong>' : '') + '</span>'

      var isListening = false;

      if (hearBtn) {

      if (slowBtn) {
        slowBtn.addEventListener('click', function () {
          if (typeof SPEECH !== 'undefined' && SPEECH.speakSlow) {
            SPEECH.speakSlow(target2);

      function _onPartialMatch(text, alts) {
        var candidates = [text];
        if (alts && alts.length) {
          for (var a = 0; a < alts.length; a++) {
            if (candidates.indexOf(alts[a]) === -1) {
              candidates.push(alts[a]);
            }
          }
        }
        var match = (typeof LIVE_COACH !== 'undefined' && LIVE_COACH.matchBest)
          ? LIVE_COACH.matchBest(target2, candidates)
          : ((typeof LIVE_COACH !== 'undefined') ? LIVE_COACH.matchPrefix(target2, text) : { matchedCount: 0, targetTokens: [] });

        self._lastPartial = match.partial || text;

        var chipsContainer = document.getElementById('ob-chips-container');
        if (chipsContainer && typeof LIVE_COACH !== 'undefined') {
          chipsContainer.innerHTML = LIVE_COACH.renderChipHTML(target2, match);

        var heardBox = document.getElementById('ob-heard-box');
        if (heardBox && text) {
          heardBox.innerHTML = '<span style="color:var(--txt);">Heard: <strong>&ldquo;' + _esc(text) + '&rdquo;</strong></span>';
        }

        var statusEl = document.getElementById('ob-match-status');
        var totalTokens = match.targetTokens ? match.targetTokens.length : 0;
        if (statusEl && totalTokens > 0) {
          if (match.isComplete) {
            statusEl.innerHTML = '🎉 <strong style="color:var(--ok);">All ' + totalTokens + ' words matched! Perfect!</strong>';
          } else {
            statusEl.innerHTML = '<span style="color:var(--acc2);">' + match.matchedCount + '</span> / ' + totalTokens + ' words matched';
          }
        }

        if (match.matchedCount >= 1 && !self._drillFirstWordCelebrated) {
          self._drillFirstWordCelebrated = true;
          STORE.addXP(10, 'onboarding-drill');
          if (typeof FLOW !== 'undefined' && FLOW.mark) {
            FLOW.mark(1);

          var popEl = document.getElementById('ob-xp-pop');
          if (popEl) {
            popEl.style.display = 'block';
            popEl.innerHTML = '🎉 +10 XP! First word unlocked! Flow Step 1 (Diagnose) marked DONE!';
          }
          if (s3Next) {
            s3Next.style.opacity = '1';
            s3Next.textContent = 'Continue to Power-up →';
          }
          UI.toast('🎉 First word matched! +10 XP & Step 1 Done!', 'success');
        }

        if (match.isComplete && !self._drillCompleted) {
          self._drillCompleted = true;
          completed = true;
          STORE.addXP(20, 'onboarding-drill-complete');
          var popElComplete = document.getElementById('ob-xp-pop');
          if (popElComplete) {
            popElComplete.style.display = 'block';

          }
          UI.toast('🏆 Sentence complete! Excellent clarity! +20 XP', 'success');
          _resetMic();
          if (s3Next) {

            s3Next.style.boxShadow = '0 0 16px rgba(52, 211, 153, 0.4)';
            s3Next.textContent = 'Continue to Power-up →';
          }
        }
      }

      function _resetMic() {
        isListening = false;
        if (micBtn) {
          micBtn.textContent = '🎙️ Start Speaking';
          micBtn.style.background = '';
          micBtn.style.borderColor = '';
          micBtn.classList.remove('pulse');
        }
      }

      function _startListening() {
        if (isListening) { return; }
        isListening = true;
        if (micBtn) {
          micBtn.textContent = '⏹️ Stop Listening';
          micBtn.style.background = 'var(--err, #ef4444)';

            if (completed) { return; }
            _onPartialMatch(transcript, alts);
          },
          onend: function () {
            if (completed) { return; }
            _resetMic();
          },
          onerror: function (msg, code) {
            if (completed) { return; }
            _resetMic();
            if (code === 'not-allowed') {
              var hb = document.getElementById('ob-heard-box');
              if (hb) {
                hb.innerHTML = '<span style="color:var(--err);">⚠️ Microphone permission denied. Type below to practice!</span>';
              }
              if (typedInput && typedInput.focus) { typedInput.focus(); }
            } else if (code !== 'aborted') {
              UI.toast(msg, 'warning');
            }
          }
        });
      }

      if (micBtn && SPEECH.canListen()) {
        micBtn.addEventListener('click', function () {

      }

      if (s3Next) {
        s3Next.addEventListener('click', function () {

        STORE.save();

          navigate('home');
        }
      }

      if (skipCloudBtn) { skipCloudBtn.addEventListener('click', _completeAll); }

/* ── TODAY'S DOSE ────────────────────────────────────────────────────── */
VIEWS.daily = {
  render(el) {
    const xp     = STORE.get('xp') || 0;
    const streak = STORE.get('streak') || 0;
    const today  = new Date().toISOString().slice(0, 10);
    const daily  = STORE.get('daily') || {};

    // Date-seeded picks
    const twister  = U.dailyPick(TWISTERS);
    const word     = U.dailyPickN(POWER_WORDS, 1);
    const idiom    = U.dailyPickN(IDIOMS, 2);
    const quote    = U.dailyPickN(QUOTES, 3);
    const done     = (daily.date === today ? daily.done : []);

    // SRS due count for quest
    const srs = STORE.get('srs') || {};
    const now = Date.now();
    let dueCount = 0;
    for (const k in srs) {
      if (srs.hasOwnProperty(k) && srs[k].due && srs[k].due <= now) dueCount++;
    }

    const quests = [
      { id: 'twister',  label: '🌀 Say the Twister',        done: done.indexOf('twister') !== -1 },
      { id: 'word',     label: '⚡ Learn the Power Word',    done: done.indexOf('word') !== -1 },
      { id: 'idiom',    label: '📜 Quiz the Idiom',          done: done.indexOf('idiom') !== -1 },
      { id: 'quote',    label: '💬 Shadow the Quote',        done: done.indexOf('quote') !== -1 },
      { id: 'review',   label: `🔁 Review (${dueCount})`,    done: dueCount === 0 || done.indexOf('review') !== -1 }
    ];

    const questHtml = quests.map(q =>
      `<div class="quest-item${q.done ? ' done' : ''}">
         <span class="quest-check">${q.done ? '✅' : '⬜'}</span>
         <span>${q.label}</span>
         ${q.id === 'review' && !q.done ? `<a href="#/review" class="btn-sm">Go →</a>` : ''}
       </div>`
    ).join('');

    el.innerHTML = `
    <div class="view-daily">

        STORE.addXP(5);
        return;
      }

      btn.textContent = '🔊 Playing model…'; btn.disabled = true;

        onend: () => {
          btn.textContent = '🔴 Listening… speak now!';
          btn.classList.add('pulse');
          SPEECH.listen({
            interim: true,
            continuous: true,
            onresult: (t, isFinal) => {

                const aligned = U.align(quote.text, t);

                _markDone('quote', done, today);

                btn.textContent = '🎤 Shadow it'; btn.disabled = false; btn.classList.remove('pulse');
              }
            },
            onend: () => { btn.textContent = '🎤 Shadow it'; btn.disabled = false; btn.classList.remove('pulse'); },
            onerror: msg => { UI.toast(msg, 'error'); btn.textContent = '🎤 Shadow it'; btn.disabled = false; btn.classList.remove('pulse'); }
          });
        },
        onerror: () => {
          btn.textContent = '🎤 Shadow it'; btn.disabled = false; btn.classList.remove('pulse');
        }
      });
    });

    // Idiom opts
    const idiomOpts = document.getElementById('idiom-opts');
    if (idiomOpts) {
      idiomOpts.addEventListener('click', e => {
        const btn = e.target.closest('.opt-btn');
        if (!btn) return;
        const correct = btn.dataset.correct === '1';
        const fb = document.getElementById('idiom-fb');
        fb.innerHTML = correct
          ? `<p class="verdict pass">✅ Correct! ${idiom.meaning}</p><p class="idiom-eg"><em>"${idiom.eg}"</em></p>`
          : `<p class="verdict fail">❌ The meaning is: ${idiom.meaning}</p>`;
        idiomOpts.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
        _markDone('idiom', done, today);
        TRAINER.log({skill: 'vocab', delta: correct ? 2 : -1, source: 'daily/idiom'});
        STORE.addXP(correct ? 5 : 2);
      });
    }
  }
};

function _makeIdiomOpts(idiom) {
  // Build 3 decoy meanings from other idioms
  const others = IDIOMS.filter(i => i.id !== idiom.id).slice(0, 8);
  const pool = [idiom.meaning];
  for (let i = 0; i < others.length && pool.length < 4; i++) {
    if (others[i].meaning !== idiom.meaning) pool.push(others[i].meaning);
  }
  // Shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.map(m =>
    `<button class="opt-btn" data-correct="${m === idiom.meaning ? '1' : '0'}">${m}</button>`
  ).join('');
}

function _markDone(id, done, today) {
  if (done.indexOf(id) === -1) done.push(id);
  STORE.set('daily', {date: today, done: done});
}

  _tab: 'idioms',
  _mode: 'browse',   // browse | quiz
  _quizIdx: 0,
  render(el) {
    const self = this;
    const { _tab: tab, _mode: mode } = self;

    const tabBar = `<div class="tab-bar">
      <button class="tab-btn${tab==='idioms'?' active':''}" id="tab-idioms">Idioms (48)</button>
      <button class="tab-btn${tab==='pvs'?' active':''}" id="tab-pvs">Phrasal Verbs (48)</button>
    </div>`;

    const modeBar = `<div class="mode-bar">
      <button class="tab-btn${mode==='browse'?' active':''}" id="mode-browse">📖 Browse</button>
      <button class="tab-btn${mode==='quiz'?' active':''}" id="mode-quiz">🎯 Quiz</button>
    </div>`;

    const data = tab === 'idioms' ? IDIOMS : PVS;
    let content = '';

    if (mode === 'browse') {
      content = `<div class="idiom-list">` +
        data.map(item => {
          const key = (tab === 'idioms' ? 'idn_' : 'pv_') + item.id;
          const m = STORE.getMastery(key);
          return `<div class="idiom-card" style="padding:16px;border-radius:14px;background:var(--bg1);border:1px solid var(--border);margin-bottom:14px;">
            <div class="idiom-head" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <span class="idiom-text" style="font-size:1.15rem;font-weight:700;color:var(--pri);">${item.text}</span>
              <div style="display:flex;gap:6px;align-items:center;">
                <button class="btn-sm btn-ghost" data-say="${item.text}">🔊 Hear</button>
              </div>
            </div>
            <div class="idiom-meaning" style="font-size:1rem;margin-bottom:6px;">💡 <strong>What it means:</strong> ${item.meaning}</div>
            ${item.sit ? `<div style="font-size:0.9rem;color:var(--ok);margin-bottom:6px;">🎯 <strong>When & where to use:</strong> ${item.sit}</div>` : ''}
            ${item.how ? `<div style="font-size:0.85rem;color:var(--txt);margin-bottom:6px;">🛠️ <strong>How to use:</strong> ${item.how}</div>` : ''}
            ${item.dialogue ? `<div style="font-size:0.85rem;font-style:italic;color:var(--accent);background:rgba(124,58,237,0.06);padding:8px 12px;border-radius:8px;margin-bottom:8px;">💬 <strong>Dialogue:</strong> ${item.dialogue}</div>` : `<div class="idiom-eg"><em>"${item.eg}"</em></div>`}
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
              <div class="mastery-dots">${_masteryDots(m)}</div>
              <button class="btn-sm btn-ghost" data-say="${item.text}">🎤 Practice Saying</button>
            </div>
          </div>`;
        }).join('') + `</div>`;
    } else {
      // Quiz mode
      const item = data[self._quizIdx % data.length];
      const key = (tab === 'idioms' ? 'idn_' : 'pv_') + item.id;
      const m = STORE.getMastery(key);
      // Build distractor opts
      const others = data.filter(d => d.id !== item.id).slice(0, 8);
      const pool = [item.meaning];
      for (let i = 0; i < others.length && pool.length < 4; i++) {
        if (pool.indexOf(others[i].meaning) === -1) pool.push(others[i].meaning);
      }
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      const optsHtml = pool.map(m2 =>
        `<button class="opt-btn" data-ans="${m2 === item.meaning ? '1' : '0'}">${m2}</button>`
      ).join('');

      content = `<div class="idiom-quiz">
        <div class="iq-num">${self._quizIdx + 1} / ${data.length}</div>
        <div class="iq-text">"${item.text}" <button class="btn-sm" data-say="${item.text}">🔊</button></div>
        <div class="mastery-dots">${_masteryDots(m)}</div>
        <div class="iq-question">What does this mean?</div>
        <div class="iq-opts" id="iq-opts">${optsHtml}</div>
        <div id="iq-fb"></div>
        <button class="btn-link" id="iq-next">Skip →</button>
      </div>`;
    }

    el.innerHTML = `<div class="view-idioms"><h1>📜 Idioms & Phrasal Verbs</h1>${tabBar}${modeBar}<div class="tab-content">${content}</div></div>`;

    document.getElementById('tab-idioms').addEventListener('click', () => { self._tab = 'idioms'; self._quizIdx = 0; self.render(el); });
    document.getElementById('tab-pvs').addEventListener('click', () => { self._tab = 'pvs'; self._quizIdx = 0; self.render(el); });
    document.getElementById('mode-browse').addEventListener('click', () => { self._mode = 'browse'; self.render(el); });
    document.getElementById('mode-quiz').addEventListener('click', () => { self._mode = 'quiz'; self.render(el); });

    if (mode === 'quiz') {
      const item = data[self._quizIdx % data.length];
      const key = (tab === 'idioms' ? 'idn_' : 'pv_') + item.id;
      const iqOpts = document.getElementById('iq-opts');
      if (iqOpts) {
        iqOpts.addEventListener('click', e => {
          const btn = e.target.closest('.opt-btn');
          if (!btn) return;
          const correct = btn.dataset.ans === '1';
          document.getElementById('iq-fb').innerHTML = correct
            ? `<p class="verdict pass">✅ Correct! "${item.eg}"</p>`
            : `<p class="verdict fail">❌ Meaning: ${item.meaning}</p>`;
          iqOpts.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
          STORE.master(key, correct);
          TRAINER.log({skill: 'vocab', delta: correct ? 2 : -1, source: `idioms/${tab}`});
          STORE.addXP(correct ? 5 : 1);
          setTimeout(() => { self._quizIdx++; self.render(el); }, 1400);
        });
      }
      document.getElementById('iq-next').addEventListener('click', () => { self._quizIdx++; self.render(el); });
    }
  }
};

/* ── SENTENCE DOCTOR ─────────────────────────────────────────────────── */
var DOCTOR_RULES = [
  {pat: /\b(he|she|it)\s+(go|come|eat|play|work|make|do|have)\b/i, msg: 'Missing third-person -s: "she goes", "he works"'},
  {pat: /\bdid\s+(not\s+)?(went|came|ate|played|worked|made|had)\b/i, msg: 'Use base form after "did/didn\'t": "didn\'t go" (not "didn\'t went")'},
  {pat: /\b(a)\s+[aeiou]/i, msg: 'Use "an" before vowel sounds: "an apple", "an hour"'},
  {pat: /\bmore\s+(bigger|smaller|faster|slower|better|worse)\b/i, msg: 'Double comparison: "better" not "more better"'},
  {pat: /\bI\s+am\s+(agree|disagree|know|think|want|need)\b/i, msg: 'State verb error: "I agree" (not "I am agree")'},
  {pat: /\bmake\s+(a\s+)?homework\b/i, msg: '"Do homework" (not "make homework")'},
  {pat: /\bdo\s+the\s+needful\b/i, msg: 'Dated Indian English: say "please handle this" or "please take care of this"'},
  {pat: /\bkindly\s+revert\b/i, msg: '"Revert" in this sense is Indian English: say "please reply" or "please get back to me"'},
  {pat: /\bI\s+will\s+revert\s+back\b/i, msg: '"Revert" already means "go back": say "I will reply" or "I will get back to you"'},
  {pat: /\bpreponed\b/i, msg: '"Preponed" is not standard English: say "moved earlier" or "rescheduled earlier"'},
  {pat: /\b(myself|yourself)\s+is\b/i, msg: 'Reflexive pronoun as subject: "I am" (not "myself is")'},
  {pat: /\balthough.*\bbut\b|\bbut.*\balthough\b/i, msg: 'Don\'t use "although" and "but" in the same clause: choose one'},
  {pat: /\bvery\s+unique\b/i, msg: '"Unique" is absolute: say "truly unique" or just "unique"'},
  {pat: /\bsince\s+\d+\s+(days?|weeks?|months?)\b/i, msg: 'Use "for" with duration: "for 3 days". Use "since" with a point: "since Monday"'},
  {pat: /\bdoubt\b/i, msg: 'Indian usage: "I have a doubt" → prefer "I have a question" in standard English'},
  {pat: /\bpassout\b/i, msg: '"Passout" as a noun (graduate) is Indian English: say "graduate" or "alumnus"'},
  {pat: /\bI\s+can\s+able\b/i, msg: '"Can able" is incorrect: say "I can do it" or "I am able to do it"'},
  {pat: /\bhe\s+is\s+must\b/i, msg: 'Modals don\'t use "be": "he must come" (not "he is must to come")'},
  {pat: /\bI\s+am\s+having\s+a\s+(doubt|question|problem)\b/i, msg: '"Have" for possession: "I have a question" (not "I am having")'},
  {pat: /\bon\s+the\s+other\s+hand[,\s]+on\s+the\s+other\s+hand\b/i, msg: 'Repeated phrase: use "on one hand... on the other hand"'},
  {pat: /irregardless/i, msg: '"Irregardless" is non-standard: use "regardless"'},
  {pat: /\bsupposably\b/i, msg: 'Incorrect form: use "supposedly"'},
  {pat: /\bflustrated\b/i, msg: 'Blend of "flustered" + "frustrated": say one or the other'},
  {pat: /\bcould\s+of\b/i, msg: '"Could of" is wrong: it\'s "could have" or "could\'ve"'},
  {pat: /\bshould\s+of\b/i, msg: '"Should of" is wrong: it\'s "should have" or "should\'ve"'},
  {pat: /\bwould\s+of\b/i, msg: '"Would of" is wrong: it\'s "would have" or "would\'ve"'},
  {pat: /\bless\s+\w+(s)\b/i, msg: 'For countable nouns, use "fewer" not "less": "fewer mistakes" (not "less mistakes")'},
  {pat: /\bbetween\s+\w+\s+and\s+\w+\s+and\b/i, msg: '"Between" is for two things: use "among" for three or more'},
  {pat: /\bI\s+myself\s+is\b/i, msg: '"I myself am" (not "I myself is")'},
  {pat: /\bthe\s+informations\b/i, msg: '"Information" is uncountable — no plural: "the information"'},
  {pat: /\badvices\b/i, msg: '"Advice" is uncountable — no plural: "pieces of advice"'},
  {pat: /\bfurnitures\b/i, msg: '"Furniture" is uncountable — no plural: "furniture"'},
  {pat: /\beither\s+\w+,\s*\w+\s+or\b/i, msg: '"Either...or" takes two options only'},
  {pat: /\bis\s+been\b/i, msg: '"Is been" is incorrect: say "has been" (present perfect)'},
  {pat: /\bwas\s+went\b/i, msg: '"Was went" is incorrect: say "went" (simple past)'}
];

VIEWS.doctor = {
  render(el) {
    el.innerHTML = `
    <div class="view-doctor">
      <h1>🩺 Sentence Doctor</h1>
      <p class="sub">Paste or speak any sentence — get instant diagnosis with fixes.</p>
      <div class="doctor-input">
        <textarea id="doctor-text" rows="4" placeholder="Type, paste, or speak a sentence or paragraph here..."></textarea>
        <div style="display:flex;gap:10px;margin-top:10px;align-items:center;flex-wrap:wrap;">
          <button class="btn-primary" id="doctor-check">🩺 Diagnose</button>
          <button class="btn-secondary" id="doctor-mic">🎙️ Speak Sentence</button>
        </div>
      </div>
      <div id="doctor-results"></div>
    </div>`;

    const micBtn = document.getElementById('doctor-mic');
    if (micBtn) {
      let isListening = false;
      micBtn.addEventListener('click', () => {
        if (!SPEECH.canListen()) {
          UI.toast('Speech recognition not available on this browser. Type your sentence above.', 'warning');
          return;
        }
        if (isListening) {
          SPEECH.stopListening();
          isListening = false;
          micBtn.textContent = '🎙️ Speak Sentence';
          micBtn.classList.remove('pulse');
          return;
        }
        isListening = true;
        micBtn.textContent = '⏹️ Stop Listening';
        micBtn.classList.add('pulse');
        SPEECH.listen({
          interim: true,
          continuous: true,
          onresult: (t, isFinal) => {
            const ta = document.getElementById('doctor-text');
            if (ta) { ta.value = t; }
            if (isFinal) {
              isListening = false;
              micBtn.textContent = '🎙️ Speak Sentence';
              micBtn.classList.remove('pulse');
              document.getElementById('doctor-check').click();
            }
          },
          onend: () => {
            isListening = false;
            micBtn.textContent = '🎙️ Speak Sentence';
            micBtn.classList.remove('pulse');
          },
          onerror: (msg, code) => {
            isListening = false;
            micBtn.textContent = '🎙️ Speak Sentence';
            micBtn.classList.remove('pulse');
            if (code !== 'aborted') { UI.toast(msg, 'warning'); }
          }
        });
      });
    }

    document.getElementById('doctor-check').addEventListener('click', () => {
      const text = document.getElementById('doctor-text').value.trim();
      if (!text) { UI.toast('Please enter a sentence.', 'error'); return; }
      const results = [];
      for (const rule of DOCTOR_RULES) {
        if (rule.pat.test(text)) results.push(rule.msg);
      }
      const resultsEl = document.getElementById('doctor-results');
      if (results.length === 0) {
        resultsEl.innerHTML = `<div class="doctor-ok">✅ No common errors detected! Your sentence looks good.</div>`;
        TRAINER.log({skill: 'grammar', delta: 1, source: 'doctor/clean'});
      } else {
        resultsEl.innerHTML = `<div class="doctor-issues">
          <h3 style="margin-bottom:12px;color:var(--warn);">⚠️ ${results.length} issue${results.length > 1 ? 's' : ''} detected:</h3>
          <div style="display:flex;flex-direction:column;gap:10px;">${results.map((r, idx) => `
            <div class="doctor-issue-card" style="background:var(--bg1);border:1px solid var(--border);border-left:4px solid var(--warn);border-radius:10px;padding:12px 14px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                <strong style="color:var(--warn);font-size:0.95rem;">Diagnosis #${idx + 1}</strong>
                <span class="badge" style="font-size:0.75rem;">Grammar Doctor</span>

            </div>
          `).join('')}</div>
        </div>`;
        TRAINER.log({skill: 'grammar', delta: -1, source: 'doctor/issues'});
      }
      STORE.addXP(2);
      if (typeof WEEKLY !== 'undefined' && WEEKLY.recordFixerSession) {
        const words = (typeof U !== 'undefined' && U.tokenise) ? U.tokenise(text).length : text.split(/\s+/).filter(Boolean).length;

          issuesCount: results.length,
          wordCount: words,
          wpm: 120,
          fillersPerMin: 0
        });
      }
    });
  }
};

/* ── SRS HELPERS (MISSION 2) ─────────────────────────────────────────── */
const SRS_INTERVALS = [1, 3, 7, 16, 35]; // days, strictly monotonic

function srsSchedule(prefixedKey, correct) {
  const srs = STORE.get('srs') || {};
  const item = srs[prefixedKey] || {interval: 0, due: Date.now()};
  let interval;
  if (correct) {
    // Move to next interval bracket
    const nextIdx = Math.min(item.interval + 1, SRS_INTERVALS.length - 1);
    interval = nextIdx;
  } else {
    // Reset to first interval
    interval = 0;
  }
  srs[prefixedKey] = {
    interval: interval,
    due: Date.now() + SRS_INTERVALS[interval] * 86400000
  };
  STORE.set('srs', srs);
  return srs[prefixedKey];
}

function srsDueItems() {
  const srs = STORE.get('srs') || {};
  const mastery = STORE.get('mastery') || {};
  const now = Date.now();
  const due = [];
  for (const k in srs) {
    if (srs.hasOwnProperty(k) && srs[k].due && srs[k].due <= now) {
      due.push({ key: k, mastery: mastery[k] || 0, srs: srs[k] });
    }
  }
  return due;
}

/* ── REVIEW QUEUE (MISSION 2) ───────────────────────────────────────── */
VIEWS.review = {
  _idx: 0,
  render(el, arg) {
    const dueItems = srsDueItems();

    if (dueItems.length === 0) {
      el.innerHTML = `
      <div class="view-review">
        <h1>🔁 Review Queue</h1>
        <div class="review-empty">
          <div class="review-empty-icon">🎉</div>
          <h2>All caught up!</h2>
          <p>No items due for review right now. Come back tomorrow.</p>
          <a href="#/home" class="btn-primary">← Back to Home</a>
        </div>
      </div>`;
      return;
    }

    if (this._idx >= dueItems.length) {
      el.innerHTML = `
      <div class="view-review">
        <h1>🔁 Review Complete!</h1>
        <div class="review-empty">
          <div class="review-empty-icon">✅</div>
          <h2>Session done!</h2>
          <p>You reviewed <strong>${dueItems.length}</strong> items. Next review in 1–35 days based on your performance.</p>
          <a href="#/home" class="btn-primary">← Back to Home</a>
        </div>
      </div>`;
      this._idx = 0;
      return;
    }

    const item = dueItems[this._idx];
    const self = this;

    // Determine display info from prefix
    let word = item.key, displayText = item.key, displayType = '';
    if (item.key.startsWith('spell_')) {
      word = item.key.replace('spell_', '');
      const wEntry = WORDS.find(w => w.w === word);
      displayText = word;
      displayType = 'spelling';
    } else if (item.key.startsWith('idn_')) {
      const id = item.key.replace('idn_', '');
      const idiom = IDIOMS.find(i => i.id === id);
      displayText = idiom ? idiom.text : id;
      displayType = 'idiom';
    } else if (item.key.startsWith('pv_')) {
      const id = item.key.replace('pv_', '');
      const pv = PVS.find(p => p.id === id);
      displayText = pv ? pv.text : id;
      displayType = 'phrasal verb';
    } else if (item.key.startsWith('lsn_')) {
      displayText = item.key.replace('lsn_', '');
      displayType = 'listening';
    } else if (item.key.startsWith('read_')) {
      displayText = item.key.replace('read_', '');
      displayType = 'reading';
    }

    const nextInterval = SRS_INTERVALS[Math.min(item.srs.interval + 1, SRS_INTERVALS.length - 1)];
    const resetInterval = SRS_INTERVALS[0];

    el.innerHTML = `
    <div class="view-review">
      <h1>🔁 Review Queue</h1>
      <div class="review-progress">${this._idx + 1} / ${dueItems.length}</div>

      <div class="review-card">
        <div class="rc-type">${displayType}</div>
        <div class="rc-text" data-say="${displayText}">${displayText}</div>
        <div class="mastery-dots big">${_masteryDots(item.mastery)}</div>
        <button class="btn-sm" data-say="${displayText}">🔊 Hear it</button>
      </div>

      <div class="review-prompt">Do you remember this?</div>
      <div class="review-btns">
        <button class="btn-danger" id="rv-no">😅 Hard — show again in ${resetInterval}d</button>
        <button class="btn-primary" id="rv-yes">✅ Got it! — next in ${nextInterval}d</button>
      </div>
    </div>`;

    const btnYes = (el.querySelector ? el.querySelector('#rv-yes') : null) || document.getElementById('rv-yes');
    if (btnYes && btnYes.addEventListener) {
      btnYes.addEventListener('click', () => {
        srsSchedule(item.key, true);
        STORE.master(item.key, true);
        const skill = item.key.startsWith('spell_') ? 'spelling' : 'vocab';
        TRAINER.log({skill: skill, delta: 2, source: 'review/correct'});
        STORE.addXP(3);
        if (typeof updateReviewBadge === 'function') { updateReviewBadge(); }
        if (typeof FLOW !== 'undefined' && FLOW.recordSrsReview) { FLOW.recordSrsReview(); }
        self._idx++;
        self.render(el);
      });
    }

    const btnNo = (el.querySelector ? el.querySelector('#rv-no') : null) || document.getElementById('rv-no');
    if (btnNo && btnNo.addEventListener) {
      btnNo.addEventListener('click', () => {
        srsSchedule(item.key, false);
        STORE.master(item.key, false);
        const skill = item.key.startsWith('spell_') ? 'spelling' : 'vocab';
        TRAINER.log({skill: skill, delta: -1, source: 'review/hard'});
        if (typeof updateReviewBadge === 'function') { updateReviewBadge(); }
        if (typeof FLOW !== 'undefined' && FLOW.recordSrsReview) { FLOW.recordSrsReview(); }
        self._idx++;
        self.render(el);
      });
    }
  }
};

/* ── MY TRAINER ─────────────────────────────────────────────────────── */
VIEWS.trainer = {
  render(el) {
    const scores = TRAINER.aggregate();
    const weak = TRAINER.weakestFirst();
    const history = TRAINER.xpHistory();

    // SVG radar
    const skills = TRAINER.SKILLS;
    const cx = 140, cy = 140, r = 110;
    const n = skills.length;
    const radarPoints = skills.map((s, i) => {
      const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
      const val = (scores[s] || 50) / 100;
      return {
        x: cx + r * val * Math.cos(angle),
        y: cy + r * val * Math.sin(angle),
        lx: cx + (r + 24) * Math.cos(angle),
        ly: cy + (r + 24) * Math.sin(angle),
        label: SKILL_META[s] ? SKILL_META[s].label : s,
        score: scores[s],
        color: SKILL_META[s] ? SKILL_META[s].color : '#7c3aed'
      };
    });

    const gridLevels = [0.25, 0.5, 0.75, 1.0];
    let gridSvg = '';
    gridLevels.forEach(lvl => {
      const pts = skills.map((s, i) => {
        const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
        return `${cx + r * lvl * Math.cos(angle)},${cy + r * lvl * Math.sin(angle)}`;
      }).join(' ');
      gridSvg += `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>`;
    });
    skills.forEach((s, i) => {
      const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
      gridSvg += `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(angle)}" y2="${cy + r * Math.sin(angle)}" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>`;
    });

    const radarPoly = radarPoints.map(p => `${p.x},${p.y}`).join(' ');
    const dots = radarPoints.map(p => `<circle cx="${p.x}" cy="${p.y}" r="5" fill="${p.color}"/>`).join('');
    const labels = radarPoints.map(p => `<text x="${p.lx}" y="${p.ly}" fill="white" font-size="10" text-anchor="middle" dominant-baseline="middle">${p.label}</text>`).join('');

    const radarSvg = `<svg viewBox="0 0 280 280" class="radar-svg">
      ${gridSvg}
      <polygon points="${radarPoly}" fill="rgba(124,58,237,0.35)" stroke="#7c3aed" stroke-width="2"/>
      ${dots}
      ${labels}
    </svg>`;

    // Weakness plan
    const planItems = weak.slice(0, 3).map(item => {
      const meta = SKILL_META[item.skill] || {};
      const routeMap = {pronunciation:'pronunciation',grammar:'atlas',vocab:'idioms',spelling:'spelling',fluency:'path',listening:'listening'};
      return `<div class="plan-item">

/* ── SPEAKING ASSESSMENT ─────────────────────────────────────────────── */
VIEWS.assessment = {
  _task: 0,
  _results: [],
  render(el, arg) {
    const self = this;

    if (arg === 'history') {
      _renderAssessHistory(el);
      return;
    }

    const allPassages = (typeof DATA_MERGE !== 'undefined') ? DATA_MERGE.allPassages() : ((typeof PASSAGES !== 'undefined' && Array.isArray(PASSAGES)) ? PASSAGES : []);
    const tasks = [
      { type: 'read', label: 'Read Aloud', prompt: 'Read this passage aloud:', text: (allPassages.length ? allPassages[0].text.slice(0, 200) : '') + '...' },
      { type: 'topic', label: 'Free Topic', prompt: ASSESSMENT_POOLS.topics[0], text: null },
      { type: 'scene', label: 'Role Scene', prompt: ASSESSMENT_POOLS.scenes[0].role, text: null },
      { type: 'topic', label: 'Random Topic', prompt: ASSESSMENT_POOLS.topics[2], text: null },
      { type: 'scene', label: 'Pitch Scene', prompt: ASSESSMENT_POOLS.scenes[4].role, text: null }
    ];

    if (self._task >= tasks.length) {
      _renderAssessResult(el, self._results);
      self._task = 0;
      return;
    }

    const task = tasks[self._task];
    el.innerHTML = `
    <div class="view-assessment">
      <div class="assess-header">
        <h1>🏆 Speaking Assessment</h1>
        <button onclick="navigate('assessment','history')" class="btn-link">View History</button>
      </div>
      <div class="assess-progress">Task ${self._task + 1} / ${tasks.length}: ${task.label}</div>
      <div class="assess-prompt">${task.prompt}</div>
      ${task.text ? `<div class="assess-passage">${task.text}</div>` : ''}
      <div class="assess-timer" id="assess-timer">00:30</div>
      <div style="display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap;">
        <button class="btn-primary" id="assess-start">🎤 Start Recording (30s)</button>
        <button class="btn-secondary" id="assess-finish" style="display:none;">⏹️ Finish Task</button>
      </div>
      <div id="assess-live-card" style="display:none;background:var(--bg1);border:1px solid var(--accent);border-radius:12px;padding:14px;margin:14px 0;text-align:left;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:0.85rem;">
          <span style="color:var(--accent);font-weight:700;">🎙️ LIVE RECOGNITION</span>
          <span style="color:var(--mut);">Words: <strong id="assess-live-wc" style="color:var(--pri);">0</strong> &bull; Fillers: <strong id="assess-live-fc" style="color:var(--warn);">0</strong></span>
        </div>
        <div id="assess-live-text" style="font-size:1rem;color:var(--txt);line-height:1.5;min-height:36px;font-style:italic;">Listening... speak naturally now.</div>
      </div>
      <div id="assess-typed-wrap" style="${SPEECH.canListen() ? 'display:none;' : ''}">
        <textarea id="assess-typed" rows="4" placeholder="Type your response here..."></textarea>
        <button class="btn-primary" id="assess-typed-submit" style="margin-top:8px;">Submit Typed Response</button>
      </div>
      <div id="assess-fb"></div>
    </div>`;

    const startBtn = document.getElementById('assess-start');
    const finishBtn = document.getElementById('assess-finish');
    const timerEl = document.getElementById('assess-timer');
    const liveCard = document.getElementById('assess-live-card');
    const liveTextEl = document.getElementById('assess-live-text');
    const liveWcEl = document.getElementById('assess-live-wc');
    const liveFcEl = document.getElementById('assess-live-fc');
    let isRecording = false;
    let seconds = 30;
    let timer = null;
    let words = [], fillers = 0;
    const FILLERS = ['um','uh','er','ah','like','you know','basically','actually','literally'];

    function _onTranscript(t) {
      words = U.tokenise(t);
      fillers = words.filter(w => FILLERS.indexOf(w) !== -1).length;
      if (liveTextEl) { liveTextEl.textContent = t || 'Listening...'; }
      if (liveWcEl) { liveWcEl.textContent = words.length; }
      if (liveFcEl) { liveFcEl.textContent = fillers; }
    }

    function _finishAssessment() {
      if (!isRecording) return;
      isRecording = false;
      if (timer) { clearInterval(timer); }
      SPEECH.stopListening();
      if (startBtn) { startBtn.disabled = true; startBtn.textContent = '✅ Completed'; }
      if (finishBtn) { finishBtn.style.display = 'none'; }
      const elapsedSecs = Math.max(5, 30 - seconds);
      const wpm = Math.round((words.length / elapsedSecs) * 60);
      const fillerRate = words.length ? fillers / words.length : 0;
      self._results.push({task: task.label, wpm, fillerRate, words: words.length, fillers});
      const fbEl = document.getElementById('assess-fb');
      if (fbEl) {
        fbEl.innerHTML = `<p class="verdict pass">✅ Task Recorded! ${words.length} words in ${elapsedSecs}s &bull; WPM ≈ ${wpm} &bull; Fillers: ${fillers}</p>`;
      }
      setTimeout(() => { self._task++; self.render(el); }, 1400);
    }

    if (startBtn) {
      startBtn.addEventListener('click', () => {
        if (!SPEECH.canListen()) {
          UI.toast('Microphone not available on this browser. Please type your response.', 'warning');
          const typedWrap = document.getElementById('assess-typed-wrap');
          if (typedWrap) typedWrap.style.display = 'block';
          return;
        }
        if (isRecording) return;
        isRecording = true;
        startBtn.style.display = 'none';
        if (finishBtn) { finishBtn.style.display = 'inline-block'; }
        if (liveCard) { liveCard.style.display = 'block'; }
        seconds = 30;
        timer = setInterval(() => {
          seconds--;
          if (timerEl) { timerEl.textContent = '00:' + String(Math.max(0, seconds)).padStart(2, '0'); }
          if (seconds <= 0) {
            _finishAssessment();
          }
        }, 1000);

          SPEECH.listen({
            interim: true,
            continuous: true,
            onresult: (t) => {
              if (!isRecording) return;
              _onTranscript(t);
            },
            onend: () => {
              if (isRecording) {
                if (seconds > 2 && words.length === 0) {
                  SPEECH.listen({
                    interim: true,
                    continuous: true,
                    onresult: _onTranscript,
                    onend: () => { if (isRecording && seconds <= 2) _finishAssessment(); },
                    onerror: () => {}
                  });
                } else {
                  _finishAssessment();
                }
              }
            },
            onerror: (msg, code) => {
              if (code === 'not-allowed') {
                if (timer) clearInterval(timer);
                isRecording = false;
                const typedWrap = document.getElementById('assess-typed-wrap');
                if (typedWrap) typedWrap.style.display = 'block';
                if (liveCard) liveCard.style.display = 'none';
                if (startBtn) startBtn.style.display = 'none';
                if (finishBtn) finishBtn.style.display = 'none';
                UI.toast('Microphone permission denied. Please type your response.', 'warning');
              } else if (code !== 'aborted') {
                UI.toast(msg, 'warning');
              }
            }
          });
        });
      }

      if (finishBtn) {
        finishBtn.addEventListener('click', () => {
          _finishAssessment();
        });
      }

    const typedSubmit = document.getElementById('assess-typed-submit');
    if (typedSubmit) {
      typedSubmit.addEventListener('click', () => {
        const text = (document.getElementById('assess-typed').value || '').trim();
        const words = U.tokenise(text);
        self._results.push({task: task.label, wpm: words.length * 2, fillerRate: 0, words: words.length, fillers: 0});
        self._task++;
        self.render(el);
      });
    }
  }
};

function _renderAssessResult(el, results) {
  let totalWpm = 0, totalFillers = 0, totalWords = 0;
  results.forEach(r => { totalWpm += r.wpm; totalFillers += r.fillers; totalWords += r.words; });
  const avgWpm = Math.round(totalWpm / results.length);
  const fillerRate = totalWords ? totalFillers / totalWords : 0;

  // CEFR calibration from data3.js
  const cefrTable = ASSESSMENT_POOLS.cefr;
  const band = (typeof bandOf === 'function') ? bandOf(avgWpm, fillerRate) : 'A2';

  const rows = results.map((r, i) =>
    `<tr><td>Task ${i+1}: ${r.task}</td><td>${r.wpm}</td><td>${r.fillers}</td><td>${(r.fillerRate * 100).toFixed(1)}%</td></tr>`
  ).join('');

  // 5-row benchmark table
  const bmRows = ['A2','B1','B2','C1','C2'].map(lvl => {
    const b = cefrTable[lvl];
    return `<tr${lvl===band?' class="current-band"':''}><td>${lvl}${lvl===band?' ← you':''}</td><td>${b.minWpm}–${b.maxWpm}</td><td>≤${(b.maxFillerRate*100).toFixed(0)}%</td></tr>`;
  }).join('');

  const report = {date: new Date().toISOString(), avgWpm, fillerRate, band, results};
  STORE.addAssessment(report);
  TRAINER.log({skill: 'fluency', delta: 3, source: 'assessment/complete'});
  STORE.addXP(30);

  // WhatsApp share (INV-2: opt-in network, degrades gracefully)
  const shareText = encodeURIComponent(`I just completed a Speaking Assessment on EngSpell! 🎤\nCEFR Level: ${band}\nAvg WPM: ${avgWpm}\nFiller Rate: ${(fillerRate*100).toFixed(1)}%\nPractise with me: https://engspell.ai`);
  const whatsappUrl = `https://wa.me/?text=${shareText}`;

  el.innerHTML = `
  <div class="view-assess-result">
    <h1>🏆 Assessment Complete!</h1>
    <div class="cefr-badge big">${band}</div>
    <p>Avg WPM: <strong>${avgWpm}</strong> · Filler Rate: <strong>${(fillerRate*100).toFixed(1)}%</strong></p>

    <table class="assess-table">
      <thead><tr><th>Task</th><th>WPM</th><th>Fillers</th><th>Filler %</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>

    <h3>CEFR Benchmarks</h3>
    <table class="assess-table">
      <thead><tr><th>Level</th><th>WPM range</th><th>Max filler %</th></tr></thead>
      <tbody>${bmRows}</tbody>
    </table>

    <div class="result-btns">
      <button onclick="VIEWS.assessment._task=0; VIEWS.assessment._results=[]; VIEWS.assessment.render(document.getElementById('view'))" class="btn-primary">Retake</button>
      <a href="${whatsappUrl}" target="_blank" rel="noopener" class="btn-whatsapp">📲 Share on WhatsApp</a>
      <a href="#/trainer" class="btn-link">View Trainer →</a>
    </div>
  </div>`;

  UI.toast(`Assessment done! Band: ${band} · +30 XP`, 'success');
}

function _renderAssessHistory(el) {
  const assessments = STORE.get('assessments') || [];
  if (!assessments.length) {
    el.innerHTML = `<div class="view-assessment"><h1>🏆 Assessment History</h1><p>No assessments yet. <a href="#/assessment">Take your first one →</a></p></div>`;
    return;
  }
  const rows = assessments.map((a, i) => {
    const date = a.date ? a.date.slice(0, 10) : '—';
    return `<tr><td>${date}</td><td>${a.band || '—'}</td><td>${a.avgWpm || '—'}</td><td>${a.fillerRate ? (a.fillerRate*100).toFixed(1)+'%' : '—'}</td></tr>`;
  }).reverse().join('');

  el.innerHTML = `
  <div class="view-assessment">
    <h1>🏆 Assessment History</h1>
    <a href="#/assessment" class="btn-primary">New Assessment</a>
    <table class="assess-table">
      <thead><tr><th>Date</th><th>Band</th><th>WPM</th><th>Fillers</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

/* ── LISTENING LAB ──────────────────────────────────────────────────── */
VIEWS.listening = {
  _idx: 0,
  _tab: 'comprehension',
  render(el) {
    const self = this;
    const allPassages = (typeof DATA_MERGE !== 'undefined') ? DATA_MERGE.allPassages() : ((typeof PASSAGES !== 'undefined' && Array.isArray(PASSAGES)) ? PASSAGES : []);
    const passage = allPassages[self._idx] || allPassages[0];

    const tabBar = `<div class="tab-bar">
      <button class="tab-btn${self._tab==='comprehension'?' active':''}" id="tab-comp">Comprehension</button>
      <button class="tab-btn${self._tab==='dictation'?' active':''}" id="tab-dict">Dictation</button>
    </div>`;

    const passBtns = allPassages.map((p, i) =>
      `<button class="tab-btn${i===self._idx?' active':''}" id="pass-${i}" data-passage-id="${p.id}">${p.level}: ${p.title}</button>`
    ).join('');

    let content = '';
    if (self._tab === 'comprehension') {
      const qHtml = passage.questions.map((q, qi) => {
        const opts = q.opts.map((o, oi) =>
          `<button class="opt-btn" data-qi="${qi}" data-oi="${oi}" data-ans="${oi === q.ans ? '1' : '0'}">${o}</button>`
        ).join('');
        return `<div class="comp-q"><p><strong>Q${qi+1}.</strong> ${q.q}</p><div class="opts-row comp-opts">${opts}</div><div id="comp-fb-${qi}"></div></div>`;
      }).join('');

      content = `
      <div class="listening-comp">
        <div class="listen-controls">
          <button class="btn-primary" data-say="${passage.text}">🔊 Listen (Normal)</button>
          <button class="btn-secondary" id="listen-slow">🐢 Listen Slow</button>
        </div>
        <div class="listen-text" id="listen-text" style="display:none">${passage.text}</div>
        <button class="btn-link" id="show-text">👁 Show/Hide Text</button>
        <div class="comp-questions">${qHtml}</div>
      </div>`;
    } else {
      content = `
      <div class="listening-dict">
        <p class="sub">Listen to the sentence, then type what you hear.</p>
        <div class="dict-sentence" id="dict-revealed-sentence" style="display:none;background:var(--bg1);padding:10px 14px;border-radius:10px;margin-bottom:12px;border:1px solid var(--border);font-style:italic;">${passage.dictation}</div>
        <div class="dict-controls" style="display:flex;gap:8px;margin-bottom:12px;align-items:center;flex-wrap:wrap;">
          <button class="btn-primary" data-say="${passage.dictation}">🔊 Normal</button>
          <button class="btn-secondary" id="dict-slow">🐢 Slow</button>
          <button class="btn-sm btn-ghost" id="dict-peek-btn">👁️ Peek Hint</button>
        </div>
        <input type="text" id="dict-input" placeholder="Type what you heard..." autocorrect="off" spellcheck="false" />
        <button class="btn-primary" id="dict-check">Check</button>
        <div id="dict-fb"></div>
      </div>`;
    }

    el.innerHTML = `
    <div class="view-listening">
      <h1>👂 Listening Lab</h1>
      <p class="sub">${allPassages.length} graded passages · Comprehension quizzes & dictation</p>
      <div class="passage-select">${passBtns}</div>
      ${tabBar}
      <div class="tab-content">${content}</div>
    </div>`;

    // Passage selection
    allPassages.forEach((p, i) => {
      const btn = document.getElementById(`pass-${i}`);
      if (btn) btn.addEventListener('click', () => { self._idx = i; self.render(el); });
    });

    document.getElementById('tab-comp').addEventListener('click', () => { self._tab = 'comprehension'; self.render(el); });
    document.getElementById('tab-dict').addEventListener('click', () => { self._tab = 'dictation'; self.render(el); });

    if (self._tab === 'comprehension') {
      document.getElementById('listen-slow').addEventListener('click', () => SPEECH.speakSlow(passage.text));
      document.getElementById('show-text').addEventListener('click', () => {
        const t = document.getElementById('listen-text');
        t.style.display = t.style.display === 'none' ? 'block' : 'none';
      });
      // Comprehension answers
      document.querySelectorAll('.comp-opts').forEach(row => {
        row.addEventListener('click', e => {
          const btn = e.target.closest('.opt-btn');
          if (!btn) return;
          const qi = parseInt(btn.dataset.qi, 10);
          const correct = btn.dataset.ans === '1';
          const q = passage.questions[qi];
          document.getElementById(`comp-fb-${qi}`).innerHTML = correct
            ? `<p class="verdict pass">✅ Correct!</p>`
            : `<p class="verdict fail">❌ Answer: ${q.opts[q.ans]}</p>`;
          row.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
          const key = `lsn_${passage.id}_q${qi}`;
          STORE.master(key, correct);
          srsSchedule(key, correct);
          TRAINER.log({skill: 'listening', delta: correct ? 2 : -1, source: 'listening/comp'});
          STORE.addXP(correct ? 5 : 1);
        });
      });
    } else {
      const peekBtn = document.getElementById('dict-peek-btn');
      if (peekBtn) {
        peekBtn.addEventListener('click', () => {
          const sentEl = document.getElementById('dict-revealed-sentence');
          if (sentEl) {
            sentEl.style.display = sentEl.style.display === 'none' ? 'block' : 'none';
          }
        });
      }
      document.getElementById('dict-slow').addEventListener('click', () => SPEECH.speakSlow(passage.dictation));
      document.getElementById('dict-check').addEventListener('click', () => {
        const sentEl = document.getElementById('dict-revealed-sentence');
        if (sentEl) { sentEl.style.display = 'block'; }
        const ans = document.getElementById('dict-input').value.trim();
        const aligned = U.align(passage.dictation, ans);
        const v = U.verdict(aligned);
        document.getElementById('dict-fb').innerHTML = UI.scoreHTML(aligned) + `<p class="verdict ${v}">${v === 'pass' ? '✅ Perfect!' : v === 'almost' ? '🟡 Almost!' : '❌ Try again'}</p>`;
        TRAINER.log({skill: 'listening', delta: v === 'pass' ? 2 : v === 'almost' ? 1 : -1, source: 'listening/dict'});
        STORE.addXP(v === 'pass' ? 8 : 2);
      });
    }
  }
};

/* ── GRAMMAR ATLAS ──────────────────────────────────────────────────── */
VIEWS.atlas = {
  _selected: null,
  _mode: 'browse',
  _detectiveQ: 0,
  render(el) {
    const self = this;
    const { _selected: selected, _mode: mode } = self;

    const modeBar = `<div class="tab-bar">
      <button class="tab-btn${mode==='browse'?' active':''}" id="atlas-browse">📖 Browse Tenses</button>
      <button class="tab-btn${mode==='detective'?' active':''}" id="atlas-detective">🕵️ Tense Detective</button>
    </div>`;

    let content = '';
    if (mode === 'browse') {
      if (!selected) {
        const grid = ATLAS.map(t =>
          `<div class="atlas-card" onclick="VIEWS.atlas._selected='${t.id}'; VIEWS.atlas.render(document.getElementById('view'))">
            <div class="atlas-name">${t.name}</div>
            <div class="atlas-formula">${t.formula}</div>
          </div>`
        ).join('');
        content = `<div class="atlas-grid">${grid}</div>`;
      } else {
        const tense = ATLAS.find(t => t.id === selected);
        if (!tense) { self._selected = null; self.render(el); return; }
        const examples = tense.examples.map(e =>
          `<li data-say="${e}">${e} <button class="btn-sm" data-say="${e}">🔊</button></li>`
        ).join('');
        const signals = tense.signals.map(s => `<span class="signal-tag">${s}</span>`).join('');
        content = `
        <div class="tense-detail">
          <button onclick="VIEWS.atlas._selected=null; VIEWS.atlas.render(document.getElementById('view'))" class="btn-back">← All Tenses</button>
          <h2>${tense.name}</h2>
          <div class="tense-formula">${tense.formula}</div>
          <div class="tense-when"><strong>Use when:</strong> ${tense.when}</div>
          <div class="tense-signals"><strong>Signal words:</strong> ${signals}</div>
          <div class="section-title">Examples</div>
          <ul class="tense-examples">${examples}</ul>
          <div class="warn-box">⚠️ ${tense.desiTrap}</div>
          <div class="detective-clue">🕵️ Detective clue: ${tense.detectiveClue}</div>
          <div class="section-title">🎤 Practice Speaking an Example</div>
          <div id="atlas-practice-slot"></div>
        </div>`;
      }
    } else {
      // Tense detective quiz
      const tense = ATLAS[self._detectiveQ % ATLAS.length];
      const clue = tense.detectiveClue;
      const opts = ATLAS.map(t => t.name);
      const shuffled = opts.slice().sort(() => Math.random() - 0.5).slice(0, 4);
      if (shuffled.indexOf(tense.name) === -1) { shuffled[0] = tense.name; }
      const optsHtml = shuffled.map(name =>
        `<button class="opt-btn" data-ans="${name === tense.name ? '1' : '0'}">${name}</button>`
      ).join('');

      content = `
      <div class="detective-quiz">
        <div class="detective-q">Q${self._detectiveQ + 1}</div>
        <div class="detective-clue-box">"${clue}"</div>
        <p>Which tense is this?</p>
        <div class="opts-row" id="det-opts">${optsHtml}</div>
        <div id="det-fb"></div>
      </div>`;
    }

    el.innerHTML = `<div class="view-atlas"><h1>📐 Grammar Atlas</h1><p class="sub">12 tenses — when, why, and how to use them.</p>${modeBar}<div class="tab-content">${content}</div></div>`;

    document.getElementById('atlas-browse').addEventListener('click', () => { self._mode = 'browse'; self.render(el); });
    document.getElementById('atlas-detective').addEventListener('click', () => { self._mode = 'detective'; self.render(el); });

    if (selected && mode === 'browse') {
      const tense = ATLAS.find(t => t.id === selected);
      const slot = document.getElementById('atlas-practice-slot');
      if (tense && slot && tense.examples && tense.examples.length) {
        UI.practiceBar(slot, {
          prompt: 'Say: "' + tense.examples[0] + '"',
          expected: tense.examples[0],
          skill: 'grammar'
        });
      }
    }

    if (mode === 'detective') {
      const detOpts = document.getElementById('det-opts');
      if (detOpts) {
        detOpts.addEventListener('click', e => {
          const btn = e.target.closest('.opt-btn');
          if (!btn) return;
          const correct = btn.dataset.ans === '1';
          const tense = ATLAS[self._detectiveQ % ATLAS.length];
          document.getElementById('det-fb').innerHTML = correct
            ? `<p class="verdict pass">✅ Correct! ${tense.name}</p>`
            : `<p class="verdict fail">❌ It was: ${tense.name}. ${tense.formula}</p>`;
          detOpts.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
          TRAINER.log({skill: 'grammar', delta: correct ? 2 : -1, source: 'atlas/detective'});
          STORE.addXP(correct ? 5 : 1);
          setTimeout(() => { self._detectiveQ++; self.render(el); }, 1400);
        });
      }
    }
  }
};
