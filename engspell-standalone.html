<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="EngSpell — Speak · Spell · Shine. The complete English mastery studio.">
<title>EngSpell — Speak · Spell · Shine</title>
<style>
/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   DESIGN SYSTEM — EngSpell (M8 Polish)
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

:root {
  /* M8 Design Tokens */
  --bg0: #070b16;
  --bg1: #0a0f1e;
  --bg2: #101830;
  --bg3: #16203c;
  --line: rgba(148,163,216,.14);
  --txt: #e8ecf8;
  --mut: #9aa6c9;
  --acc: #7c5cff;
  --acc2: #5eead4;
  --gold: #fbbf24;
  --ok: #34d399;
  --warn: #f59e0b;
  --bad: #f87171;
  --grad: linear-gradient(135deg, #7c5cff, #ec4899);
  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 20px;
  --sh1: 0 1px 2px rgba(0,0,0,.35);
  --sh2: 0 12px 32px rgba(3,7,20,.45);
  --sp: 4px;

  /* Backward Compatibility Aliases */
  --bg: var(--bg1);
  --border: var(--line);
  --accent: var(--acc);
  --accent2: #6d28d9;
  --accent3: #a78bfa;
  --green: var(--ok);
  --red: var(--bad);
  --text: var(--txt);
  --muted: var(--mut);
  --sidebar-w: 240px;
  --topbar-h: 56px;
  --mobbar-h: 62px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg0);
  color: var(--txt);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg0); }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; border: 1px solid var(--line); }

/* ── Layout ── */
#app { display: flex; flex-direction: column; height: 100vh; }

#topbar {
  height: var(--topbar-h);
  background: rgba(10,15,30,0.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  flex-shrink: 0;
}

.brand {
  font-size: 1.15rem;
  font-weight: 800;
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.02em;
}

.topbar-right {
  display: flex;
  gap: 12px;
  font-size: 0.85rem;
  font-weight: 600;
}

#xp-display { color: var(--gold); }
#streak-display { color: #f97316; }

#layout {
  display: flex;
  flex: 1;
  overflow: hidden;
  background: var(--bg0);
}

#sidebar {
  width: var(--sidebar-w);
  background: var(--bg1);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  flex-shrink: 0;
}

#nav {
  display: flex;
  flex-direction: column;
  padding: 16px 10px;
  gap: 16px;
}

.nav-section {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-section-label {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mut);
  padding: 4px 10px;
  opacity: 0.75;
}

.nav-section-body {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px;
  border-radius: var(--r-sm);
  text-decoration: none;
  color: var(--mut);
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s ease;
  position: relative;
  border: 1px solid transparent;
}

.nav-item:hover {
  background: var(--bg3);
  color: var(--txt);
}

.nav-item.active {
  background: rgba(124,92,255,0.18);
  color: #ffffff;
  border-color: rgba(124,92,255,0.38);
  font-weight: 600;
}

.nav-icon {
  font-size: 15px;
  width: 20px;
  text-align: center;
  flex-shrink: 0;
}

.nav-label {
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-badge {
  background: var(--bad);
  color: #ffffff;
  font-size: 11px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}

#view {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  max-width: 960px;
  margin: 0 auto;
  width: 100%;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 180ms ease, transform 180ms ease;
}

#view.view-entering {
  opacity: 0;
  transform: translateY(6px);
  transition: none;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  #view, #view.view-entering {
    opacity: 1 !important;
    transform: none !important;
    transition: none !important;
  }
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--bg3);
  border: 1px solid var(--line);
  color: var(--txt);
  padding: 10px 20px;
  border-radius: 24px;
  font-size: 0.9rem;
  font-weight: 500;
  z-index: 1000;
  transition: transform 0.3s ease;
  white-space: nowrap;
  box-shadow: var(--sh2);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--ok); color: var(--ok); }
.toast.error { border-color: var(--bad); color: var(--bad); }
.toast.info { border-color: var(--acc); color: var(--acc); }

/* ── Typography ── */
h1 { font-size: 28px; font-weight: 800; line-height: 1.25; margin-bottom: 8px; color: var(--txt); }
h2 { font-size: 20px; font-weight: 700; line-height: 1.35; margin-bottom: 8px; color: var(--txt); }
h3 { font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; color: var(--txt); }
.hero-title { font-size: 40px; font-weight: 900; line-height: 1.15; }
.sub { color: var(--mut); font-size: 14px; margin-bottom: 20px; }
.muted { color: var(--mut); }
.small { font-size: 12px; }
.section-title { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acc); margin: 24px 0 12px; }

/* ── Button System ── */
.btn, button, .btn-primary, .btn-secondary, .btn-ghost, .btn-danger, .btn-sm, .btn-mic, .btn-back, .btn-link, .btn-whatsapp, .btn-check {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  border-radius: var(--r-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  text-decoration: none;
  transition: all 0.15s ease;
  border: 1px solid transparent;
  padding: 9px 18px;
  outline: none;
  box-sizing: border-box;
}

.btn:focus-visible, button:focus-visible {
  outline: 2px solid var(--acc);
  outline-offset: 2px;
}

.btn-primary {
  background: var(--grad);
  color: #ffffff;
  border: none;
  box-shadow: 0 4px 14px rgba(124,92,255,0.35);
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(124,92,255,0.45);
}
.btn-primary:active {
  transform: translateY(0);
}

.btn-secondary {
  background: var(--bg3);
  color: var(--txt);
  border-color: var(--line);
}
.btn-secondary:hover {
  background: var(--bg2);
  border-color: rgba(148,163,216,0.3);
}

.btn-ghost {
  background: transparent;
  color: var(--txt);
  border: 1px solid var(--line);
}
.btn-ghost:hover {
  background: var(--bg3);
  border-color: var(--acc);
  color: #fff;
}

.btn-danger {
  background: rgba(248,113,113,0.14);
  color: var(--bad);
  border: 1px solid rgba(248,113,113,0.3);
}
.btn-danger:hover {
  background: rgba(248,113,113,0.22);
}

.btn-sm {
  padding: 4px 10px;
  font-size: 12px;
  border-radius: 8px;
  background: var(--bg3);
  color: var(--txt);
  border: 1px solid var(--line);
}
.btn-sm:hover {
  background: rgba(124,92,255,0.2);
  border-color: var(--acc);
}

.btn-mic {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: #fff;
  border: none;
  box-shadow: 0 4px 12px rgba(239,68,68,0.35);
}
.btn-mic:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(239,68,68,0.45);
}

.btn-link {
  background: transparent;
  color: var(--acc);
  border: none;
  padding: 6px 12px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.btn-link:hover {
  color: #a78bfa;
}

.btn-back {
  background: var(--bg3);
  color: var(--mut);
  border: 1px solid var(--line);
  padding: 6px 14px;
}
.btn-back:hover {
  color: var(--txt);
  border-color: var(--acc);
}

.btn-whatsapp {
  background: #25d366;
  color: #ffffff;
  border: none;
  box-shadow: 0 4px 12px rgba(37,211,102,0.3);
}
.btn-check {
  background: var(--ok);
  color: #ffffff;
  border: none;
}

/* ── Unified Cards ── */
.card {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  padding: 16px 20px;
  box-shadow: var(--sh1);
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.card:hover {
  transform: translateY(-1px);
  box-shadow: var(--sh2);
  border-color: rgba(124,92,255,0.35);
}
.card-icon { font-size: 2rem; margin-bottom: 12px; }
.card-body h3 { font-size: 1rem; }
.card-body p { color: var(--mut); font-size: 0.85rem; }
.card-arrow { font-size: 1.2rem; color: var(--acc); align-self: center; }
.card-next, .card-daily { display: flex; align-items: flex-start; gap: 16px; cursor: pointer; }

/* ── Tab bar ── */
.tab-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.tab-btn {
  background: var(--bg3);
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  border: 1px solid var(--border);
}
.tab-btn.active {
  background: linear-gradient(135deg, rgba(124,58,237,0.3), rgba(109,40,217,0.2));
  color: var(--accent3);
  border-color: rgba(124,58,237,0.4);
}
.tab-btn:hover { color: var(--text); }

/* ── Options (quiz, blanks) ── */
.opt-btn {
  background: var(--bg3);
  color: var(--text);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 0.9rem;
  border: 1px solid var(--border);
  text-align: left;
  transition: all 0.15s;
}
.opt-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(124,58,237,0.15); }
.opt-btn:disabled { opacity: 0.6; cursor: default; }
.opts-row { display: flex; flex-direction: column; gap: 8px; }

/* ── Score chips ── */
.score-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.chip { padding: 4px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: 500; }
.chip.ok { background: rgba(16,185,129,0.2); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
.chip.bad { background: rgba(239,68,68,0.2); color: var(--red); border: 1px solid rgba(239,68,68,0.3); cursor: pointer; }
.chip.bad:hover { background: rgba(239,68,68,0.3); }

/* ── Verdict ── */
.verdict { padding: 8px 16px; border-radius: 8px; font-weight: 600; margin-top: 8px; }
.verdict.pass { background: rgba(16,185,129,0.15); color: var(--green); }
.verdict.almost { background: rgba(245,158,11,0.15); color: var(--gold); }
.verdict.fail { background: rgba(239,68,68,0.15); color: var(--red); }

/* ── Mastery dots ── */
.mastery-dots { display: flex; gap: 3px; margin: 4px 0; }
.dot { font-size: 0.6rem; color: var(--bg3); }
.dot.filled { color: var(--gold); }
.mastery-dots.big .dot { font-size: 1rem; }

/* ── Inputs ── */
input[type="text"], input[type="search"], input[type="number"], input[type="password"],
textarea, select {
  background: var(--bg3);
  border: 1px solid var(--line);
  border-radius: var(--r-sm);
  color: var(--txt);
  font-family: inherit;
  font-size: 14px;
  padding: 10px 14px;
  width: 100%;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
input:focus, textarea:focus, select:focus {
  border-color: var(--acc);
  box-shadow: 0 0 0 2px rgba(124,92,255,0.3);
}
textarea { resize: vertical; min-height: 80px; }
input[type="range"] { width: 100%; accent-color: var(--acc); }

/* ── CEFR badge ── */
.cefr-badge {
  display: inline-block;
  background: var(--grad);
  color: #ffffff;
  font-size: 2rem;
  font-weight: 800;
  padding: 12px 28px;
  border-radius: var(--r-lg);
  margin: 16px 0;
  box-shadow: var(--sh2);
}
.cefr-badge.big { font-size: 3rem; padding: 16px 40px; }

/* ── Level badge ── */
.level-badge { padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
.level-badge.A1 { background: rgba(52,211,153,0.18); color: var(--ok); border: 1px solid rgba(52,211,153,0.3); }
.level-badge.A2 { background: rgba(52,211,153,0.24); color: var(--ok); border: 1px solid rgba(52,211,153,0.35); }
.level-badge.B1 { background: rgba(245,158,11,0.18); color: var(--warn); border: 1px solid rgba(245,158,11,0.3); }
.level-badge.B2 { background: rgba(245,158,11,0.24); color: var(--warn); border: 1px solid rgba(245,158,11,0.35); }
.level-badge.C1 { background: rgba(248,113,113,0.2); color: var(--bad); border: 1px solid rgba(248,113,113,0.35); }

/* ── Live Drill Chips (M9) ── */
.live-drill-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}
.live-chip {
  display: inline-flex;
  align-items: center;
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 1.05rem;
  font-weight: 600;
  transition: all 0.1s ease;
}
.live-chip.chip-matched {
  background: rgba(52, 211, 153, 0.18);
  color: var(--ok);
  border: 1px solid var(--ok);
}
.live-chip.chip-current {
  background: rgba(94, 234, 212, 0.22);
  color: var(--acc2);
  border: 2px solid var(--acc2);
  box-shadow: 0 0 12px rgba(94, 234, 212, 0.4);
  animation: pulse-ring 1.2s infinite ease-in-out;
}
.live-chip.chip-upcoming {
  background: rgba(154, 166, 201, 0.08);
  color: var(--mut);
  opacity: 0.55;
  border: 1px dashed rgba(154, 166, 201, 0.25);
}
@keyframes pulse-ring {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

/* ── Empty State Pattern ── */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  background: var(--bg2);
  border: 1px dashed var(--line);
  border-radius: var(--r-md);
  margin: 16px 0;
}
.empty-icon {
  font-size: 40px;
  line-height: 1;
  margin-bottom: 12px;
  display: inline-block;
}
.empty-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--txt);
  margin-bottom: 6px;
}
.empty-hint {
  font-size: 14px;
  color: var(--mut);
  max-width: 400px;
  margin-bottom: 16px;
  line-height: 1.5;
}

/* ── HOME ORIENTING SCREEN ── */
.view-home { display: flex; flex-direction: column; gap: 20px; }
.home-greeting-band {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  background: var(--bg2);
}
.home-greeting-band h1 { margin-bottom: 4px; font-size: 26px; }
.home-greeting-band .sub { margin-bottom: 0; }
.stat-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.stat-pill {
  background: var(--bg3);
  border: 1px solid var(--line);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
}
.xp-pill { color: var(--gold); border-color: rgba(251,191,36,0.3); }
.streak-pill { color: #f97316; border-color: rgba(249,115,22,0.3); }
.level-pill { color: var(--acc2); border-color: rgba(94,234,212,0.3); }
.due-pill { color: var(--acc); text-decoration: none; border-color: rgba(124,92,255,0.35); }
.due-pill:hover { background: rgba(124,92,255,0.15); }

.start-here-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}
.start-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  cursor: pointer;
  text-decoration: none;
  position: relative;
}
.start-card-icon { font-size: 28px; line-height: 1; }
.start-card-body h3 { font-size: 16px; margin-bottom: 4px; color: var(--txt); }
.start-card-body p { color: var(--mut); font-size: 13px; line-height: 1.4; margin: 0; }
.start-card-action {
  font-size: 13px;
  font-weight: 700;
  color: var(--acc);
  margin-top: auto;
  display: inline-flex;
  align-items: center;
}
.start-card:hover .start-card-action { color: var(--acc2); }

.home-analytics-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
.analytics-card { display: flex; flex-direction: column; gap: 12px; }
.week-chart { display: flex; align-items: flex-end; gap: 6px; height: 80px; padding: 8px 0; }
.bar-col { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.bar {
  background: var(--grad);
  border-radius: 4px 4px 0 0;
  min-height: 4px;
  width: 100%;
  transition: height 0.5s ease;
}
.bar-label { font-size: 11px; color: var(--mut); }
.progress-row { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; justify-content: space-around; }
.prog-item { display: flex; flex-direction: column; align-items: center; }
.prog-num { font-size: 28px; font-weight: 800; color: var(--acc); line-height: 1.1; }
.prog-label { font-size: 12px; color: var(--mut); margin-top: 2px; }
.home-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }

/* ── ONBOARDING ── */
.view-onboarding { max-width: 480px; margin: 40px auto; text-align: center; }
.ob-logo { font-size: 2rem; font-weight: 800; margin-bottom: 32px; background: linear-gradient(135deg, #a78bfa, #f59e0b); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.ob-progress { height: 4px; background: var(--bg3); border-radius: 2px; margin-bottom: 32px; overflow: hidden; }
.ob-prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); border-radius: 2px; transition: width 0.4s ease; }
.view-onboarding h2 { margin-bottom: 24px; }
.ob-opts { display: flex; flex-direction: column; gap: 10px; }
.ob-opt { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 14px 20px; border-radius: 12px; font-size: 0.95rem; text-align: left; transition: all 0.15s; }
.ob-opt:hover { border-color: var(--accent); background: rgba(124,58,237,0.15); transform: translateX(4px); }
.ob-hint { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }

/* ── DAILY ── */
.daily-stat-row { display: flex; gap: 10px; margin-bottom: 20px; }
.daily-quests { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
.quest-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 0.9rem; }

.scenario-card:hover { border-color: var(--accent); transform: translateY(-2px); }

.phrase-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

.rc-text { font-size: 1.8rem; font-weight: 800; margin-bottom: 12px; cursor: pointer; }

/* ── READING CORNER (MISSION 4) ── */
.view-read { display: flex; flex-direction: column; gap: 24px; max-width: 900px; margin: 0 auto; }
.read-home-header h1 { font-size: 1.8rem; margin-bottom: 6px; }
.read-home-header .sub { color: var(--muted); font-size: 0.95rem; }
.saved-words-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }

.saved-words-header h3 { font-size: 1.1rem; color: var(--gold); }

.sw-word { font-weight: 700; color: var(--text); }
.sw-ipa { font-size: 0.8rem; color: var(--accent3); font-family: monospace; }
.sw-play, .sw-remove { background: none; border: none; cursor: pointer; font-size: 0.85rem; padding: 2px; color: var(--muted); border-radius: 4px; transition: color 0.15s; }
.sw-play:hover { color: var(--accent3); }

.read-sections { display: flex; flex-direction: column; gap: 28px; }

/* ── XP pop ── */

@keyframes xpFloat {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-40px); }
}

/* ── Not found ── */
.not-found { text-align: center; padding: 60px 20px; color: var(--mut); }

/* ── Mobile 5-Slot Bottom Bar & Sheet (M8) ── */
#mobile-bar {
  display: none;
}
#nav-more-sheet {
  display: none;
}

@media (max-width: 880px) {
  #sidebar { display: none !important; }
  #view {
    padding: 16px 14px calc(var(--mobbar-h) + env(safe-area-inset-bottom, 16px) + 20px);
    max-width: 100%;
  }

  #mobile-bar {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(var(--mobbar-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    background: rgba(10,15,30,0.96);
    backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);

    align-items: center;

  }

    height: 28px;
    border-radius: 50%;

    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(124,92,255,0.4);
    color: #ffffff;
  }
  .mob-slot .nav-badge {
    position: absolute;
    top: 6px;
    right: calc(50% - 18px);
  }

  /* Bottom Sheet Overlay */
  #nav-more-sheet {
    display: block;
    position: fixed;
    inset: 0;
    z-index: 300;
    pointer-events: none;
    visibility: hidden;
    transition: visibility 0.2s;
  }
  #nav-more-sheet.open {

  }
  #nav-more-sheet.open .sheet-backdrop {

  }
  #nav-more-sheet .sheet-panel {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;

    background: var(--bg1);
    border-top: 1px solid var(--line);
    border-radius: 20px 20px 0 0;
    transform: translateY(100%);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom, 20px);
    box-shadow: 0 -8px 32px rgba(0,0,0,0.5);
  }
  #nav-more-sheet.open .sheet-panel {
    transform: translateY(0);
  }
  .sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  .sheet-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--txt);
  }
  .sheet-close {
    background: var(--bg3);
    border: 1px solid var(--line);
    color: var(--mut);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    padding: 0;
  }
  .sheet-close:hover {
    color: #fff;
    border-color: var(--acc);
  }
  .sheet-content {
    padding: 16px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .sheet-section {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sheet-sec-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--mut);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .sheet-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 8px;
  }
  .sheet-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    color: var(--txt);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s, border-color 0.15s;
  }
  .sheet-item:hover {
    background: var(--bg3);
    border-color: var(--acc);
  }

  .trainer-grid { grid-template-columns: 1fr; }
  .ds-layout { grid-template-columns: 1fr; }
  .resume-layout { grid-template-columns: 1fr; }
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

.resume-input-panel { display: flex; flex-direction: column; gap: 10px; background: var(--bg2); border-radius: 14px; padding: 20px; border: 1px solid var(--border); }

.resume-score-max { font-size: 1.2rem; opacity: 0.6; }
.resume-score-label { font-size: 1rem; font-weight: 600; margin: 4px 0; }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.nova-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.nova-header h1 { margin-bottom: 0; }
.nova-doc-banner { display: flex; align-items: center; gap: 10px; background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.3); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: 0.88rem; }
.doc-banner-icon { font-size: 1.1rem; }
.doc-banner-title { flex: 1; }
.doc-banner-clear { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--muted); cursor: pointer; padding: 3px 10px; font-size: 0.8rem; transition: all 0.15s; }
.doc-banner-clear:hover { color: var(--red); border-color: var(--red); }

.btn-ghost { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); cursor: pointer; transition: all 0.15s; }
.btn-ghost:hover { border-color: var(--accent3); color: var(--text); }
.btn-sm { padding: 5px 12px; font-size: 0.8rem; }
.q-num { background: var(--accent); color: white; border-radius: 6px; padding: 1px 8px; font-size: 0.8rem; font-weight: 700; margin-right: 6px; }
.typing-dots span { display: inline-block; animation: dot-bounce 1.2s infinite; font-size: 1.4rem; line-height: 1; }
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }
@keyframes dot-bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.4; } 40% { transform: translateY(-6px); opacity: 1; } }
.word-popup { animation: fadeInUp 0.2s ease; }
.word-popup .ipa { color: var(--accent3); font-family: monospace; font-size: 0.85rem; }
.word-popup .word-lvl { background: rgba(124,58,237,0.15); color: var(--accent3); border-radius: 4px; padding: 1px 6px; font-size: 0.75rem; font-weight: 700; }
.word-popup-actions { display: flex; gap: 8px; margin-top: 10px; }

.word-popup-close { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); padding: 5px 12px; cursor: pointer; font-size: 0.8rem; }
@keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   M6: TODAY'S FLOW — GLOBAL STRIP, CHIP & HOME STEPPER
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.flow-strip {
  background: var(--bg1);
  border-bottom: 1px solid var(--line);
  padding: 6px 20px;
  display: flex;
  align-items: center;

var TRAINER = (function () {
  'use strict';

  var SKILLS = ['pronunciation', 'grammar', 'vocab', 'spelling', 'fluency', 'listening', 'reading', 'writing'];
  /* INV-7: reading fires from docstudio (read_ mastery prefix, already in keysFor).

      ts: Date.now()

    events.push(ev);
    if (events.length > MAX_EVENTS) { events = events.slice(-MAX_EVENTS); }
    _saveEvents(events);

    if (typeof FLOW !== 'undefined' && FLOW.mark && ev.delta > 0) {
      var drillSources = [
        'spelling/correct', 'listening/comp', 'listening/dict',
        'atlas/detective', 'idioms/', 'doctor/clean', 'practiceBar',
        'daily/twister', 'daily/word', 'daily/idiom', 'daily/quote',
        'docstudio/train', 'resume/analyze', 'phrases/blank'
      ];
      var isDrill = false;
      for (var d = 0; d < drillSources.length; d++) {
        if (ev.source.indexOf(drillSources[d]) !== -1) { isDrill = true; break; }
      }
      if (isDrill) {
        var f = FLOW.get();
        if (!f.steps[0]) {

    var events = _loadEvents();
    var scores = {};
    for (var i = 0; i < SKILLS.length; i++) { scores[SKILLS[i]] = 50; }

      var ev = events[j];

      writing:   []

    "you're": 'you are', "you've": 'you have', "you'll": 'you will',
    "he's": 'he is', "she's": 'she is', "it's": 'it is',
    "we're": 'we are', "we've": 'we have', "we'll": 'we will',
    "they're": 'they are', "they've": 'they have', "they'll": 'they will',
    "that's": 'that is', "there's": 'there is', "here's": 'here is',

    var exp = tokenise(expected);

    for (var i = 0; i <= m; i++) {
      dp[i] = [];
      for (var j = 0; j <= n; j++) { dp[i][j] = 0; }
    }
    for (var a = 1; a <= m; a++) {
      for (var b = 1; b <= n; b++) {

    }

    var ia = m, ib = n;
    while (ia > 0 && ib > 0) {
      if (exp[ia-1] === hrd[ib-1]) {
        result.unshift({word: exp[ia-1], ok: true});
        ia--; ib--;
      } else if (dp[ia-1][ib] > dp[ia][ib-1]) {
        result.unshift({word: exp[ia-1], ok: false});
        ia--;
      } else {
        ib--;
      }

    while (ia > 0) {
      result.unshift({word: exp[ia-1], ok: false});
      ia--;

  }

function _renderFlowCard() {
  if (typeof FLOW === 'undefined' || !FLOW.get) { return ''; }
  var flow = FLOW.get();
  var cur = FLOW.current();
  var defs = FLOW.stepDefs;
  var doneCount = 0;
  for (var d = 0; d < flow.steps.length; d++) {
    if (flow.steps[d]) { doneCount++; }
  }
  var isAllDone = (doneCount === 5);

  var h = '<div class="flow-card">' +
    '<div class="flow-card-header">' +
      '<div class="flow-card-title">' +
        (isAllDone ? '🌟 <span>Today\'s Flow Complete!</span>' : '⚡ <span>Today\'s Flow</span>') +
      '</div>' +
      '<div class="flow-card-badge' + (isAllDone ? ' complete' : '') + '">' +
        (isAllDone ? '5/5 Done · Daily Star Earned 🔥' : doneCount + '/5 Complete · Next: ' + cur.label) +
      '</div>' +
    '</div>' +
    '<div class="flow-steps">';

  for (var i = 0; i < defs.length; i++) {
    var stepDef = defs[i];
    var isDone = !!flow.steps[i];
    var isUnlocked = FLOW.isStepUnlocked(i + 1);
    var isActive = (!isDone && isUnlocked);
    var isLocked = !isUnlocked;

    var stepCls = 'flow-step';
    if (isDone) { stepCls += ' done'; }
    else if (isActive) { stepCls += ' active'; }
    else if (isLocked) { stepCls += ' locked'; }

    var numText = isDone ? '✓' : (isLocked ? '🔒' : String(i + 1));
    var actionHtml = '';
    if (isDone) {
      actionHtml = '<button type="button" class="flow-step-btn" onclick="FLOW.openStep(' + (i + 1) + ')">Review ✓</button>';
    } else if (isActive) {
      actionHtml = '<button type="button" class="flow-step-btn" onclick="FLOW.openStep(' + (i + 1) + ')">Start →</button>';
    } else {
      actionHtml = '<button type="button" class="flow-step-btn" onclick="FLOW.openStep(' + (i + 1) + ')" title="' + stepDef.reason + '">Locked 🔒</button>';
    }

    h += '<div class="' + stepCls + '" data-step="' + (i + 1) + '">' +
      '<div class="flow-step-top">' +
        '<div class="flow-step-num">' + numText + '</div>' +
        '<div class="flow-step-status">' + (isDone ? '✅ Done' : (isActive ? '▶ Next' : '🔒 Locked')) + '</div>' +
      '</div>' +
      '<div class="flow-step-title">' + (i + 1) + '. ' + stepDef.label + '</div>' +
      '<div class="flow-step-desc">' + (isLocked ? stepDef.reason : stepDef.title) + '</div>' +
      actionHtml +
    '</div>';
  }

  h += '</div></div>';
  return h;
}

      '<div id="spell-result"></div>' +
      '</div>';

      var letters = word.split('');
      var ipa = '';
      for (var i = 0; i < letters.length; i++) {
        var found = null;
        for (var j = 0; j < WORDS.length; j++) {
          if (WORDS[j].w === letters[i].toLowerCase()) { found = WORDS[j].ipa; break; }
        }
        ipa += '<span class="chip ok">' + letters[i] + '</span> ';
      }
      document.getElementById('spell-result').innerHTML = '<div class="spell-chips">' + ipa + '</div>';
      SPEECH.speak(word.split('').join(', '));
    });
  }
};

function _masteryDots(m) {
  var s = '';
  for (var i = 0; i < 5; i++) {

  return s;
}

VIEWS.spelling = {
  _level: 1,
  _idx: 0,
  _round: [],
  render: function (el) {
    'use strict';
    var self = this;
    var lvlWords = SPELLING.filter(function (s) { return s.lvl === self._level; });
    if (!self._round.length) {
      self._round = lvlWords.slice();
      self._idx = 0;
    }
    var current = self._round[self._idx] || lvlWords[0];

    var levelBtns = '<div class="tab-bar">';
    for (var l = 1; l <= 3; l++) {
      levelBtns += '<button class="tab-btn' + (self._level === l ? ' active' : '') + '" id="spell-lvl-' + l + '">Level ' + l + '</button>';
    }
    levelBtns += '</div>';

    var mastery = STORE.getMastery('spell_' + current.w);

    el.innerHTML = '<div class="view-spelling">' +
      '<h1>🔤 Spelling Trainer</h1>' +
      levelBtns +
      '<div class="spell-game">' +
      '<p class="sub">Listen to the word and type what you hear.</p>' +
      '<div class="spell-progress">' + (self._idx + 1) + ' / ' + self._round.length + '</div>' +
      '<div class="mastery-dots big">' + _masteryDots(mastery) + '</div>' +
      '<button class="btn-primary" id="spell-play">🔊 Hear the Word</button>' +
      '<button class="btn-secondary" id="spell-slow">🐢 Hear Slowly</button>' +
      '<input type="text" id="spell-ans" placeholder="Type the word..." autocomplete="off" autocorrect="off" spellcheck="false" />' +
      '<button class="btn-primary" id="spell-submit">✅ Check</button>' +
      '<div id="spell-feedback"></div>' +
      '</div></div>';

    document.getElementById('spell-play').addEventListener('click', function () {
      SPEECH.speak(current.w);
    });
    document.getElementById('spell-slow').addEventListener('click', function () {
      SPEECH.speakSlow(current.w);
    });

    for (var lvl = 1; lvl <= 3; lvl++) {
      (function (lv) {
        document.getElementById('spell-lvl-' + lv).addEventListener('click', function () {
          self._level = lv;
          self._round = [];
          self.render(el);
        });
      }(lvl));
    }

    document.getElementById('spell-submit').addEventListener('click', function () {
      var ans = document.getElementById('spell-ans').value.trim().toLowerCase();
      var fb = document.getElementById('spell-feedback');
      if (ans === current.w) {
        fb.innerHTML = '<p class="verdict pass">✅ Correct! The word is: <strong>' + current.w + '</strong></p>';
        STORE.master('spell_' + current.w, true);
        TRAINER.log({skill: 'spelling', delta: 2, source: 'spelling/correct'});
        STORE.addXP(5);
        setTimeout(function () {
          self._idx = (self._idx + 1) % self._round.length;
          self.render(el);
        }, 1500);
      } else {
        fb.innerHTML = '<p class="verdict fail">❌ The correct spelling is: <strong>' + current.w + '</strong></p>';
        STORE.master('spell_' + current.w, false);
        TRAINER.log({skill: 'spelling', delta: -1, source: 'spelling/wrong'});
      }
    });

    document.getElementById('spell-ans').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { document.getElementById('spell-submit').click(); }
    });
  }
};

VIEWS.scenarios = {

function _renderScenario(el, sc) {
  var turnIdx = 0;
  var scores = [];

  function renderTurn() {
    var turn = sc.turns[turnIdx];
    var html = '<div class="scenario-play">' +
      '<div class="sc-header"><button onclick="navigate(\'scenarios\')" class="btn-back">← Back</button><h2>' + sc.title + '</h2></div>' +
      '<div class="sc-turn">' + (turnIdx + 1) + ' / ' + sc.turns.length + '</div>';

    if (turn.speaker === 'i') {
      html += '<div class="bubble interviewer">' +
        '<div class="bubble-label">Interviewer</div>' +
        '<div class="bubble-text" data-say="' + turn.text + '">' + turn.text + ' <button class="btn-sm" data-say="' + turn.text + '">🔊</button></div>' +
        '</div>' +
        '<button class="btn-primary" id="sc-next">Continue →</button>';
    } else {
      html += '<div class="bubble prompt">' +
        '<div class="bubble-label">Your turn</div>' +
        '<div class="bubble-text">' + turn.prompt + '</div>' +
        '</div>';

      if (SPEECH.canListen()) {
        html += '<button class="btn-mic" id="sc-mic">🎤 Speak</button>';
      }
      html += '<textarea id="sc-input" rows="2" placeholder="Type your response..."></textarea>' +
        '<button class="btn-primary" id="sc-submit">Submit</button>' +
        '<div id="sc-fb"></div>';
    }
    html += '</div>';
    el.innerHTML = html;

    var nextBtn = document.getElementById('sc-next');
    if (nextBtn) {
      nextBtn.addEventListener('click', function () {
        turnIdx++;
        if (turnIdx >= sc.turns.length) { _showScResult(el, sc, scores); return; }
        renderTurn();
      });
    }

    var micBtn = document.getElementById('sc-mic');
    if (micBtn) {
      micBtn.addEventListener('click', function () {
        micBtn.textContent = '🔴 Listening…';
        micBtn.disabled = true;
        SPEECH.listen({
          onresult: function (t) {
            document.getElementById('sc-input').value = t;
            micBtn.textContent = '🎤 Speak';
            micBtn.disabled = false;
          },
          onend: function () { micBtn.textContent = '🎤 Speak'; micBtn.disabled = false; },
          onerror: function (m) { UI.toast(m, 'error'); micBtn.textContent = '🎤 Speak'; micBtn.disabled = false; }
        });
      });
    }

    var submitBtn = document.getElementById('sc-submit');
    if (submitBtn) {
      submitBtn.addEventListener('click', function () {
        var resp = document.getElementById('sc-input').value.trim();
        if (!resp) { UI.toast('Please say or type a response.', 'error'); return; }
        var fb = document.getElementById('sc-fb');
        var words = U.tokenise(resp).length;
        scores.push(words);
        fb.innerHTML = '<p class="verdict pass">✅ Good! ' + words + ' words. Moving on...</p>';
        TRAINER.log({skill: 'fluency', delta: 2, source: 'scenarios/turn'});
        STORE.addXP(5);
        setTimeout(function () {
          turnIdx++;
          if (turnIdx >= sc.turns.length) { _showScResult(el, sc, scores); return; }
          renderTurn();
        }, 1200);
      });
    }
  }

  renderTurn();
}

function _showScResult(el, sc, scores) {
  var total = 0;
  for (var i = 0; i < scores.length; i++) { total += scores[i]; }
  el.innerHTML = '<div class="scenario-result">' +
    '<h2>🎉 Role-Play Complete!</h2>' +
    '<p><strong>' + sc.title + '</strong></p>' +

    function _handleInterrupt(match) {
      interruptCount++;
      isListening = false;
      SPEECH.stopListening();
      if (micBtn) { micBtn.textContent = '🎙️ Resume Speaking'; }

      var info = LIVE_COACH.buildInterruptMessage(target, match);

          hwBtn.addEventListener('click', function () {

          });

    function _startListen() {
      if (!SPEECH.canListen()) {
        UI.toast('Speech recognition not available. Please use the typed fallback.', 'warning');
        return;
      }
      var pausedBanner = document.getElementById('live-paused-banner');
      if (pausedBanner) { pausedBanner.style.display = 'none'; }
      isListening = true;
      if (micBtn) { micBtn.textContent = '⏹️ Stop'; }

      SPEECH.listen({
        interim: true,
        continuous: true,
        onresult: function (transcript, isFinal, alts) {
          if (completed) { return; }
          restartTracker.onSuccess();
          lastPartialTs = Date.now();

          var match = LIVE_COACH.matchPrefix(target, transcript);

          if (self._drillRaf) { cancelAnimationFrame(self._drillRaf); }
          self._drillRaf = requestAnimationFrame(function () {
            var chipsEl = document.getElementById('live-chips-area');
            if (chipsEl) {
              chipsEl.innerHTML = LIVE_COACH.renderChipHTML(target, match);
            }
          });

          if (match.isComplete) {
            _finishDrill(true);
            return;
          }

          var silence = Date.now() - lastPartialTs;
          if (LIVE_COACH.shouldInterrupt({
            interruptCount: interruptCount,
            silenceMs: Math.max(silence, 500),
            match: match
          })) {
            _handleInterrupt(match);
          }
        },
        onend: function () {
          if (completed) { return; }
          var res = restartTracker.onEnd(false);
          if (res.shouldRestart) {
            setTimeout(function () {
              if (!completed && isListening) { _startListen(); }
            }, res.delay);
          } else if (res.paused) {
            isListening = false;
            if (micBtn) { micBtn.textContent = '🎙️ Start Speaking'; }
            var pb = document.getElementById('live-paused-banner');
            if (pb) { pb.style.display = 'block'; }
          }
        },
        onerror: function (msg, code) {
          if (completed) { return; }
          if (code === 'not-allowed' || code === 'not-supported') {
            isListening = false;
            if (micBtn) { micBtn.textContent = '🎙️ Start Speaking'; }
            UI.toast(msg, 'warning');
          }
        }
      });
    }

    if (micBtn) {
      micBtn.addEventListener('click', function () {
        if (isListening) {
          isListening = false;
          SPEECH.stopListening();
          micBtn.textContent = '🎙️ Start Speaking';

      docModeBtn.addEventListener('click', function () {
        self._mode = 'document'; self.render(el);
      });

    var clearDocBtn = document.getElementById('nova-clear-doc');
    if (clearDocBtn) {
      clearDocBtn.addEventListener('click', function () {
        var docs2 = STORE.get('docs') || [];
        for (var di2 = 0; di2 < docs2.length; di2++) { docs2[di2].active = false; }

      });

    document.getElementById('nova-clear-history').addEventListener('click', function () {

    var micBtn = document.getElementById('nova-mic');
    if (micBtn) {

          onresult: function (t) {

            micBtn.textContent = '🎤';

          },
          onend: function () { micBtn.textContent = '🎤'; micBtn.disabled = false; },
          onerror: function (m) { UI.toast(m, 'error'); micBtn.textContent = '🎤'; micBtn.disabled = false; }
        });

    if (chatWin) {
      chatWin.addEventListener('dblclick', function (e) {
        var sel = window.getSelection ? window.getSelection().toString().trim() : '';
        if (!sel || sel.indexOf(' ') !== -1) { return; } /* single word only */
        var word = sel.toLowerCase().replace(/[^a-z]/g, '');
        if (!word) { return; }
        /* Look up in WORDS data */
        var found = null;
        if (typeof WORDS !== 'undefined') {
          for (var wi = 0; wi < WORDS.length; wi++) {
            if (WORDS[wi].w && WORDS[wi].w.toLowerCase() === word) { found = WORDS[wi]; break; }

      var h = self._getHistory();
      h.push({role: 'user', text: _esc(text)});
      self._saveHistory();

      /* Part B: Free Talk Live */
      var settings = STORE.get('settings') || {};
      if (settings.liveCorrect) {
        var fixes = [];
        var words = (typeof U !== 'undefined' && U.tokenise) ? U.tokenise(text).length : text.split(/\s+/).filter(Boolean).length;
        for (var ri = 0; ri < COACH_RULES.length; ri++) {
          if (COACH_RULES[ri].pat.test(text)) {

          }
        }
        var honest = (typeof isHonest === 'function') ? isHonest() : false;
        var liveChipText = '';
        if (honest) {
          var score = Math.max(1, Math.min(10, 10 - (fixes.length * 2) - (words < 4 ? 2 : 0)));
          var color = score < 6 ? '#ef4444' : (score <= 8 ? '#f59e0b' : '#10b981');
          liveChipText = '<span class="live-verdict-chip" style="display:inline-block;margin-top:6px;font-size:0.75rem;padding:2px 8px;border-radius:10px;background:' + color + '22;color:' + color + ';border:1px solid ' + color + ';">⚡ Live Score: ' + score + '/10' + (fixes.length > 0 ? ' · ' + _esc(fixes[0]) : '') + '</span>';
        } else if (fixes.length > 0) {
          liveChipText = '<span class="live-verdict-chip" style="display:inline-block;margin-top:6px;font-size:0.75rem;padding:2px 8px;border-radius:10px;background:rgba(245,158,11,0.15);color:var(--warn);border:1px solid rgba(245,158,11,0.3);">⚡ Live Correction: ' + _esc(fixes[0]) + '</span>';
        }

        if (settings.bargeIn) {
          var hiFix = LIVE_COACH.detectHighSeverityFix(text);
          if (hiFix) {
            if (LIVE_COACH.bargeInThrottle.canExecute(Date.now(), self._inFlightReply)) {
              SPEECH.speak(hiFix.spoken);
              LIVE_COACH.bargeInThrottle.record(Date.now());
            } else {
              liveChipText += '<span class="live-barge-chip" style="display:inline-block;margin-top:4px;margin-left:6px;font-size:0.72rem;padding:1px 6px;border-radius:8px;background:rgba(124,92,255,0.15);color:var(--acc2);">🎙️ ' + _esc(hiFix.spoken) + '</span>';
            }
          }
        }

        if (liveChipText && chatWin) {
          var userBubbles = chatWin.querySelectorAll('.bubble.user');
          if (userBubbles.length > 0) {
            var lastBubble = userBubbles[userBubbles.length - 1];
            var chipDiv = document.createElement('div');
            chipDiv.innerHTML = liveChipText;
            lastBubble.appendChild(chipDiv);
          }
        }
      }

      _novaRespond(text, self, el);
    }

    document.getElementById('nova-send').addEventListener('click', _send);
    document.getElementById('nova-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { _send(); }
    });
  }
};

function _esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function _novaRespond(userText, self, el) {
  var settings = STORE.get('settings') || {};
  var key = settings.geminiKey || '';

  if (key && key.trim().length > 10) {

  } else {
    var reply = _novaRules(userText);
    var h = self._getHistory();
    h.push({role: 'nova', text: _esc(reply)});
    self._saveHistory();
    STORE.get('coachStats').messages = (STORE.get('coachStats').messages || 0) + 1;
    STORE.save();
    TRAINER.log({skill: 'fluency', delta: 1, source: 'coach/chat'});

      FLOW.recordNovaTurn();

function _novaRules(text) {
  var t = text.toLowerCase();
  var honest = (typeof isHonest === 'function') ? isHonest() : false;

  if (honest) {
    var fixes = [];
    var words = (typeof U !== 'undefined' && U.tokenise) ? U.tokenise(text).length : text.split(/\s+/).filter(Boolean).length;

    /* Collect ALL grammar rule checks */
    for (var ri = 0; ri < COACH_RULES.length; ri++) {
      if (COACH_RULES[ri].pat.test(text)) {
        fixes.push('Grammar: ' + COACH_RULES[ri].fix);
      }
    }

    /* Collect ALL vocabulary upgrades */
    for (var ui = 0; ui < COACH_UPGRADES.length; ui++) {
      var up = COACH_UPGRADES[ui];
      if (t.indexOf(up.basic.toLowerCase()) !== -1) {
        fixes.push('Upgrade "' + up.basic + '" → "' + up.better + '" (or "' + up.adv + '")');
      }
    }

    var score = Math.max(1, Math.min(10, 10 - (fixes.length * 2) - (words < 4 ? 2 : 0)));
    var color = score < 6 ? '#ef4444' : (score <= 8 ? '#f59e0b' : '#10b981');
    var chipHtml = '<span class="honest-score-chip" style="background:' + color + '22;color:' + color + ';border:1px solid ' + color + ';border-radius:12px;padding:2px 8px;font-weight:700;font-size:0.82rem;">' + score + '/10</span>';

    var out = chipHtml + ' <strong>Score: ' + score + '/10</strong>\n';
    if (fixes.length > 0) {
      out += 'Mistakes to fix:\n';
      for (var fi = 0; fi < fixes.length; fi++) {
        out += '▸ ' + fixes[fi] + '\n';
      }
      out += 'Exact corrected sentence required. Under 90 words.';
    } else {
      if (words < 4) {
        out += '▸ Too brief. Express a complete sentence (at least 4 words) to score higher.';
      } else {
        out += 'Zero glaring errors detected. Well structured.';
      }
    }
    return out;
  }

  /* Grammar rule checks */
  for (var ri = 0; ri < COACH_RULES.length; ri++) {
    if (COACH_RULES[ri].pat.test(text)) {
      return '⚠️ Grammar note: ' + COACH_RULES[ri].fix;
    }
  }

  /* Vocabulary upgrade */
  for (var ui = 0; ui < COACH_UPGRADES.length; ui++) {
    var up = COACH_UPGRADES[ui];
    if (t.indexOf(up.basic.toLowerCase()) !== -1) {
      return '💡 Upgrade: Instead of "' + up.basic + '" try "' + up.better + '" (B1) or "' + up.adv + '" (C1).';
    }
  }

  /* Intent matching */
  for (var ii = 0; ii < COACH_INTENTS.length; ii++) {
    var intent = COACH_INTENTS[ii];
    var keys = intent.k.split('|');
    for (var ki = 0; ki < keys.length; ki++) {
      if (t.indexOf(keys[ki].trim()) !== -1) {
        return intent.r;
      }
    }
  }

  return 'Good effort! Keep practising. For real AI feedback on grammar, pronunciation, and more — add your free Gemini key in Settings. Double-click any word in my replies to look it up instantly.';
}

function _novaBuildSystemPrompt(self) {
  'use strict';
  var user = STORE.get('user') || {};
  var settings = STORE.get('settings') || {};
  var radar = (typeof TRAINER !== 'undefined' && TRAINER.radar) ? TRAINER.radar() : [];

  /* Find weakest skill */
  var weakSkill = 'fluency';
  var weakScore = 100;
  for (var ri = 0; ri < radar.length; ri++) {
    if (radar[ri].val < weakScore) { weakScore = radar[ri].val; weakSkill = radar[ri].skill; }
  }

  var name = user.name ? user.name : 'the learner';
  var level = user.level || 'A2';
  var mode = self ? self._mode || 'chat' : 'chat';

  var base = 'You are Nova, an expert English speaking coach specialising in helping Indian learners.' +
    ' The student\'s name is ' + name + ' and their current CEFR level is ' + level + '.' +
    ' Their weakest skill right now is ' + weakSkill + ' — prioritise that in your coaching.' +
    ' Mode: ' + mode + '.' +
    ' Rules: correct grammar gently by quoting the error then giving the fix; suggest vocabulary upgrades when appropriate;' +
    ' be warm, direct, and concise (2–4 sentences unless asked for more).' +
    ' Never say you are an AI. You are Nova.';

  /* Document context */
  if (mode === 'document' && self && self._activeDoc) {
    var excerpt = self._activeDoc.text ? self._activeDoc.text.slice(0, 1200) : '';
    base += ' The student is currently reading a document titled "' + self._activeDoc.title + '".' +
      ' Here is an excerpt for context:\n---\n' + excerpt + '\n---' +
      ' When the student asks about a word or phrase, quote the surrounding sentence from the excerpt before explaining.' +
      ' When asked to summarise, produce a 3-bullet summary of the excerpt.';
  }

  /* M7 Brutal Honesty Mode */
  if (typeof isHonest === 'function' ? isHonest() : (settings.honestMode)) {
    base += ' BRUTAL HONESTY mode: start each reply with strict score \'N/10\'; list EVERY mistake one per line with ▸; never praise below 8/10; give the exact corrected sentence; under 90 words.';
  }

  return base;
}

function _novaGemini(userText, self, el, key) {
  var settings = STORE.get('settings') || {};
  var provider = settings.llmProvider || 'gemini';
  var hist = self._getHistory().slice(-12); /* last 12 turns for context */
  var messages = [];
  for (var i = 0; i < hist.length - 1; i++) { /* exclude the just-pushed user message */
    messages.push({
      role: hist[i].role === 'user' ? 'user' : 'model',
      content: hist[i].text
    });
  }
  messages.push({ role: 'user', content: userText });

  var systemPrompt = _novaBuildSystemPrompt(self);

  /* Show typing indicator */
  var h = self._getHistory();
  h.push({role: 'nova', text: '<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>'});
  self.render(el);
  /* Remove the typing indicator entry (it will be replaced by real reply) */
  h.pop();

  self._inFlightReply = true;

  llmAsk({
    provider: provider,
    key: key,
    systemPrompt: systemPrompt,
    messages: messages
  }).then(function (reply) {
    self._inFlightReply = false;
    h.push({role: 'nova', text: _esc(reply)});
    self._saveHistory();
    TRAINER.log({skill: 'fluency', delta: 1, source: 'coach/' + provider});
    if (typeof FLOW !== 'undefined' && FLOW.recordNovaTurn) {
      FLOW.recordNovaTurn();
    }
    STORE.save();
    SPEECH.speak(reply);
    self.render(el);
  }).catch(function (err) {
    self._inFlightReply = false;
    if (typeof UI !== 'undefined' && UI.toast) {
      UI.toast('⚠️ ' + provider + ' unavailable. Switching to offline engine.', 'warning');
    }
    if (typeof NOVA !== 'undefined' && typeof NOVA.fail === 'function') {
      NOVA.fail(err);
    } else if (typeof VIEWS.coach.fail === 'function') {
      VIEWS.coach.fail(err);
    }
    var reply = _novaRules(userText) + ' (offline — no connection)';
    h.push({role: 'nova', text: _esc(reply)});
    self._saveHistory();
    self.render(el);
  });
}

VIEWS.quiz = {
  _questions: [],
  _idx: 0,
  _answers: [],
  render: function (el, arg) {
    'use strict';
    var self = this;

    if (arg === 'result') {
      _renderQuizResult(el, self._answers, self._questions);
      return;
    }

    if (self._idx === 0 || arg === 'start') {
      // Shuffle and pick 15
      var pool = QUIZ_BANK.slice();
      for (var i = pool.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
      self._questions = pool.slice(0, 15);
      self._idx = 0;
      self._answers = [];
    }

    if (self._idx >= self._questions.length) {
      _renderQuizResult(el, self._answers, self._questions);
      return;
    }

    var q = self._questions[self._idx];
    var optsHtml = '';
    for (var oi = 0; oi < q.opts.length; oi++) {
      optsHtml += '<button class="opt-btn" id="quiz-opt-' + oi + '">' + q.opts[oi] + '</button>';
    }

    el.innerHTML = '<div class="view-quiz">' +
      '<h1>🎓 Level Test</h1>' +
      '<div class="quiz-progress">Question ' + (self._idx + 1) + ' / ' + self._questions.length + '</div>' +
      '<div class="quiz-skill">Skill: ' + q.skill + '</div>' +
      '<div class="quiz-q"><p>' + q.q + '</p></div>' +
      '<div class="quiz-opts">' + optsHtml + '</div>' +
      '<div id="quiz-fb"></div>' +
      '</div>';

    for (var oi2 = 0; oi2 < q.opts.length; oi2++) {
      (function (idx) {
        var btn = document.getElementById('quiz-opt-' + idx);
        if (!btn) { return; }
        btn.addEventListener('click', function () {
          var fb = document.getElementById('quiz-fb');
          var correct = idx === q.ans;
          self._answers.push({q: q, chosen: idx, correct: correct});
          if (correct) {
            fb.innerHTML = '<p class="verdict pass">✅ Correct!</p>';
            TRAINER.log({skill: q.skill, delta: 2, source: 'quiz/correct'});
            STORE.addXP(5);
          } else {
            fb.innerHTML = '<p class="verdict fail">❌ Correct answer: ' + q.opts[q.ans] + '</p>';
            TRAINER.log({skill: q.skill, delta: -1, source: 'quiz/wrong'});
          }
          // Disable all opts
          for (var k = 0; k < q.opts.length; k++) {
            var b = document.getElementById('quiz-opt-' + k);
            if (b) { b.disabled = true; }
          }
          setTimeout(function () {
            self._idx++;
            self.render(el);
          }, 1200);
        });
      }(oi2));
    }
  }
};

function _renderQuizResult(el, answers, questions) {
  var correct = 0;
  var skillScores = {};
  for (var i = 0; i < answers.length; i++) {
    if (answers[i].correct) { correct++; }
    var sk = answers[i].q.skill;
    skillScores[sk] = skillScores[sk] || {ok: 0, total: 0};
    skillScores[sk].total++;
    if (answers[i].correct) { skillScores[sk].ok++; }
  }
  var pct = Math.round((correct / questions.length) * 100);
  var cefr = pct >= 90 ? 'C1' : pct >= 75 ? 'B2' : pct >= 55 ? 'B1' : pct >= 35 ? 'A2' : 'A1';

  var skillRows = '';
  for (var sk in skillScores) {
    if (skillScores.hasOwnProperty(sk)) {
      var s = skillScores[sk];
      var bar = Math.round((s.ok / s.total) * 100);
      skillRows += '<div class="skill-row"><span class="skill-name">' + sk + '</span><div class="skill-bar"><div class="skill-fill" style="width:' + bar + '%"></div></div><span class="skill-pct">' + bar + '%</span></div>';
    }
  }

  el.innerHTML = '<div class="view-quiz-result">' +
    '<h1>🎓 Level Test Results</h1>' +
    '<div class="cefr-badge">' + cefr + '</div>' +
    '<p><strong>' + correct + ' / ' + questions.length + '</strong> correct (' + pct + '%)</p>' +
    '<div class="skill-breakdown">' + skillRows + '</div>' +
    '<div class="result-btns">' +
    '<button onclick="VIEWS.quiz._idx=0; VIEWS.quiz.render(document.getElementById(\'view\'), \'start\')" class="btn-primary">Retake Test</button>' +
    '<a href="#/trainer" class="btn-link">View My Trainer →</a>' +
    '</div></div>';

  var user = STORE.get('user') || {};
  user.level = cefr;
  STORE.set('user', user);
  STORE.addXP(20);
  UI.toast('Level Test complete! You are ' + cefr + '. +20 XP', 'success');
  if (typeof FLOW !== 'undefined' && FLOW.mark) {
    FLOW.mark(1);
  }
}

      var bargeIn = document.getElementById('s-barge-in') ? document.getElementById('s-barge-in').checked : false;
      var llmProvider = document.getElementById('s-provider') ? document.getElementById('s-provider').value : 'gemini';
      var curSettings = STORE.get('settings') || {};
      curSettings.voice = voice;
      curSettings.rate = rate;
      curSettings.dailyGoal = goal;
      curSettings.geminiKey = geminiKey;
      curSettings.honestMode = honestMode;
      curSettings.liveCorrect = liveCorrect;
      curSettings.bargeIn = bargeIn;
      curSettings.llmProvider = llmProvider;
      STORE.set('settings', curSettings);
      SPEECH.setRate(rate);
      if (voice) { SPEECH.setVoiceByName(voice); }
      UI.toast('Settings saved!', 'success');
    });

    document.getElementById('s-reset').addEventListener('click', function () {
      if (confirm('This will erase ALL your progress. Are you sure?')) {

        navigate('onboarding');
      }

    document.getElementById('s-export').addEventListener('click', function () {
      var blob = new Blob([STORE.exportJSON()], {type: 'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'engspell-backup.json';
      a.click();
      URL.revokeObjectURL(url);
    });
  }
};

    // SRS due count for quest
    const srs = STORE.get('srs') || {};
    const now = Date.now();
    let dueCount = 0;
    for (const k in srs) {
      if (srs.hasOwnProperty(k) && srs[k].due && srs[k].due <= now) dueCount++;
    }

    const quests = [
      { id: 'twister',  label: '🌀 Say the Twister',        done: done.indexOf('twister') !== -1 },
      { id: 'word',     label: '⚡ Learn the Power Word',    done: done.indexOf('word') !== -1 },
      { id: 'idiom',    label: '📜 Quiz the Idiom',          done: done.indexOf('idiom') !== -1 },
      { id: 'quote',    label: '💬 Shadow the Quote',        done: done.indexOf('quote') !== -1 },
      { id: 'review',   label: `🔁 Review (${dueCount})`,    done: dueCount === 0 || done.indexOf('review') !== -1 }
    ];

    const questHtml = quests.map(q =>
      `<div class="quest-item${q.done ? ' done' : ''}">
         <span class="quest-check">${q.done ? '✅' : '⬜'}</span>

         ${q.id === 'review' && !q.done ? `<a href="#/review" class="btn-sm">Go →</a>` : ''}

    ).join('');

    el.innerHTML = `
    <div class="view-daily">
      <h1>☀️ Today's Dose</h1>
      <div class="daily-stat-row">
        <div class="stat-pill">🔥 ${streak} day streak</div>
        <div class="stat-pill">⚡ ${U.fmtXP(xp)} XP</div>
      </div>

      <div class="daily-quests">
        <h3>Today's Quests</h3>
        ${questHtml}
      </div>

      <!-- TWISTER -->
      <div class="daily-card">
        <div class="dc-header">🌀 Tongue Twister</div>
        <p class="twister-text">${twister}</p>
        <div class="dc-btns">
          <button class="btn-sm" data-say="${twister}">🔊 Hear it</button>
          <button class="btn-primary" id="daily-twister-btn">🎤 Say it</button>
        </div>
        <div id="twister-fb"></div>
      </div>

      <!-- POWER WORD -->
      <div class="daily-card">
        <div class="dc-header">⚡ Power Word</div>
        <div class="pw-word" data-say="${word.w}">${word.w}</div>
        <div class="pw-ipa">${word.ipa}</div>
        <div class="pw-meaning">${word.meaning}</div>
        <div class="pw-eg"><em>"${word.eg}"</em></div>
        <button class="btn-sm" data-say="${word.w}">🔊 Listen</button>
        <button class="btn-secondary" id="daily-word-done">✅ Got it!</button>
      </div>

      <!-- IDIOM QUIZ -->
      <div class="daily-card" id="idiom-card">
        <div class="dc-header">📜 Idiom of the Day</div>
        <div class="idiom-text">"${idiom.text}"</div>
        <div class="idiom-opts" id="idiom-opts">
          ${_makeIdiomOpts(idiom)}
        </div>
        <div id="idiom-fb"></div>
      </div>

      <!-- QUOTE SHADOW -->
      <div class="daily-card">
        <div class="dc-header">💬 Quote Shadow</div>
        <blockquote class="quote-text">"${quote.text}"</blockquote>
        <p class="quote-by">— ${quote.by}</p>
        <div class="dc-btns">
          <button class="btn-sm" data-say="${quote.text}">🔊 Hear it</button>
          <button class="btn-primary" id="daily-quote-btn">🎤 Shadow it</button>
        </div>
        <div id="quote-fb"></div>
      </div>
    </div>`;

    // Twister
    document.getElementById('daily-twister-btn').addEventListener('click', () => {
      if (!SPEECH.canListen()) {
        UI.toast('Mic not available — listen and repeat in your head!', 'info');
        _markDone('twister', done, today);
        STORE.addXP(5);
        return;
      }
      const btn = document.getElementById('daily-twister-btn');
      btn.textContent = '🔴 Listening…'; btn.disabled = true;
      SPEECH.listen({
        onresult: transcript => {
          const aligned = U.align(twister, transcript);
          const v = U.verdict(aligned);
          document.getElementById('twister-fb').innerHTML = UI.scoreHTML(aligned) + `<p class="verdict ${v}">${v === 'pass' ? '✅ Nailed it!' : '🟡 Keep practising!'}</p>`;
          _markDone('twister', done, today);

          STORE.addXP(5);
          btn.textContent = '🎤 Say it'; btn.disabled = false;
        },

    document.getElementById('daily-word-done').addEventListener('click', () => {
      _markDone('word', done, today);
      STORE.master('spell_' + word.w, true);
      TRAINER.log({skill: 'vocab', delta: 2, source: 'daily/word'});
      STORE.addXP(5);

    // Quote shadow
    document.getElementById('daily-quote-btn').addEventListener('click', () => {
      if (!SPEECH.canListen()) {
        UI.toast('Mic not available — listen and repeat in your head!', 'info');

        STORE.addXP(5);

              document.getElementById('quote-fb').innerHTML = UI.scoreHTML(aligned);

              STORE.addXP(5);
              btn.textContent = '🎤 Shadow it'; btn.disabled = false;

        fb.innerHTML = correct
          ? `<p class="verdict pass">✅ Correct! ${idiom.meaning}</p><p class="idiom-eg"><em>"${idiom.eg}"</em></p>`
          : `<p class="verdict fail">❌ The meaning is: ${idiom.meaning}</p>`;
        idiomOpts.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
        _markDone('idiom', done, today);
        TRAINER.log({skill: 'vocab', delta: correct ? 2 : -1, source: 'daily/idiom'});
        STORE.addXP(correct ? 5 : 2);
      });
    }
  }
};

function _makeIdiomOpts(idiom) {
  // Build 3 decoy meanings from other idioms
  const others = IDIOMS.filter(i => i.id !== idiom.id).slice(0, 8);
  const pool = [idiom.meaning];
  for (let i = 0; i < others.length && pool.length < 4; i++) {
    if (others[i].meaning !== idiom.meaning) pool.push(others[i].meaning);
  }
  // Shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.map(m =>
    `<button class="opt-btn" data-correct="${m === idiom.meaning ? '1' : '0'}">${m}</button>`
  ).join('');
}

function _markDone(id, done, today) {
  if (done.indexOf(id) === -1) done.push(id);
  STORE.set('daily', {date: today, done: done});
}

/* ── SENTENCE DOCTOR ─────────────────────────────────────────────────── */
var DOCTOR_RULES = [
  {pat: /\b(he|she|it)\s+(go|come|eat|play|work|make|do|have)\b/i, msg: 'Missing third-person -s: "she goes", "he works"'},
  {pat: /\bdid\s+(not\s+)?(went|came|ate|played|worked|made|had)\b/i, msg: 'Use base form after "did/didn\'t": "didn\'t go" (not "didn\'t went")'},
  {pat: /\b(a)\s+[aeiou]/i, msg: 'Use "an" before vowel sounds: "an apple", "an hour"'},
  {pat: /\bmore\s+(bigger|smaller|faster|slower|better|worse)\b/i, msg: 'Double comparison: "better" not "more better"'},
  {pat: /\bI\s+am\s+(agree|disagree|know|think|want|need)\b/i, msg: 'State verb error: "I agree" (not "I am agree")'},
  {pat: /\bmake\s+(a\s+)?homework\b/i, msg: '"Do homework" (not "make homework")'},
  {pat: /\bdo\s+the\s+needful\b/i, msg: 'Dated Indian English: say "please handle this" or "please take care of this"'},
  {pat: /\bkindly\s+revert\b/i, msg: '"Revert" in this sense is Indian English: say "please reply" or "please get back to me"'},
  {pat: /\bI\s+will\s+revert\s+back\b/i, msg: '"Revert" already means "go back": say "I will reply" or "I will get back to you"'},
  {pat: /\bpreponed\b/i, msg: '"Preponed" is not standard English: say "moved earlier" or "rescheduled earlier"'},
  {pat: /\b(myself|yourself)\s+is\b/i, msg: 'Reflexive pronoun as subject: "I am" (not "myself is")'},
  {pat: /\balthough.*\bbut\b|\bbut.*\balthough\b/i, msg: 'Don\'t use "although" and "but" in the same clause: choose one'},
  {pat: /\bvery\s+unique\b/i, msg: '"Unique" is absolute: say "truly unique" or just "unique"'},
  {pat: /\bsince\s+\d+\s+(days?|weeks?|months?)\b/i, msg: 'Use "for" with duration: "for 3 days". Use "since" with a point: "since Monday"'},
  {pat: /\bdoubt\b/i, msg: 'Indian usage: "I have a doubt" → prefer "I have a question" in standard English'},
  {pat: /\bpassout\b/i, msg: '"Passout" as a noun (graduate) is Indian English: say "graduate" or "alumnus"'},
  {pat: /\bI\s+can\s+able\b/i, msg: '"Can able" is incorrect: say "I can do it" or "I am able to do it"'},
  {pat: /\bhe\s+is\s+must\b/i, msg: 'Modals don\'t use "be": "he must come" (not "he is must to come")'},
  {pat: /\bI\s+am\s+having\s+a\s+(doubt|question|problem)\b/i, msg: '"Have" for possession: "I have a question" (not "I am having")'},
  {pat: /\bon\s+the\s+other\s+hand[,\s]+on\s+the\s+other\s+hand\b/i, msg: 'Repeated phrase: use "on one hand... on the other hand"'},
  {pat: /irregardless/i, msg: '"Irregardless" is non-standard: use "regardless"'},
  {pat: /\bsupposably\b/i, msg: 'Incorrect form: use "supposedly"'},
  {pat: /\bflustrated\b/i, msg: 'Blend of "flustered" + "frustrated": say one or the other'},
  {pat: /\bcould\s+of\b/i, msg: '"Could of" is wrong: it\'s "could have" or "could\'ve"'},
  {pat: /\bshould\s+of\b/i, msg: '"Should of" is wrong: it\'s "should have" or "should\'ve"'},
  {pat: /\bwould\s+of\b/i, msg: '"Would of" is wrong: it\'s "would have" or "would\'ve"'},
  {pat: /\bless\s+\w+(s)\b/i, msg: 'For countable nouns, use "fewer" not "less": "fewer mistakes" (not "less mistakes")'},
  {pat: /\bbetween\s+\w+\s+and\s+\w+\s+and\b/i, msg: '"Between" is for two things: use "among" for three or more'},
  {pat: /\bI\s+myself\s+is\b/i, msg: '"I myself am" (not "I myself is")'},
  {pat: /\bthe\s+informations\b/i, msg: '"Information" is uncountable — no plural: "the information"'},

/* ── SRS HELPERS (MISSION 2) ─────────────────────────────────────────── */
const SRS_INTERVALS = [1, 3, 7, 16, 35]; // days, strictly monotonic

function srsSchedule(prefixedKey, correct) {
  const srs = STORE.get('srs') || {};
  const item = srs[prefixedKey] || {interval: 0, due: Date.now()};
  let interval;
  if (correct) {
    // Move to next interval bracket
    const nextIdx = Math.min(item.interval + 1, SRS_INTERVALS.length - 1);
    interval = nextIdx;
  } else {
    // Reset to first interval
    interval = 0;
  }
  srs[prefixedKey] = {
    interval: interval,
    due: Date.now() + SRS_INTERVALS[interval] * 86400000
  };
  STORE.set('srs', srs);
  return srs[prefixedKey];
}

function srsDueItems() {
  const srs = STORE.get('srs') || {};
  const mastery = STORE.get('mastery') || {};
  const now = Date.now();
  const due = [];
  for (const k in srs) {
    if (srs.hasOwnProperty(k) && srs[k].due && srs[k].due <= now) {
      due.push({ key: k, mastery: mastery[k] || 0, srs: srs[k] });
    }
  }
  return due;
}

VIEWS.trainer = {
  render(el) {
    const scores = TRAINER.aggregate();
    const weak = TRAINER.weakestFirst();
    const history = TRAINER.xpHistory();

    // SVG radar
    const skills = TRAINER.SKILLS;
    const cx = 140, cy = 140, r = 110;
    const n = skills.length;
    const radarPoints = skills.map((s, i) => {
      const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
      const val = (scores[s] || 50) / 100;
      return {
        x: cx + r * val * Math.cos(angle),
        y: cy + r * val * Math.sin(angle),
        lx: cx + (r + 24) * Math.cos(angle),
        ly: cy + (r + 24) * Math.sin(angle),
        label: SKILL_META[s] ? SKILL_META[s].label : s,
        score: scores[s],
        color: SKILL_META[s] ? SKILL_META[s].color : '#7c3aed'
      };
    });

    const gridLevels = [0.25, 0.5, 0.75, 1.0];
    let gridSvg = '';
    gridLevels.forEach(lvl => {
      const pts = skills.map((s, i) => {
        const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
        return `${cx + r * lvl * Math.cos(angle)},${cy + r * lvl * Math.sin(angle)}`;
      }).join(' ');
      gridSvg += `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>`;
    });
    skills.forEach((s, i) => {
      const angle = (i / n) * 2 * Math.PI - Math.PI / 2;
      gridSvg += `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(angle)}" y2="${cy + r * Math.sin(angle)}" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>`;
    });

    const radarPoly = radarPoints.map(p => `${p.x},${p.y}`).join(' ');
    const dots = radarPoints.map(p => `<circle cx="${p.x}" cy="${p.y}" r="5" fill="${p.color}"/>`).join('');
    const labels = radarPoints.map(p => `<text x="${p.lx}" y="${p.ly}" fill="white" font-size="10" text-anchor="middle" dominant-baseline="middle">${p.label}</text>`).join('');

    const radarSvg = `<svg viewBox="0 0 280 280" class="radar-svg">
      ${gridSvg}
      <polygon points="${radarPoly}" fill="rgba(124,58,237,0.35)" stroke="#7c3aed" stroke-width="2"/>
      ${dots}
      ${labels}
    </svg>`;

    // Weakness plan
    const planItems = weak.slice(0, 3).map(item => {
      const meta = SKILL_META[item.skill] || {};

      return `<div class="plan-item">
        <span class="plan-icon">${meta.icon || '🎯'}</span>
        <div class="plan-info">
          <strong>${meta.label || item.skill}</strong>
          <span>Score: ${item.score}/100</span>
        </div>
        <a href="#/${routeMap[item.skill] || 'home'}" class="btn-sm">Train →</a>
      </div>`;
    }).join('');

    // XP bar chart (30 days)
    let maxXP = 1;
    history.forEach(h => { if (h.xp > maxXP) maxXP = h.xp; });
    const barChart = `<div class="xp-chart">` +
      history.slice(-30).map(h => {
        const pct = Math.round((h.xp / maxXP) * 100);
        return `<div class="bar-col"><div class="bar" style="height:${pct}%" title="${h.date}: ${h.xp} XP"></div><span class="bar-label">${h.date.slice(8)}</span></div>`;
      }).join('') + `</div>`;

    // Skill score rows
    const skillRows = skills.map(s => {
      const meta = SKILL_META[s] || {};
      const sc = scores[s] || 50;
      return `<div class="skill-row">
        <span class="skill-name">${meta.icon || ''} ${meta.label || s}</span>
        <div class="skill-bar"><div class="skill-fill" style="width:${sc}%;background:${meta.color || '#7c3aed'}"></div></div>
        <span class="skill-pct">${sc}</span>
      </div>`;
    }).join('');

    el.innerHTML = `
    <div class="view-trainer">
      <h1>📊 My Trainer</h1>
      <p class="sub">Your adaptive skill radar — powered by every action you take.</p>

      <div class="trainer-grid">
        <div class="radar-wrap">${radarSvg}</div>
        <div class="trainer-right">
          <h3>🎯 Your Plan (weakest first)</h3>
          <div class="plan-list">${planItems || '<p class="muted">Keep practising to build your radar.</p>'}</div>

        startBtn.disabled = true;

        let seconds = 30;
        let words = [], fillers = 0;
        const FILLERS = ['um','uh','er','ah','like','you know','basically','actually','literally'];

          seconds--;
          timerEl.textContent = '00:' + String(seconds).padStart(2, '0');

        }, 1000);

        SPEECH.listen({

              words = U.tokenise(t);

            }
          },
          onend: () => {
            clearInterval(timer);
            const wpm = Math.round(words.length * 2); // ~30s session

            self._results.push({task: task.label, wpm, fillerRate, words: words.length, fillers});

      document.getElementById('assess-typed-submit').addEventListener('click', () => {

        self._task++;
        self.render(el);
      });
    }
  }

function _renderAssessResult(el, results) {
  let totalWpm = 0, totalFillers = 0, totalWords = 0;
  results.forEach(r => { totalWpm += r.wpm; totalFillers += r.fillers; totalWords += r.words; });
  const avgWpm = Math.round(totalWpm / results.length);
  const fillerRate = totalWords ? totalFillers / totalWords : 0;

  // CEFR calibration from data3.js
  const cefrTable = ASSESSMENT_POOLS.cefr;
  const band = (typeof bandOf === 'function') ? bandOf(avgWpm, fillerRate) : 'A2';

  const rows = results.map((r, i) =>
    `<tr><td>Task ${i+1}: ${r.task}</td><td>${r.wpm}</td><td>${r.fillers}</td><td>${(r.fillerRate * 100).toFixed(1)}%</td></tr>`
  ).join('');

  // 5-row benchmark table
  const bmRows = ['A2','B1','B2','C1','C2'].map(lvl => {
    const b = cefrTable[lvl];
    return `<tr${lvl===band?' class="current-band"':''}><td>${lvl}${lvl===band?' ← you':''}</td><td>${b.minWpm}–${b.maxWpm}</td><td>≤${(b.maxFillerRate*100).toFixed(0)}%</td></tr>`;
  }).join('');

  const report = {date: new Date().toISOString(), avgWpm, fillerRate, band, results};
  STORE.addAssessment(report);
  TRAINER.log({skill: 'fluency', delta: 3, source: 'assessment/complete'});
  STORE.addXP(30);

  // WhatsApp share (INV-2: opt-in network, degrades gracefully)
  const shareText = encodeURIComponent(`I just completed a Speaking Assessment on EngSpell! 🎤\nCEFR Level: ${band}\nAvg WPM: ${avgWpm}\nFiller Rate: ${(fillerRate*100).toFixed(1)}%\nPractise with me: https://engspell.ai`);
  const whatsappUrl = `https://wa.me/?text=${shareText}`;

  el.innerHTML = `
  <div class="view-assess-result">
    <h1>🏆 Assessment Complete!</h1>
    <div class="cefr-badge big">${band}</div>
    <p>Avg WPM: <strong>${avgWpm}</strong> · Filler Rate: <strong>${(fillerRate*100).toFixed(1)}%</strong></p>

    <table class="assess-table">
      <thead><tr><th>Task</th><th>WPM</th><th>Fillers</th><th>Filler %</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>

    <h3>CEFR Benchmarks</h3>
    <table class="assess-table">
      <thead><tr><th>Level</th><th>WPM range</th><th>Max filler %</th></tr></thead>
      <tbody>${bmRows}</tbody>
    </table>

    <div class="result-btns">
      <button onclick="VIEWS.assessment._task=0; VIEWS.assessment._results=[]; VIEWS.assessment.render(document.getElementById('view'))" class="btn-primary">Retake</button>

      <a href="#/trainer" class="btn-link">View Trainer →</a>
    </div>
  </div>`;

  UI.toast(`Assessment done! Band: ${band} · +30 XP`, 'success');
}

    </div>`;

    // Passage selection
    PASSAGES.forEach((p, i) => {
      const btn = document.getElementById(`pass-${i}`);
      if (btn) btn.addEventListener('click', () => { self._idx = i; self.render(el); });
    });

    document.getElementById('tab-comp').addEventListener('click', () => { self._tab = 'comprehension'; self.render(el); });
    document.getElementById('tab-dict').addEventListener('click', () => { self._tab = 'dictation'; self.render(el); });

    if (self._tab === 'comprehension') {
      document.getElementById('listen-slow').addEventListener('click', () => SPEECH.speakSlow(passage.text));
      document.getElementById('show-text').addEventListener('click', () => {
        const t = document.getElementById('listen-text');
        t.style.display = t.style.display === 'none' ? 'block' : 'none';
      });
      // Comprehension answers
      document.querySelectorAll('.comp-opts').forEach(row => {
        row.addEventListener('click', e => {
          const btn = e.target.closest('.opt-btn');
          if (!btn) return;
          const qi = parseInt(btn.dataset.qi, 10);
          const correct = btn.dataset.ans === '1';
          const q = passage.questions[qi];
          document.getElementById(`comp-fb-${qi}`).innerHTML = correct
            ? `<p class="verdict pass">✅ Correct!</p>`
            : `<p class="verdict fail">❌ Answer: ${q.opts[q.ans]}</p>`;
          row.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
          const key = `lsn_${passage.id}_q${qi}`;
          STORE.master(key, correct);
          srsSchedule(key, correct);
          TRAINER.log({skill: 'listening', delta: correct ? 2 : -1, source: 'listening/comp'});
          STORE.addXP(correct ? 5 : 1);
        });
      });
    } else {
      document.getElementById('dict-slow').addEventListener('click', () => SPEECH.speakSlow(passage.dictation));
      document.getElementById('dict-check').addEventListener('click', () => {
        const ans = document.getElementById('dict-input').value.trim();
        const aligned = U.align(passage.dictation, ans);
        const v = U.verdict(aligned);
        document.getElementById('dict-fb').innerHTML = UI.scoreHTML(aligned) + `<p class="verdict ${v}">${v === 'pass' ? '✅ Perfect!' : v === 'almost' ? '🟡 Almost!' : '❌ Try again'}</p>`;
        TRAINER.log({skill: 'listening', delta: v === 'pass' ? 2 : v === 'almost' ? 1 : -1, source: 'listening/dict'});
        STORE.addXP(v === 'pass' ? 8 : 2);
      });
    }
  }
};
